<strong>请您务必在接受本协议，且确信通过账户主体变更的操作，能够实现您所希望的目的，且您能够接受因本次变更行为的相关后果与责任后，再进行后续操作。</strong></p>\n<h2 id=\"一定义和解释\">一、定义和解释</h2>\n<p>1.1 “本平台账户”：是指您在本平台创建、管理的数字账户，以下简称为“本平台账户”、“账户”；</p>\n<p>1.2 “本平台账户持有人”，是指加入并实际管理、控制或持有本平台账户的用户；</p>\n<p>1.3 “本平台账户主体”：本平台账户的<strong>实名认证主体</strong>，对该账户在本平台的一切行为负法律责任；</p>\n<p>1.4 “账户主体变更”：是指某一本平台账户的实名认证主体（原主体），变更为另一实名认证主体（新主体），本协议中简称为“账户主体变更”；</p>\n<p>1.5 本协议下的“账户主体变更”程序、后果，仅适用于依据账户原主体申请发起、且被账户新主体接受的本平台账户实名认证主体变更情形。</p>\n<h2 id=\"二-协议主体内容与生效\">二. 协议主体、内容与生效</h2>\n<p><strong>2.1</strong> 本协议是特定本平台账户的账户持有人（“您”、“原主体”）与本平台之间，就您申请将本次申请主体变更的本平台账户所达成的 Ker <a href=\"#/legal-tos\">《平台使用协议》</a>的权利义务转让给第三方（“新主体”），及相关事宜所达成的一致条款。</p>\n<p><strong>2.2 本协议为附生效条件的协议，仅在以下四个条件同时满足的情况下，</strong> 才对您及本平台产生法律效力：</p>\n<ul>\n<li>2.2.1 您所申请变更的本平台账户已完成了实名认证，且您为该实名认证主体或您是该主体授权可以代表其行事的完全民事权利能力的行为人；</li>\n<li>2.2.2 本平台审核且同意您的账户主体变更申请；</li>\n<li>2.2.3 您申请将账户下权利义务转让给第三方（“新主体”），且担保其同意按照 Ker <a href=\"#/legal-tos\">《平台使用协议》</a>的约定继续履行相应的权利及义务；</li>\n<li><strong>2.2.4 账户的个人实名认证仅能变更为企业实名认证，故新主体仅为企业主体，不能为自然人主体。</strong></li>\n</ul>\n<p><strong>2.3 您与新主体就账户下所有的产品、服务、资金、债权、债务等（统称为“账户下资源”）转让等相关事项，由您与新主体之间另外自行约定。但如果您与新主体之间的约定如与本协议约定冲突的，应优先适用本协议的约定。</strong></p>\n<h2 id=\"三-变更的条件及程序\">三. 变更的条件及程序</h2>\n<p><strong>3.1</strong> 本平台仅接受符合以下条件的账户主体变更申请；</p>\n<ul>\n<li>3.1.1 由于原账户主体发生合并、分立、重组、解散等原因，需要进行账户主体变更的；</li>\n<li>3.1.2 根据生效判决、裁定、裁决、决定等生效法律文书，需要账户主体变更的；</li>\n<li>3.1.3 账户实际主体、持有人与账户实名认证主体不一致，且提供了明确证明的；</li>\n<li>3.1.4 根据法律法规规定，应当进行账户主体变更的；</li>\n<li>3.1.5 本平台经过审慎判断，认为可以进行账户主体变更的其他情形。</li>\n</ul>\n<p><strong>3.2</strong> 您发起账户主体变更，应遵循如下程序要求：</p>\n<ul>\n<li>3.2.1 您应在申请变更的本平台账户下发起账户主体变更申请；</li>\n<li>3.2.2 本平台有权通过手机号、人脸识别等进行二次验证、要求您出具授权证明、以及其他本平台认为有必要的材料，确认本次申请账户主体变更确系当前账户认证主体之意愿；</li>\n<li>3.2.3 您应同意本协议的约定，接受本协议对您具有法律约束力；</li>\n<li>3.2.4 您应遵守与账户主体变更相关的其他本平台规则、制度等的要求。</li>\n</ul>\n<p><strong>3.3 您理解并同意，</strong></p>\n<ul>\n<li><strong>3.3.1 在新主体确认接受且完成实名认证前，您可以取消本账户主体变更流程；</strong></li>\n<li><strong>3.3.2 当新主体确认接受且完成实名认证后，您的撤销或取消请求本平台将不予支持；</strong></li>\n<li><strong>3.3.3 您有义务配合新主体完成账户管理权的转交。</strong></li>\n<li><strong>3.3.4 在您进行账户主体变更期间，本账户下的所有使用行为仍视为原主体的行为，由原主体承担责任和风险。</strong></li>\n</ul>\n<p><strong>3.4 您理解并同意，如果发现以下任一情形的，本平台有权随时终止账户主体变更程序或采取相应处理措施：</strong></p>\n<ul>\n<li><strong>3.4.1 第三方对该账户发起投诉，且尚未处理完毕的；</strong></li>\n<li><strong>3.4.2 该账户正处于国家主管部门的调查中；</strong></li>\n<li><strong>3.4.3 该账户正处于诉讼、仲裁或其他法律程序中；</strong></li>\n<li><strong>3.4.4 该账户下存在与本平台的信控关系、伙伴关系等与原主体身份关联的合作关系的；</strong></li>\n<li><strong>3.4.5 存在其他可能损害国家、社会利益，或者损害本平台或其他第三方权利的情形的；</strong></li>\n<li><strong>3.4.6 该账户因存在频繁变更引起的账户纠纷或账户归属不明确的情形。</strong></li>\n</ul>\n<h2 id=\"四-账户主体变更的影响\">四. 账户主体变更的影响</h2>\n<p><strong>4.1</strong> 当您的账户主体变更申请经本平台同意，且新主体确认并完成实名认证后，该账户主体将完成变更，变更成功以本平台系统记录为准，变更成功后会对您产生如下后果：</p>\n<ul>\n<li><strong>4.1.1 您本账户下的权益转让给变更后的实名主体，权益包括不限于账户控制权、账户下已开通的服务、账户下未消耗的充值金额等；</strong></li>\n<li>4.1.2 该账户及该账户下的全部资源的归属权全部转由新主体拥有。<strong>但本平台有权终止，原主体通过该账户与本平台另行达成的关于优惠政策、信控、伙伴合作等相关事项的合作协议，或与其他本平台账户之间存在的关联关系等；</strong></li>\n<li><strong>4.1.3 本平台不接受您以和新主体之间的协议为由或以其他理由，要求将该账户下一项或多项业务、权益转移给您指定的其他账户的要求；</strong></li>\n<li><strong>4.1.4 本平台有权拒绝您以和新主体之间存在纠纷为由或以其他理由，要求撤销该账户主体变更的请求；</strong></li>\n<li><strong>4.1.5 本平台有权在您与新主体之间就账户管理权发生争议或纠纷时，采取相应措施使得新主体获得该账户的实际管理权。</strong></li>\n</ul>\n<p><strong>4.2 您理解并确认，账户主体变更并不代表您自变更之时起已对该账户下的所有行为和责任得到豁免或减轻：</strong></p>\n<ul>\n<li><strong>4.2.1 您仍应对账户主体变更前，该账户下发生的所有行为承担责任；</strong></li>\n<li><strong>4.2.2 您还需要对于变更之前已经产生，变更之后继续履行的合同及其他事项，对新主体在变更之后的履行行为及后果承担连带责任。</strong></li>\n</ul>\n<h2 id=\"五-双方权利与义务\">五. 双方权利与义务</h2>\n<p><strong>5.1</strong> 您应承诺并保证：</p>\n<ul>\n<li>5.1.1 您在账户主体变更流程中所填写的内容及提交的资料均合法、真实、准确、有效，且不存在任何误导或可能误导本平台同意接受该项账户主体变更申请的行为；</li>\n<li>5.1.2 您不存在利用本平台的账户主体变更服务进行任何违反法律、法规、部门规章和国家政策等，或侵害任何第三方权利的行为；</li>\n<li><strong>5.1.3 您进行账户主体变更的操作不会置本平台于违约或者违法的境地。因该账户主体变更行为而产生的任何纠纷、争议、损失、侵权、违约责任等，本平台不承担法律明确规定外的责任。</strong></li>\n</ul>\n<p><strong>您进一步承诺，如上述原因给本平台造成损失的，您应向本平台承担相应赔偿责任。</strong></p>\n<p><strong>5.2</strong> 您理解并同意：</p>\n<ul>\n<li>5.2.1 本平台有权在您发起申请后的任一时刻，要求您提供书面材料或其他证明，证明您有权进行变更账户主体的操作；</li>\n<li>5.2.2 本平台有权依据自己谨慎的判断来确定您的申请是否符合法律法规或政策的规定及账户协议的约定，如存在违法违规或其他不适宜变更的情形的，本平台有权拒绝；</li>\n<li>5.2.3 本平台有权记录账户实名认证主体变更前后的账户主体、交易流水、合同等相关信息，以遵守法律法规的规定，以及维护自身的合法权益；</li>\n<li>5.2.4 如果您存在违反本协议第 5.1 条的行为的，本平台一经发现，有权直接终止账户主体变更流程，或者撤销已完成的账户主体变更操作，将账户主体恢复为没有进行变更前的状态。</li>\n</ul>\n<h2 id=\"六-附则\">六. 附则</h2>\n<p><strong>6.1</strong> 您理解并接受，本协议的订立、执行和解释及争议的解决均应适用中华人民共和国法律，与法律规定不一致或存在冲突的，该不一致或冲突条款不具有法律约束力。</p>\n<p><strong>6.2</strong> 就本协议内容或其执行发生任何争议，双方应进行友好协商；协商不成时，我们与您任一方均有权提请北京仲裁委员会按照其届时有效仲裁规则进行仲裁，而此仲裁规则由此条款纳入本协议。仲裁语言为中文。仲裁地将为北京。仲裁结果为终局且对双方都有约束力。</p>\n<p><strong>6.3</strong> 本协议如果与双方以前签署的有关条款或者本平台的有关陈述不一致或者相抵触的，以本协议约定为准。</p>\n<p><strong>您在此再次保证已经完全阅读并理解了上述《账户主体变更协议》，并自愿正式进入账户主体变更的后续流程，接受上述条款的约束。</strong></p>"}, "apikey-guide": {"title": "API Key 管理", "lead": "创建和管理 API Key：预算控制、有效期、IP 白名单与调用限制。", "html": "\n<p>API Key 是调用 Ker API 的凭证。进入控制台「API Key 管理」页面，可为不同项目、环境或成员创建独立令牌，并控制每个令牌的调用范围、预算和渠道策略。</p>\n<h2 id=\"创建-key\">创建 Key</h2>\n<ul>\n<li><strong>名称</strong>（必填）：便于识别用途，如「生产环境-对话服务」；</li>\n<li><strong>标签</strong>（选填）：用于项目、环境或用途分类，方便筛选管理。</li>\n</ul>\n<h2 id=\"额度与预算\">额度与预算</h2>\n<p>每个 Key 支持三种用量模式：</p>\n<table><thead><tr><th>模式</th><th>说明</th></tr></thead><tbody>\n<tr><td>无上限</td><td>不限制该 Key 的消耗金额（账户余额仍生效）</td></tr>\n<tr><td>固定总预算</td><td>累计消耗达到预算后，该 Key 不可继续调用</td></tr>\n<tr><td>月度预算</td><td>每月 1 日 00:00（UTC+8）重置，未用额度不结转</td></tr>\n</tbody></table>\n<h2 id=\"有效期\">有效期</h2>\n<p>支持<b>永久、90 天、30 天、24 小时</b>四种有效期。Key 到期后自动禁用，列表中保留记录并标记为「已过期」。</p>\n<h2 id=\"调用限制\">调用限制</h2>\n<ul>\n<li><strong>模型与供应商限制</strong>：默认不限制；开启后该 Key 仅可调用所选模型或所选供应商下的模型，两者同时配置时取交集；</li>\n<li><strong>IP 白名单</strong>：默认不限制来源 IP；开启后仅允许白名单内的 IP 调用，最多添加 10 个；</li>\n<li><strong>渠道选择</strong>：支持默认渠道或指定渠道，并可配置备用渠道；主渠道不可用时是否自动切换由平台路由规则控制。</li>\n</ul>\n<h2 id=\"状态说明\">状态说明</h2>\n<table><thead><tr><th>状态</th><th>说明</th></tr></thead><tbody>\n<tr><td>启用</td><td>可正常调用</td></tr>\n<tr><td>禁用</td><td>手动停用，请求被直接拒绝</td></tr>\n<tr><td>已过期</td><td>超过有效期，自动禁用</td></tr>\n<tr><td>预算耗尽</td><td>已消耗达到预算上限</td></tr>\n</tbody></table>\n<p>非启用状态下的请求会被直接拒绝，并在请求日志中记录拒绝原因。删除 Key 需二次确认，删除后立即失效，历史调用日志与账单保留。</p>\n<div class=\"code-wrap\"><span class=\"copy-btn\" data-copy>复制</span><pre class=\"code\">安全提示：API Key 等同于账户凭证，请勿提交到代码仓库或公开渠道。\n建议为不同业务创建独立 Key，便于隔离、按 Key 统计用量和控制预算。</pre></div>\n"}, "sdk": {"title": "SDK 接入", "lead": "使用 OpenAI / Anthropic 官方 SDK 快速接入 Ker API，仅需替换 base_url。", "html": "\n<p>Ker API 兼容 OpenAI 与 Anthropic 接口协议，使用官方 SDK 时只需替换 <code>base_url</code> 并填入你的 API Key 即可。</p>\n<h2 id=\"openai-sdk\">OpenAI SDK</h2>\n<p>适用于对话、推理、多模态等大多数语言模型接口：</p>\n<div class=\"code-wrap\"><span class=\"copy-btn\" data-copy>复制</span><pre class=\"code\">from openai import OpenAI\n\nclient = OpenAI(\n    api_key=\"你的 API Key\",\n    base_url=\"https://api.kerapi.cn/v1\"\n)\n\nresponse = client.chat.completions.create(\n    model=\"deepseek-ai/DeepSeek-V3.2\",\n    messages=[{\"role\": \"user\", \"content\": \"你好，请介绍一下你自己。\"}]\n)\n\nprint(response.choices[0].message.content)</pre></div>\n<p>Node.js：</p>\n<div class=\"code-wrap\"><span class=\"copy-btn\" data-copy>复制</span><pre class=\"code\">import OpenAI from \"openai\";\n\nconst client = new OpenAI({\n  apiKey: process.env.KER_API_KEY,\n  baseURL: \"https://api.kerapi.cn/v1\"\n});\n\nconst res = await client.chat.completions.create({\n  model: \"deepseek-ai/DeepSeek-V3.2\",\n  messages: [{ role: \"user\", content: \"你好，请介绍一下你自己。\" }]\n});\n\nconsole.log(res.choices[0].message.content);</pre></div>\n<h2 id=\"anthropic-sdk\">Anthropic SDK</h2>\n<p>支持 Anthropic Messages 协议的应用（如 Claude Code、Cline 等），将 base_url 指向 Ker API 即可：</p>\n<div class=\"code-wrap\"><span class=\"copy-btn\" data-copy>复制</span><pre class=\"code\">from anthropic import Anthropic\n\nclient = Anthropic(\n    api_key=\"你的 API Key\",\n    base_url=\"https://api.kerapi.cn\"\n)\n\nmessage = client.messages.create(\n    model=\"deepseek-ai/DeepSeek-V3.2\",\n    max_tokens=1024,\n    messages=[{\"role\": \"user\", \"content\": \"你好，请介绍一下你自己。\"}]\n)\n\nprint(message.content)</pre></div>\n<h2 id=\"常见配置\">常见配置</h2>\n<ul>\n<li><strong>模型名称</strong>：使用模型广场中模型的完整 ID（如 <code>deepseek-ai/DeepSeek-V3.2</code>）；</li>\n<li><strong>流式输出</strong>：设置 <code>stream=True</code>（OpenAI）或 <code>stream=True</code>（Anthropic），以 SSE 形式接收；</li>\n<li><strong>环境变量</strong>：建议将 Key 存储在环境变量中（如 <code>KER_API_KEY</code>），避免硬编码；</li>\n<li><strong>错误处理</strong>：请求失败时错误信息集中在 <code>error.code</code> 与 <code>error.message</code>，详见「API 请求错误排查」。</li>\n</ul>\n"}, "billing-rules": {"title": "计费规则", "lead": "Ker API 的计费方式、价格规则与费用结算说明。", "html": "\n<p>本页说明 Ker API 的计费方式、价格规则以及费用结算逻辑。各模型的具体单价请在模型广场查看。</p>\n<h2 id=\"计费方式\">计费方式</h2>\n<ul>\n<li><strong>语言模型</strong>：按 Token 计费，输入与输出分开计价，总费用 = 输入 Token × 输入单价 + 输出 Token × 输出单价；</li>\n<li><strong>附加用量</strong>：缓存命中、深度推理（思维链）等附加 Token 按对应单价单独计费；</li>\n<li><strong>图像 / 视频 / 音频模型</strong>：按次或按时长计费，部分模型存在字段倍率等附加计费项，以模型详情页展示为准。</li>\n</ul>\n<h2 id=\"价格规则\">价格规则</h2>\n<ul>\n<li>模型价格区分渠道，用户实际价格按<b>渠道基础折扣</b>计算；</li>\n<li>模型价格如有调整，会在生效前通过公告或价格页说明；价格变更前已产生的调用按调用当时的价格结算；</li>\n<li>模型上下架、参数与价格变更等信息均可在「更新公告」中查看。</li>\n</ul>\n<h2 id=\"抵扣顺序\">抵扣顺序</h2>\n<p>账户费用结算时，赠送金额与充值余额的抵扣顺序以平台公示规则为准。系统赠送金额如有有效期，到期后未使用部分将失效。</p>\n<h2 id=\"账单与发票\">账单与发票</h2>\n<ul>\n<li>每次调用的费用明细可在控制台「用量统计」中查询，资金流水可在「账单中心」查看与导出；</li>\n<li>仅已消费金额可申请开票，未消费的充值余额与系统赠送金额不可开票，详见「发票管理」；</li>\n<li>余额不足时调用会失败，请及时充值；充值支持支付宝、微信、银行卡与对公转账，详见「余额充值」。</li>\n</ul>\n"}, "recharge": {"title": "余额充值", "lead": "支持支付宝、微信、银行卡与对公转账充值。", "html": "\n<p>进入控制台「余额充值」页面，可查看当前账户余额与可用余额说明，并选择合适的充值方式。</p>\n<h2 id=\"个人充值\">个人充值</h2>\n<p>支持<b>支付宝、微信、银行卡</b>三种方式。选择充值金额与支付方式后跳转或唤起支付，支付完成后页面返回充值结果。</p>\n<ul>\n<li>充值成功后，页面实时更新账户余额，并生成一条充值记录；</li>\n<li>支付取消、失败或超时会展示明确状态，并提供重试入口；</li>\n<li>如已完成支付但余额未到账，请稍候刷新，或携带支付凭证联系平台处理。</li>\n</ul>\n<h2 id=\"对公转账\">对公转账</h2>\n<p>企业用户可选择对公账户转账。页面展示收款主体、开户行、账号、附言（识别码）与到账说明，请按提示完成转账：</p>\n<ul>\n<li>转账时请务必在附言中填写平台生成的识别码，以便财务核对入账；</li>\n<li>转账完成后，余额在财务核验或系统入账后更新；</li>\n<li>如长时间未到账，请联系平台并提供转账回执。</li>\n</ul>\n<div class=\"code-wrap\"><span class=\"copy-btn\" data-copy>复制</span><pre class=\"code\">注意：充值余额与已消费金额分开统计，未消费的充值余额不可申请开票。</pre></div>\n"}, "billing-center": {"title": "账单中心", "lead": "查询资金流水、系统赠送与退款记录，支持筛选与导出。", "html": "\n<p>「账单中心」集中展示账户资金流水和余额变化，是充值、赠送、退款和财务核对的依据。</p>\n<h2 id=\"筛选与导出\">筛选与导出</h2>\n<ul>\n<li>支持按时间筛选账单记录；</li>\n<li>支持一键导出当前筛选范围内的账单记录，便于企业财务对账。</li>\n</ul>\n<h2 id=\"充值记录\">充值记录</h2>\n<p>展示交易记录 ID、交易时间、交易类型、支付方式、状态和交易金额，可查看单笔充值结果。</p>\n<h2 id=\"系统赠送\">系统赠送</h2>\n<p>展示赠送来源、赠送金额、到账时间、有效期（如有）和当前使用状态。赠送金额仅用于抵扣调用费用，不可申请开票。</p>\n<h2 id=\"退款记录\">退款记录</h2>\n<p>展示退款申请 / 交易 ID、退款时间、退款金额、退款方式和处理状态。</p>\n<div class=\"code-wrap\"><span class=\"copy-btn\" data-copy>复制</span><pre class=\"code\">账单中的金额变动与账户余额、充值结果、发票可开金额保持一致，如有疑问请工单反馈。</pre></div>\n"}};
</script>
<script>
/* ============ Ker API 文档中心 前端 ============ */
let NAV = window.__NAV__;
let DOCS = window.__DOCS__;

const $ = s => document.querySelector(s);
const articleEl = $('#article');
const tocEl = $('#toc');
const flatPages = [];
(function buildFlat(nodes, path) {
  for (const n of nodes) {
    if (n.type === 'folder') {
      buildFlat(n.children, path.concat(n.name));
    } else if (n.slug) {
      flatPages.push({ slug: n.slug, title: n.title, path });
    }
  }
})(NAV, []);

/* ---------- 侧边栏 ---------- */
const ICONS = {
  '使用指南': '🚀', '场景示例': '🧩', 'API手册': '🔌', '条款与协议': '📜',
  '更新公告': '📢', '更多': '✨',
  '对话模型': '💬', '多模态生成': '🎨', '功能特性': '⚡', '常见问题': '❓',
  '开发工具&平台': '🛠️', '翻译工具': '🌐', '对话助手': '🤖', 'AI 应用平台': '🚀',
  '音频内容创作': '🎙️', '高效输入与笔记工具': '📝', '智能体解决方案': '🧠',
  '知识与数据检索': '🔍', '社区场景及应用': '🌟', '社区场景与应用': '🌟',
  '文本系列': '📝', '图像系列': '🖼️', '语音系列': '🔊', '视频系列': '🎬',
  '批量处理': '📦', '平台系列': '⚙️',
};
const ico = n => ICONS[n] ? `<span class="ico">${ICONS[n]}</span>` : '';

function renderSidebar() {
  const el = $('#sidebar');
  el.innerHTML = NAV.map((n, i) => renderNavNode(n, i)).join('');
  el.querySelectorAll('[data-toggle]').forEach(h =>
    h.addEventListener('click', () => h.parentElement.classList.toggle('open')));
}
function renderNavNode(n, i) {
  if (n.type === 'folder') {
    const items = n.children.map((c, j) => renderNavNode(c, `${i}-${j}`)).join('');
    return `<div class="side-folder" data-folder="${i}"><div class="f-head" data-toggle>
      <span class="chev"></span>${ico(n.name)}<span class="f-name">${n.name}</span></div><div class="f-body">${items}</div></div>`;
  }
  if (n.type === 'sep') return `<div class="side-sep">${ico(n.name)}<span>${n.name}</span></div>`;
  if (n.external) return `<a class="side-item" href="#">${n.title}<span class="ext">↗</span></a>`;
  const cls = n.toplevel ? 'side-item side-top' : 'side-item';
  return `<a class="${cls}" data-slug="${n.slug}" href="#/${n.slug}">${ico(n.title)}<span>${n.title}</span></a>`;
}

/* ---------- 页面渲染 ---------- */
let currentPage = null;
function render(slug) {
  const doc = DOCS[slug];
  if (!doc) { location.hash = '#/introduction'; return; }
  currentPage = slug;
  const path = flatPages.find(p => p.slug === slug);
  const crumb = path ? path.path.map(x => `<span>${x}</span>`).join('<span class="sep">/</span>') +
    `<span class="sep">/</span><b>${path.title}</b>` : '';
  articleEl.innerHTML = `
    <div class="crumb">${crumb}</div>
    <h1>${doc.title}</h1>
    ${doc.lead ? `<p class="lead">${doc.lead}</p>` : ''}
    <div class="doc-body">${doc.html}</div>`;
  document.title = doc.title + ' - Ker API 文档中心';
  renderToc();
  highlightSidebar();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}
function highlightSidebar() {
  document.querySelectorAll('.side-item').forEach(a =>
    a.classList.toggle('active', a.dataset.slug === currentPage));
  document.querySelectorAll('.side-folder').forEach(f => f.classList.remove('open'));
  const act = document.querySelector(`.side-item[data-slug="${currentPage}"]`);
  if (act) {
    let p = act.closest('.side-folder');
    while (p) { p.classList.add('open'); p = p.parentElement.closest('.side-folder'); }
  }
  const home = document.querySelector('.side-item[data-slug="introduction"]');
  if (home && !document.querySelector('.side-folder.open')) home.closest('.side-folder')?.classList.add('open');
}

/* ---------- 右侧目录 + 滚动监听 ---------- */
function renderToc() {
  const heads = articleEl.querySelectorAll('h2[id], h3[id]');
  if (!heads.length) { tocEl.innerHTML = ''; return; }
  tocEl.innerHTML = `<div class="t-title">本页目录</div>` + [...heads].map(h =>
    `<a class="${h.tagName === 'H3' ? 'lvl3' : ''}" href="#${h.id}" data-anchor="${h.id}">${h.textContent}</a>`).join('');
  tocEl.querySelectorAll('a').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    const t = document.getElementById(a.dataset.anchor);
    if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 76, behavior: 'smooth' });
  }));
  tocLinks = [...tocEl.querySelectorAll('a')];
}
let tocLinks = [];
let spyTicking = false;
window.addEventListener('scroll', () => {
  if (spyTicking) return;
  spyTicking = true;
  requestAnimationFrame(() => { spyTicking = false; spyToc(); });
});
function spyToc() {
  if (!tocLinks.length) return;
  const y = window.scrollY + 96;
  let cur = tocLinks[0];
  for (const a of tocLinks) {
    const t = document.getElementById(a.dataset.anchor);
    if (t && t.getBoundingClientRect().top + window.scrollY <= y) cur = a;
  }
  tocLinks.forEach(a => a.classList.toggle('on', a === cur));
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex() {
  searchIndex = flatPages.map(p => {
    const d = DOCS[p.slug];
    const div = document.createElement('div');
    div.innerHTML = d.html || '';
    return { slug: p.slug, title: p.title, grp: p.path.join(' / ') || '文档',
             text: (div.textContent || '').replace(/\s+/g, ' ').slice(0, 4000) };
  });
}
const smMask = $('#searchMask'), smModal = $('#searchModal'), smInput = $('#smInput'),
      smList = $('#smList');
let smResults = [], smSel = 0;
function openSearch() {
  if (!searchIndex) buildSearchIndex();
  smMask.classList.add('show'); smModal.classList.add('show');
  smInput.value = ''; doSearch(''); smInput.focus();
}
function closeSearch() { smMask.classList.remove('show'); smModal.classList.remove('show'); }
function doSearch(q) {
  q = q.trim().toLowerCase();
  smSel = 0;
  if (!q) {
    smResults = searchIndex.slice(0, 9);
    smList.innerHTML = smResults.map(renderHit).join('') ||
      '<div class="sm-empty">开始输入以搜索文档</div>';
    return;
  }
  const scored = [];
  for (const it of searchIndex) {
    const ti = it.title.toLowerCase().indexOf(q);
    const xi = it.text.toLowerCase().indexOf(q);
    if (ti === -1 && xi === -1 && !it.grp.toLowerCase().includes(q)) continue;
    let score = 0;
    if (ti === 0) score += 100; else if (ti > 0) score += 60;
    if (xi > -1) score += 20;
    if (it.grp.toLowerCase().includes(q)) score += 10;
    scored.push({ ...it, ti, xi, score });
  }
  scored.sort((a, b) => b.score - a.score);
  smResults = scored.slice(0, 10);
  smList.innerHTML = smResults.length ? smResults.map(renderHit).join('')
    : `<div class="sm-empty">没有找到与 “${escapeHtml(q)}” 相关的文档</div>`;
  markSel();
}
function renderHit(it, i) {
  let snip = '';
  if (it.xi > -1) {
    const s = Math.max(0, it.xi - 40);
    snip = (s > 0 ? '…' : '') + it.text.slice(s, it.xi + 90) + '…';
  } else if (it.text) {
    snip = it.text.slice(0, 100) + '…';
  }
  return `<div class="sm-item" data-i="${i}" onclick="goSearch('${it.slug}')">
    <span class="st">${escapeHtml(it.title)}<span class="grp">${escapeHtml(it.grp)}</span></span>
    <span class="snip">${escapeHtml(snip)}</span></div>`;
}
function markSel() {
  smList.querySelectorAll('.sm-item').forEach((el, i) => el.classList.toggle('sel', i === smSel));
  smList.querySelectorAll('.sm-item')[smSel]?.scrollIntoView({ block: 'nearest' });
}
function goSearch(slug) { closeSearch(); location.hash = '#/' + slug; }
window.goSearch = goSearch;
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ---------- 事件绑定 ---------- */
/* 侧边栏直接点击路由（双保险：不依赖 hashchange） */
$('#sidebar').addEventListener('click', e => {
  const item = e.target.closest('.side-item[data-slug]');
  if (!item) return;
  e.preventDefault();
  const slug = item.dataset.slug;
  if (location.hash !== '#/' + slug) location.hash = '#/' + slug;
  render(slug);
});

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return; }
  if (!smModal.classList.contains('show')) return;
  if (e.key === 'Escape') closeSearch();
  else if (e.key === 'ArrowDown') { e.preventDefault(); smSel = Math.min(smSel + 1, smResults.length - 1); markSel(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); smSel = Math.max(smSel - 1, 0); markSel(); }
  else if (e.key === 'Enter' && smResults[smSel]) goSearch(smResults[smSel].slug);
});
smInput.addEventListener('input', e => doSearch(e.target.value));
smMask.addEventListener('click', closeSearch);
$('#navSearch').addEventListener('click', openSearch);

/* 复制（file:// 下无剪贴板 API，降级 execCommand） */
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise(resolve => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    resolve();
  });
}

const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

/* tabs 与复制按钮（事件委托） */
articleEl.addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (tab) {
    const wrap = tab.parentElement;
    const group = wrap.parentElement.querySelectorAll(':scope > [data-pane]');
    wrap.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    group.forEach(p => p.style.display = p.dataset.pane === tab.dataset.tab ? 'block' : 'none');
    return;
  }
  const btn = e.target.closest('.copy-btn');
  if (btn) {
    const pre = btn.parentElement.querySelector('pre');
    if (!pre) return;
    copyText(pre.innerText).then(() => {
      btn.innerHTML = CHECK_ICON;
      btn.classList.add('copied');
      setTimeout(() => { btn.innerHTML = COPY_ICON; btn.classList.remove('copied'); }, 1200);
    });
  }
});

/* 移动端菜单 */
$('#menuBtn').addEventListener('click', () => $('#sidebar').classList.toggle('mobile-open'));
document.addEventListener('click', e => {
  if (e.target.closest('.side-item') && window.innerWidth <= 820)
    $('#sidebar').classList.remove('mobile-open');
});

/* ---------- 路由 ---------- */
function route() {
  const slug = (location.hash || '').replace(/^#\//, '') || 'introduction';
  if (slug !== currentPage) render(slug);
}
window.addEventListener('hashchange', route);

renderSidebar();
route();

</script>
</body>
</html>
