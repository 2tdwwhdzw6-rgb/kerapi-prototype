ject | object | array</span></td><td><span class=\"req-badge\">必填</span></td><td>待转换的输入内容。支持的形式：<br/>注意：<br/>文本内容对象。<br/>待转换的文本内容。<br/>图片内容对象。<br/>图片 URL 或 base64 编码的图片内容。<br/>内容列表，其中每个项目可以是字符串、文本对象或图片对象。<br/>Item: 嵌入输入列表中的单个项目。　<em>示例：<code>&quot;The quick brown fox&quot;</code></em>　<em>示例：<code>&quot;https://example.com/image.jpg&quot;</code></em>　<em>示例：<code>[&quot;First text&quot;,{&quot;text&quot;:&quot;Second text&quot;},{&quot;image&quot;:&quot;https://example.com/image.jpg&quot;}]</code></em></td></tr><tr><td><code>text</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>待转换的文本内容。　<em>示例：<code>&quot;The quick brown fox&quot;</code></em></td></tr><tr><td><code>image</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>图片 URL 或 base64 编码的图片内容。　<em>示例：<code>&quot;https://example.com/image.jpg&quot;</code></em></td></tr><tr><td><code>encoding_format</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>输出编码格式。可选值：<code>float</code> 或 <code>base64</code>。　<em>可选值：<code>&quot;float&quot; | &quot;base64&quot;</code></em>　<em>示例：<code>&quot;float&quot;</code></em></td></tr><tr><td><code>dimensions</code></td><td><span class=\"type-chip\">integer</span></td><td><span class=\"opt-badge\">可选</span></td><td>输出嵌入向量的维度数。仅 <code>Qwen/Qwen3</code> 系列支持。 - Qwen/Qwen3-Embedding-8B: [64,128,256,512,768,1024,1536,2048,2560,4096] - Qwen/Qwen3-Embedding-4B: [64,128,256,512,768,1024,1536,2048,2560] - Qwen/Qwen3-Embedding-0.6B: [64,128,256,512,768,1024]　<em>示例：<code>1024</code></em></td></tr><tr><td><code>user</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>用户标识符，用于请求追踪和速率限制。　<em>示例：<code>&quot;user_123&quot;</code></em></td></tr><tr><td><code>truncate</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>超长文本的截断方向。可选值：<code>left</code>（左侧截断）或 <code>right</code>（右侧截断）　<em>可选值：<code>&quot;left&quot; | &quot;right&quot;</code></em>　<em>示例：<code>&quot;right&quot;</code></em></td></tr></tbody></table><h3>object</h3><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>text</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>待转换的文本内容。　<em>示例：<code>&quot;The quick brown fox&quot;</code></em></td></tr></tbody></table><h3>object</h3><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>image</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>图片 URL 或 base64 编码的图片内容。　<em>示例：<code>&quot;https://example.com/image.jpg&quot;</code></em></td></tr></tbody></table><h2 id=\"response-body\">Response Body</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>object</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>对象类型，始终为 &quot;list&quot;。　<em>可选值：<code>&quot;list&quot;</code></em></td></tr><tr><td><code>model</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>用于生成嵌入向量的模型名称。</td></tr><tr><td><code>data</code></td><td><span class=\"type-chip\">array&lt;object&gt;</span></td><td><span class=\"req-badge\">必填</span></td><td>模型生成的嵌入向量列表。</td></tr><tr><td><code>usage</code></td><td><span class=\"type-chip\">object</span></td><td><span class=\"req-badge\">必填</span></td><td>请求的使用信息。</td></tr></tbody></table><h2 id=\"examples\">请求示例</h2><h3>示例 1</h3><div><div class=\"tabs\"><span class=\"tab active\" data-tab=\"0\">cURL</span><span class=\"tab\" data-tab=\"1\">Python</span></div><div data-pane=\"0\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">curl -X POST https://api.kerapi.cn/v1/embeddings \\\n  -H \"Authorization: Bearer $KER_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"input\": \"Hello, world!\",\n    \"model\": \"Qwen/Qwen3-VL-Embedding-8B\"\n  }'</pre></div></div><div data-pane=\"1\" style=\"display:none\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">import requests\n\nresponse = requests.post(\n    \"https://api.kerapi.cn/v1/embeddings\",\n    headers={\n        \"Authorization\": \"Bearer $KER_API_KEY\",\n        \"Content-Type\": \"application/json\"\n    },\n    json={\n        \"input\": {\"image\": \"https://example.com/image.jpg\"},\n        \"model\": \"Qwen/Qwen3-VL-Embedding-8B\"\n    }\n)\nprint(response.json())</pre></div></div></div><h3>示例 2</h3><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">curl -X POST https://api.kerapi.cn/v1/embeddings \\\n  -H \"Authorization: Bearer $KER_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"input\": [\n      \"First text\",\n      {\"text\": \"Second text\"},\n      {\"image\": \"https://example.com/image.jpg\"}\n    ],\n    \"model\": \"Qwen/Qwen3-VL-Embedding-8B\",\n    \"dimensions\": 768\n  }'</pre></div><h2 id=\"response-example\">响应示例</h2><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"object\": \"list\",\n  \"model\": \"string\",\n  \"data\": [\n    {\n      \"object\": \"embedding\",\n      \"embedding\": [\n        0\n      ],\n      \"index\": 0\n    }\n  ],\n  \"usage\": {\n    \"prompt_tokens\": 0,\n    \"completion_tokens\": 0,\n    \"total_tokens\": 0\n  }\n}</pre></div><h2 id=\"errors\">错误响应</h2><table><thead><tr><th>状态码</th><th>说明</th><th>示例响应</th></tr></thead><tbody><tr><td><b>400</b></td><td>请求参数错误</td><td><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"code\": 20012,\n  \"message\": \"string\",\n  \"data\": \"string\"\n}</pre></div></td></tr><tr><td><b>401</b></td><td>身份认证失败（API Key 无效）</td><td><code>\"Invalid token\"</code></td></tr><tr><td><b>403</b></td><td>没有权限访问该资源</td><td><code>\"Forbidden\"</code></td></tr><tr><td><b>404</b></td><td>资源不存在</td><td><code>\"404 page not found\"</code></td></tr><tr><td><b>429</b></td><td>触发速率限制</td><td><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"message\": \"Request was rejected due to rate limiting. If you want more, please contact contact@kerapi.cn. Deta</pre></div></td></tr><tr><td><b>503</b></td><td>模型服务过载，请稍后重试</td><td><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"code\": 50505,\n  \"message\": \"Model service overloaded. Please try again later.\",\n  \"data\": \"string\"\n}</pre></div></td></tr><tr><td><b>504</b></td><td>请求超时</td><td><code>\"string\"</code></td></tr></tbody></table>"}, "api-images": {"title": "创建图片生成请求", "lead": "根据给定提示词生成图片。生成图片的 URL 有效期为一小时，请及时下载保存，以免因 URL 过期造成问题。", "html": "<div class=\"endpoint-card\"><span class=\"method m-post\">POST</span><code class=\"ep-path\">https://api.kerapi.cn/v1/images/generations</code><span class=\"lock\">Bearer 认证</span></div><h2 id=\"authorization\">Authorization</h2><p>所有请求需要在 Header 中携带 API Key 进行 Bearer 认证：</p><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">Authorization: Bearer &lt;你的 API Key&gt;</pre></div><h2 id=\"header-parameters\">Header Parameters</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>X-Enable-Watermark</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>是否为 API 生成的图片添加「AI 生成」显式水印（隐式水印固定添加），默认添加。当且仅当开发者需要对生成图片执行下游的进一步处理时，才应显式传入 <code>0</code>；此时，开发者有法定义务自行对最终输出图片添加相关显式水印。　<em>可选值：<code>&quot;0&quot;</code></em></td></tr><tr><td><code>X-Trace-Id</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>请求追踪 ID。可自定义传入用于标记本次请求；若不传入，平台将自动生成。排查问题时，提供该值或响应头中的 x-siliconcloud-trace-id 均可。</td></tr><tr><td><code>traceparent</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>W3C Trace Context 标准追踪头。传入时，平台取其中的 trace-id 作为本次请求的追踪标识。</td></tr></tbody></table><h2 id=\"request-body\">Request Body</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>model</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>对应的模型名称。为更好地提升服务质量，我们会对本服务提供的模型进行定期变更，包括但不限于模型上下线和模型服务能力的调整。在可行的情况下，我们会通过公告或消息推送等适当方式通知您此类变更。<strong>完整可用模型列表请查看 <a href=\"https://console.kerapi.cn/models?types=to-image\">生图模型</a></strong>。　<em>示例：<code>&quot;Qwen/Qwen-Image-Edit-2509&quot;</code></em></td></tr><tr><td><code>prompt</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>用于生成图片的文本提示词。　<em>示例：<code>&quot;an island near sea, with seagulls, moon shining over the sea, light house, boats int he background, fish flying over the sea&quot;</code></em></td></tr><tr><td><code>negative_prompt</code></td><td><span class=\"type-chip\">负面提示词</span></td><td><span class=\"opt-badge\">可选</span></td><td>指定不希望在生成图片中出现的内容。</td></tr><tr><td><code>image_size</code></td><td><span class=\"type-chip\">图片尺寸，格式为 [width]x[height]。</span></td><td><span class=\"opt-badge\">可选</span></td><td>图片分辨率，格式为 &quot;widthxheight&quot;。为确保最佳质量，强烈建议使用对应模型的推荐值。<strong>Qwen/Qwen-Image-Edit-2509 和 Qwen/Qwen-Image-Edit 不支持此字段，其他模型为必填项。</strong>\n推荐值：</td></tr><tr><td><code>seed</code></td><td><span class=\"type-chip\">Seed</span></td><td><span class=\"opt-badge\">可选</span></td><td>随机种子，用于控制生成过程的随机性。使用相同的种子值可以生成相似的图片。</td></tr><tr><td><code>num_inference_steps</code></td><td><span class=\"type-chip\">Number Inference Steps</span></td><td><span class=\"opt-badge\">可选</span></td><td>推理步数。步数越多，生成质量通常越高，但耗时也更长。</td></tr><tr><td><code>guidance_scale</code></td><td><span class=\"type-chip\">Guidance Scale</span></td><td><span class=\"opt-badge\">可选</span></td><td>该值用于控制生成图片与给定提示词的匹配程度。值越高，生成图片越倾向于严格匹配文本提示词；值越低，生成图片越具创意和多样性，可能包含更多意外元素。仅适用于 Kwai-Kolors/Kolors。</td></tr><tr><td><code>cfg</code></td><td><span class=\"type-chip\">CFG Scale</span></td><td><span class=\"opt-badge\">可选</span></td><td>CFG（Classifier-Free Guidance）是一种通过平衡精确度和创造性来调整生成输出与输入提示词匹配程度的技术。该字段仅适用于 Qwen/Qwen-Image 模型。对于生成包含文本的图片，CFG 值必须大于 1。官方配置使用 50 步、CFG 4.0。当 CFG 设置过小时，几乎无法生成文本。</td></tr><tr><td><code>image</code></td><td><span class=\"type-chip\">Upload Image</span></td><td><span class=\"opt-badge\">可选</span></td><td>用于上传的图片可以是 base64 格式或 URL。　<em>可选值：<code>&quot;data:image/png;base64, XXX&quot; | &quot;img_url&quot;</code></em>　<em>示例：<code>&quot;https://inews.gtimg.com/om_bt/Os3eJ8u3SgB3Kd-zrRRhgfR5hUvdwcVPKUTNO6O7sZfUwAA/641&quot;</code></em></td></tr><tr><td><code>image2</code></td><td><span class=\"type-chip\">Upload Image</span></td><td><span class=\"opt-badge\">可选</span></td><td>用于上传的图片可以是 base64 格式或 URL。此字段仅适用于 Qwen/Qwen-Image-Edit-2509。　<em>可选值：<code>&quot;data:image/png;base64, XXX&quot; | &quot;img_url&quot;</code></em>　<em>示例：<code>&quot;https://inews.gtimg.com/om_bt/Os3eJ8u3SgB3Kd-zrRRhgfR5hUvdwcVPKUTNO6O7sZfUwAA/641&quot;</code></em></td></tr><tr><td><code>image3</code></td><td><span class=\"type-chip\">Upload Image</span></td><td><span class=\"opt-badge\">可选</span></td><td>用于上传的图片可以是 base64 格式或 URL。此字段仅适用于 Qwen/Qwen-Image-Edit-2509。　<em>可选值：<code>&quot;data:image/png;base64, XXX&quot; | &quot;img_url&quot;</code></em>　<em>示例：<code>&quot;https://inews.gtimg.com/om_bt/Os3eJ8u3SgB3Kd-zrRRhgfR5hUvdwcVPKUTNO6O7sZfUwAA/641&quot;</code></em></td></tr></tbody></table><h2 id=\"response-body\">Response Body</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>images</code></td><td><span class=\"type-chip\">array&lt;object&gt;</span></td><td><span class=\"opt-badge\">可选</span></td><td></td></tr><tr><td><code>timings</code></td><td><span class=\"type-chip\">object</span></td><td><span class=\"opt-badge\">可选</span></td><td></td></tr><tr><td><code>seed</code></td><td><span class=\"type-chip\">integer</span></td><td><span class=\"opt-badge\">可选</span></td><td></td></tr></tbody></table><h2 id=\"examples\">请求示例</h2><div><div class=\"tabs\"><span class=\"tab active\" data-tab=\"0\">cURL</span><span class=\"tab\" data-tab=\"1\">Python</span></div><div data-pane=\"0\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">curl --request POST \\\n  --url https://api.kerapi.cn/v1/images/generations \\\n  --header 'Authorization: Bearer YOUR_API_KEY' \\\n  --header 'Content-Type: application/json' \\\n  --header 'X-Enable-Watermark: 0' \\\n  --data '{\n    \"model\": \"Kwai-Kolors/Kolors\",\n    \"prompt\": \"an island near sea, with seagulls, moon shining over the sea, light house, boats in the background, fish flying over the sea\",\n    \"image_size\": \"1024x1024\",\n    \"num_inference_steps\": 20,\n    \"guidance_scale\": 7.5\n  }'</pre></div></div><div data-pane=\"1\" style=\"display:none\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">import requests\n\nurl = \"https://api.kerapi.cn/v1/images/generations\"\npayload = {\n    \"model\": \"Kwai-Kolors/Kolors\",\n    \"prompt\": \"an island near sea, with seagulls, moon shining over the sea, light house, boats in the background, fish flying over the sea\",\n    \"image_size\": \"1024x1024\",\n    \"num_inference_steps\": 20,\n    \"guidance_scale\": 7.5,\n    \"image\": \"https://inews.gtimg.com/om_bt/Os3eJ8u3SgB3Kd-zrRRhgfR5hUvdwcVPKUTNO6O7sZfUwAA/641\"\n}\nheaders = {\n    \"Authorization\": \"Bearer YOUR_API_KEY\",\n    \"Content-Type\": \"application/json\"\n}\nresponse = requests.post(url, json=payload, headers=headers)\nprint(response.text)</pre></div></div></div><h2 id=\"response-example\">响应示例</h2><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"images\": [\n    {\n      \"url\": \"string\"\n    }\n  ],\n  \"timings\": {\n    \"inference\": 0.1\n  },\n  \"seed\": 0\n}</pre></div><h2 id=\"errors\">错误响应</h2><table><thead><tr><th>状态码</th><th>说明</th><th>示例响应</th></tr></thead><tbody><tr><td><b>400</b></td><td>请求参数错误</td><td><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"code\": 20012,\n  \"message\": \"string\",\n  \"data\": \"string\"\n}</pre></div></td></tr><tr><td><b>401</b></td><td>身份认证失败（API Key 无效）</td><td><code>\"Invalid token\"</code></td></tr><tr><td><b>403</b></td><td>没有权限访问该资源</td><td><code>\"Forbidden\"</code></td></tr><tr><td><b>404</b></td><td>资源不存在</td><td><code>\"404 page not found\"</code></td></tr><tr><td><b>429</b></td><td>触发速率限制</td><td><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"message\": \"Request was rejected due to rate limiting. If you want more, please contact contact@kerapi.cn. Deta</pre></div></td></tr><tr><td><b>503</b></td><td>模型服务过载，请稍后重试</td><td><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"code\": 50505,\n  \"message\": \"Model service overloaded. Please try again later.\",\n  \"data\": \"string\"\n}</pre></div></td></tr><tr><td><b>504</b></td><td>请求超时</td><td><code>\"string\"</code></td></tr></tbody></table>"}, "api-messages": {"title": "创建对话请求（Anthropic）", "lead": "根据给定的聊天对话创建模型响应。", "html": "<div class=\"endpoint-card\"><span class=\"method m-post\">POST</span><code class=\"ep-path\">https://api.kerapi.cn/v1/messages</code><span class=\"lock\">Bearer 认证</span></div><h2 id=\"authorization\">Authorization</h2><p>所有请求需要在 Header 中携带 API Key 进行 Bearer 认证：</p><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">Authorization: Bearer &lt;你的 API Key&gt;</pre></div><h2 id=\"header-parameters\">Header Parameters</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>X-Trace-Id</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>请求追踪 ID。可自定义传入用于标记本次请求；若不传入，平台将自动生成。排查问题时，提供该值或响应头中的 x-siliconcloud-trace-id 均可。</td></tr><tr><td><code>traceparent</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>W3C Trace Context 标准追踪头。传入时，平台取其中的 trace-id 作为本次请求的追踪标识。</td></tr></tbody></table><h2 id=\"request-body\">Request Body</h2><h3>LLM</h3><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>model</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>对应的模型名称。为更好地提升服务质量，我们会对本服务提供的模型进行定期变更，包括但不限于模型上下线和模型服务能力的调整。在可行的情况下，我们会通过公告或消息推送等适当方式通知您此类变更。<strong>完整可用模型列表请查看 <a href=\"https://console.kerapi.cn/models?types=chat\">对话模型</a></strong>。　<em>示例：<code>&quot;deepseek-ai/DeepSeek-V4-Flash&quot;</code></em></td></tr><tr><td><code>messages</code></td><td><span class=\"type-chip\">array&lt;object&gt;</span></td><td><span class=\"req-badge\">必填</span></td><td>对话消息列表</td></tr><tr><td><code>system</code></td><td><span class=\"type-chip\">string | array&lt;Text&gt;</span></td><td><span class=\"opt-badge\">可选</span></td><td>系统提示词。\n系统提示词是一种为 LLM 提供上下文和指令的方式，例如指定特定的目标或角色。</td></tr><tr><td><code>stop_sequences</code></td><td><span class=\"type-chip\">Stop Sequences</span></td><td><span class=\"opt-badge\">可选</span></td><td>将导致模型停止生成的自定义文本序列。\n我们的模型通常会在自然完成其回合时停止，这将导致响应的 <code>stop_re ": {"title": "创建重排序请求", "lead": "根据与查询的相关性对文档进行重排序。支持文本、图片和视频内容。", "html": "<div class=\"endpoint-card\"><span class=\"method m-post\">POST</span><code class=\"ep-path\">https://api.kerapi.cn/v1/rerank</code><span class=\"lock\">Bearer 认证</span></div><h2 id=\"authorization\">Authorization</h2><p>所有请求需要在 Header 中携带 API Key 进行 Bearer 认证：</p><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">Authorization: Bearer &lt;你的 API Key&gt;</pre></div><h2 id=\"header-parameters\">Header Parameters</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>X-Trace-Id</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>请求追踪 ID。可自定义传入用于标记本次请求；若不传入，平台将自动生成。排查问题时，提供该值或响应头中的 x-siliconcloud-trace-id 均可。</td></tr><tr><td><code>traceparent</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>W3C Trace Context 标准追踪头。传入时，平台取其中的 trace-id 作为本次请求的追踪标识。</td></tr></tbody></table><h2 id=\"request-body\">Request Body</h2><h3>RerankClassicRequest</h3><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>model</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>对应的模型名称。为更好地提升服务质量，我们会对本服务提供的模型进行定期变更，包括但不限于模型上下线和模型服务能力的调整。在可行的情况下，我们会通过公告或消息推送等适当方式通知您此类变更。<strong>完整可用模型列表请查看 <a href=\"https://console.kerapi.cn/models?types=rerank\">重排序模型</a></strong>。　<em>示例：<code>&quot;BAAI/bge-reranker-v2-m3&quot;</code></em></td></tr><tr><td><code>query</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>搜索查询。长度必须 ≥ 1。　<em>示例：<code>&quot;Apple&quot;</code></em></td></tr><tr><td><code>documents</code></td><td><span class=\"type-chip\">string | array</span></td><td><span class=\"req-badge\">必填</span></td><td>待排序的文档列表。支持以下格式：<br/>Item: 重排序输入列表中的单个文档项目。</td></tr><tr><td><code>instruction</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>重排序器的指令。仅 Qwen/Qwen3-Reranker-8B、Qwen/Qwen3-Reranker-4B、Qwen/Qwen3-Reranker-0.6B 支持。长度必须 ≥ 1。　<em>示例：<code>&quot;Please rerank the documents based on the query.&quot;</code></em></td></tr><tr><td><code>top_n</code></td><td><span class=\"type-chip\">integer</span></td><td><span class=\"opt-badge\">可选</span></td><td>返回的最相关文档或索引数量。必须 ≥ 1。　<em>示例：<code>4</code></em></td></tr><tr><td><code>return_documents</code></td><td><span class=\"type-chip\">boolean</span></td><td><span class=\"opt-badge\">可选</span></td><td>如果为 false，响应中不包含文档文本；如果为 true，则包含输入文档文本。默认值为 false。</td></tr><tr><td><code>max_chunks_per_doc</code></td><td><span class=\"type-chip\">integer</span></td><td><span class=\"opt-badge\">可选</span></td><td>从文档内部生成的最大片段数。长文档会被切分为多个片段进行计算，取各片段中的最高分作为文档得分。仅 BAAI/bge-reranker-v2-m3、Pro/BAAI/bge-reranker-v2-m3、netease-youdao/bce-reranker-base_v1 支持此字段。必须 ≥ 1，默认值为 1024。</td></tr><tr><td><code>overlap_tokens</code></td><td><span class=\"type-chip\">integer</span></td><td><span class=\"opt-badge\">可选</span></td><td>文档切分时相邻片段之间的 token 重叠数量。仅 BAAI/bge-reranker-v2-m3、Pro/BAAI/bge-reranker-v2-m3、netease-youdao/bce-reranker-base_v1 支持此字段。必须在 0 到 80 之间。</td></tr></tbody></table><h3>RerankVLRequest</h3><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>model</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>多模态重排序的模型名称。支持模型：Qwen/Qwen3-VL-Reranker-8B　<em>示例：<code>&quot;Qwen/Qwen3-VL-Reranker-8B&quot;</code></em></td></tr><tr><td><code>query</code></td><td><span class=\"type-chip\">string | object</span></td><td><span class=\"req-badge\">必填</span></td><td>搜索查询。支持文本字符串或内容对象。<br/>长度必须 ≥ 1。</td></tr><tr><td><code>documents</code></td><td><span class=\"type-chip\">array&lt;string | object | object&gt;</span></td><td><span class=\"req-badge\">必填</span></td><td>待排序的文档列表。每个项目可以是文本字符串或内容对象。<br/>至少需要 1 个文档。<br/>Item: 多模态重排序输入列表中的单个文档项目。　<em>示例：<code>[&quot;apple&quot;,&quot;banana&quot;,&quot;fruit&quot;,&quot;vegetable&quot;]</code></em></td></tr><tr><td><code>instruction</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>重排序器的指令。仅 Qwen/Qwen3-Reranker-8B、Qwen/Qwen3-Reranker-4B、Qwen/Qwen3-Reranker-0.6B 支持。长度必须 ≥ 1。　<em>示例：<code>&quot;Please rerank the documents based on the query.&quot;</code></em></td></tr><tr><td><code>top_n</code></td><td><span class=\"type-chip\">integer</span></td><td><span class=\"opt-badge\">可选</span></td><td>返回的最相关文档或索引数量。必须 ≥ 1。　<em>示例：<code>4</code></em></td></tr><tr><td><code>return_documents</code></td><td><span class=\"type-chip\">boolean</span></td><td><span class=\"opt-badge\">可选</span></td><td>如果为 false，响应中不包含文档文本；如果为 true，则包含输入文档文本。默认值为 false。</td></tr><tr><td><code>max_chunks_per_doc</code></td><td><span class=\"type-chip\">integer</span></td><td><span class=\"opt-badge\">可选</span></td><td>从单个文档生成的最大片段数。必须 ≥ 1，默认值为 1024。</td></tr><tr><td><code>overlap_tokens</code></td><td><span class=\"type-chip\">integer</span></td><td><span class=\"opt-badge\">可选</span></td><td>文档切分时相邻片段之间的 token 重叠数量。必须在 0 到 80 之间。</td></tr></tbody></table><h2 id=\"response-body\">Response Body</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>id</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>响应的唯一标识符。　<em>示例：<code>&quot;rerank-20240115-abc123def456&quot;</code></em></td></tr><tr><td><code>results</code></td><td><span class=\"type-chip\">array&lt;object&gt;</span></td><td><span class=\"req-badge\">必填</span></td><td>按相关性分数排序的重排序结果列表。<br/>Item: 单个重排序结果。</td></tr><tr><td><code>meta</code></td><td><span class=\"type-chip\">object</span></td><td><span class=\"opt-badge\">可选</span></td><td>重排序响应的元数据。</td></tr></tbody></table><h2 id=\"examples\">请求示例</h2><h3>示例 1</h3><div><div class=\"tabs\"><span class=\"tab active\" data-tab=\"0\">cURL</span><span class=\"tab\" data-tab=\"1\">Python</span></div><div data-pane=\"0\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">curl -X POST https://api.kerapi.cn/v1/rerank \\\n  -H \"Authorization: Bearer $KER_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"BAAI/bge-reranker-v2-m3\",\n    \"query\": \"Apple\",\n    \"documents\": [\"apple\", \"banana\", \"fruit\", \"vegetable\"],\n    \"return_documents\": true,\n    \"top_n\": 4\n  }'</pre></div></div><div data-pane=\"1\" style=\"display:none\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">import os\nimport requests\n\nurl = \"https://api.kerapi.cn/v1/rerank\"\nheaders = {\n    \"Authorization\": f\"Bearer {os.environ.get('KER_API_KEY')}\",\n    \"Content-Type\": \"application/json\"\n}\npayload = {\n    \"model\": \"Qwen/Qwen3-VL-Reranker-8B\",\n    \"query\": {\"image\": \"https://example.com/query-image.jpg\"},\n    \"documents\": [\n        {\"image\": \"https://example.com/doc1.jpg\"},\n        \"这是一个相关的文本文档...\"\n    ],\n    \"max_chunks_per_doc\": 512\n}\n\nresponse = requests.post(url, json=payload, headers=headers)\nprint(response.json())</pre></div></div></div><h3>示例 2</h3><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">curl -X POST https://api.kerapi.cn/v1/rerank \\\n  -H \"Authorization: Bearer $KER_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"Qwen/Qwen3-Reranker-8B\",\n    \"query\": \"找出最相关的技术文档\",\n    \"documents\": [\"文档1\", \"文档2\", \"文档3\"],\n    \"instruction\": \"优先考虑最新发布的内容\",\n    \"overlap_tokens\": 20\n  }'</pre></div><h2 id=\"response-example\">响应示例</h2><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"id\": \"rerank-20240115-abc123def456\",\n  \"results\": [\n    {\n      \"index\": 1,\n      \"document\": {\n        \"text\": \"深度学习是机器学习的子集...\"\n      },\n      \"relevance_score\": 0.85\n    }\n  ],\n  \"meta\": {\n    \"tokens\": {\n      \"input_tokens\": 150,\n      \"output_tokens\": 10,\n      \"image_tokens\": 0\n    },\n    \"billed_units\": {\n      \"input_tokens\": 150,\n      \"output_tokens\": 10,\n      \"image_tokens\": 0,\n      \"search_units\": 1,\n      \"classifications\": 0\n    }\n  }\n}</pre></div><h2 id=\"errors\">错误响应</h2><table><thead><tr><th>状态码</th><th>说明</th><th>示例响应</th> "</code></td></tr></tbody></table>"}, "api-transcriptions": {"title": "创建语音转文本请求", "lead": "创建音频转录。", "html": "<div class=\"endpoint-card\"><span class=\"method m-post\">POST</span><code class=\"ep-path\">https://api.kerapi.cn/v1/audio/transcriptions</code><span class=\"lock\">Bearer 认证</span></div><h2 id=\"authorization\">Authorization</h2><p>所有请求需要在 Header 中携带 API Key 进行 Bearer 认证：</p><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">Authorization: Bearer &lt;你的 API Key&gt;</pre></div><h2 id=\"header-parameters\">Header Parameters</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>X-Trace-Id</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>请求追踪 ID。可自定义传入用于标记本次请求；若不传入，平台将自动生成。排查问题时，提供该值或响应头中的 x-siliconcloud-trace-id 均可。</td></tr><tr><td><code>traceparent</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>W3C Trace Context 标准追踪头。传入时，平台取其中的 trace-id 作为本次请求的追踪标识。</td></tr></tbody></table><h2 id=\"request-body\">Request Body</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>file</code></td><td><span class=\"type-chip\">file</span></td><td><span class=\"req-badge\">必填</span></td><td>要转录的音频文件对象（不是文件名）。\n文件上传规格限制为：<strong>时长不超过 1 小时，文件大小不超过 50MB</strong>。　<em>示例：<code>&quot;/path/to/file/audio.mp3&quot;</code></em></td></tr><tr><td><code>model</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>对应的模型名称。为更好地提升服务质量，我们会对本服务提供的模型进行定期变更，包括但不限于模型上下线和模型服务能力的调整。在可行的情况下，我们会通过公告或消息推送等适当方式通知您此类变更。　<em>可选值：<code>&quot;FunAudioLLM/SenseVoiceSmall&quot; | &quot;TeleAI/TeleSpeechASR&quot;</code></em>　<em>示例：<code>&quot;FunAudioLLM/SenseVoiceSmall&quot;</code></em></td></tr></tbody></table><h2 id=\"response-body\">Response Body</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>text</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>音频转录后的文本内容。</td></tr></tbody></table><h2 id=\"examples\">请求示例</h2><div><div class=\"tabs\"><span class=\"tab active\" data-tab=\"0\">cURL</span><span class=\"tab\" data-tab=\"1\">Python</span></div><div data-pane=\"0\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">curl --request POST \\\n  --url https://api.kerapi.cn/v1/audio/transcriptions \\\n  -H \"Authorization: Bearer YOUR_API_KEY\" \\\n  -F \"file=@path/to/your/audio.mp3\" \\\n  -F \"model=FunAudioLLM/SenseVoiceSmall\"</pre></div></div><div data-pane=\"1\" style=\"display:none\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">import requests\n\nurl = \"https://api.kerapi.cn/v1/audio/transcriptions\"\nheaders = {\"Authorization\": \"Bearer YOUR_API_KEY\"}\nwith open(\"path/to/your/audio.mp3\", \"rb\") as audio_file:\n    files = {\n        \"file\": (\"audio.mp3\", audio_file),\n        \"model\": (None, \"FunAudioLLM/SenseVoiceSmall\")\n    }\n    response = requests.post(url, headers=headers, files=files)\n    print(response.text)</pre></div></div></div><h2 id=\"response-example\">响应示例</h2><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"text\": \"string\"\n}</pre></div><h2 id=\"errors\">错误响应</h2><table><thead><tr><th>状态码</th><th>说明</th><th>示例响应</th></tr></thead><tbody><tr><td><b>400</b></td><td>请求参数错误</td><td><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"code\": 20012,\n  \"message\": \"string\",\n  \"data\": \"string\"\n}</pre></div></td></tr><tr><td><b>401</b></td><td>身份认证失败（API Key 无效）</td><td><code>\"Invalid token\"</code></td></tr><tr><td><b>403</b></td><td>没有权限访问该资源</td><td><code>\"Forbidden\"</code></td></tr><tr><td><b>404</b></td><td>资源不存在</td><td><code>\"404 page not found\"</code></td></tr><tr><td><b>429</b></td><td>触发速率限制</td><td><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"message\": \"Request was rejected due to rate limiting. If you want more, please contact contact@kerapi.cn. Deta</pre></div></td></tr><tr><td><b>503</b></td><td>模型服务过载，请稍后重试</td><td><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"code\": 50505,\n  \"message\": \"Model service overloaded. Please try again later.\",\n  \"data\": \"string\"\n}</pre></div></td></tr><tr><td><b>504</b></td><td>请求超时</td><td><code>\"string\"</code></td></tr></tbody></table>"}, "api-video-status": {"title": "获取视频生成链接请求", "lead": "获取用户生成的视频。生成视频的 URL 有效期为一小时，请及时下载保存，以免因 URL 过期造成问题。", "html": "<div class=\"endpoint-card\"><span class=\"method m-post\">POST</span><code class=\"ep-path\">https://api.kerapi.cn/v1/video/status</code><span class=\"lock\">Bearer 认证</span></div><h2 id=\"authorization\">Authorization</h2><p>所有请求需要在 Header 中携带 API Key 进行 Bearer 认证：</p><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">Authorization: Bearer &lt;你的 API Key&gt;</pre></div><h2 id=\"request-body\">Request Body</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>requestId</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>接口提交返回的 requestId。</td></tr></tbody></table><h2 id=\"response-body\">Response Body</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>status</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>操作状态。可选值：&#x27;Succeed&#x27;（成功）、&#x27;InQueue&#x27;（排队中）、&#x27;InProgress&#x27;（进行中）、&#x27;Failed&#x27;（失败）。　<em>可选值：<code>&quot;Succeed&quot; | &quot;InQueue&quot; | &quot;InProgress&quot; | &quot;Failed&quot;</code></em></td></tr><tr><td><code>reason</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>失败原因说明。当 status 为 Failed 时返回。</td></tr><tr><td><code>results</code></td><td><span class=\"type-chip\">object</span></td><td><span class=\"opt-badge\">可选</span></td><td></td></tr></tbody></table><h2 id=\"examples\">请求示例</h2><div><div class=\"tabs\"><span class=\"tab active\" data-tab=\"0\">cURL</span><span class=\"tab\" data-tab=\"1\">Python</span></div><div data-pane=\"0\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">curl --request POST \\\n  --url https://api.kerapi.cn/v1/video/status \\\n  --header 'Authorization: Bearer YOUR_API_KEY' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"requestId\": \"c13b5dd0-xxxx-xxxx-xxxx-xxxxxxxxxxxx\"\n  }'</pre></div></div><div data-pane=\"1\" style=\"display:none\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">import requests\n\nurl = \"https://api.kerapi.cn/v1/video/status\"\npayloa >必填</th><th>说明</th></tr></thead><tbody><tr><td><code>model</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>对应的模型名称。为更好地提升服务质量，我们会对本服务提供的模型进行定期变更，包括但不限于模型上下线和模型服务能力的调整。在可行的情况下，我们会通过公告或消息推送等适当方式通知您此类变更。<strong>完整可用模型列表请查看 <a href=\"https://console.kerapi.cn/models?types=to-video\">视频生成模型</a></strong>。　<em>可选值：<code>&quot;Wan-AI/Wan2.2-I2V-A14B&quot; | &quot;Wan-AI/Wan2.2-T2V-A14B&quot;</code></em>　<em>示例：<code>&quot;Wan-AI/Wan2.2-I2V-A14B&quot;</code></em></td></tr><tr><td><code>prompt</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>用于生成视频描述的文本提示词。</td></tr><tr><td><code>negative_prompt</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>负面提示词</td></tr><tr><td><code>image_size</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>生成视频的分辨率。　<em>可选值：<code>&quot;1280x720&quot; | &quot;720x1280&quot; | &quot;960x960&quot;</code></em></td></tr><tr><td><code>image</code></td><td><span class=\"type-chip\">Upload Image</span></td><td><span class=\"opt-badge\">可选</span></td><td>当使用模型 Wan-AI/Wan2.2-I2V-14B-720P 时，image 参数为必填项。　<em>可选值：<code>&quot;data:image/png;base64, XXX&quot; | &quot;img_url&quot;</code></em>　<em>示例：<code>&quot;https://inews.gtimg.com/om_bt/Os3eJ8u3SgB3Kd-zrRRhgfR5hUvdwcVPKUTNO6O7sZfUwAA/641&quot;</code></em></td></tr><tr><td><code>seed</code></td><td><span class=\"type-chip\">integer</span></td><td><span class=\"opt-badge\">可选</span></td><td>随机数生成器的种子值。</td></tr></tbody></table><h2 id=\"response-body\">Response Body</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>requestId</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>调用状态接口时需要使用本次请求生成的 requestId。</td></tr></tbody></table><h2 id=\"examples\">请求示例</h2><div><div class=\"tabs\ re class=\"code\">{\n  \"code\": 20012,\n  \"message\": \"string\",\n  \"data\": \"string\"\n}</pre></div></td></tr><tr><td><b>401</b></td><td>身份认证失败（API Key 无效）</td><td><code>\"Invalid token\"</code></td></tr><tr><td><b>403</b></td><td>没有权限访问该资源</td><td><code>\"Forbidden\"</code></td></tr><tr><td><b>404</b></td><td>资源不存在</td><td><code>\"404 page not found\"</code></td></tr><tr><td><b>429</b></td><td>触发速率限制</td><td><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"message\": \"Request was rejected due to rate limiting. If you want more, please contact contact@kerapi.cn. Deta</pre></div></td></tr><tr><td><b>503</b></td><td>模型服务过载，请稍后重试</td><td><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"code\": 50505,\n  \"message\": \"Model service overloaded. Please try again later.\",\n  \"data\": \"string\"\n}</pre></div></td></tr><tr><td><b>504</b></td><td>请求超时</td><td><code>\"string\"</code></td></tr></tbody></table>"}, "api-voice-upload": {"title": "上传参考音频", "lead": "上传用户提供的音色风格，支持 base64 编码或文件格式。", "html": "<div class=\"endpoint-card\"><span class=\"method m-post\">POST</span><code class=\"ep-path\">https://api.kerapi.cn/v1/uploads/audio/voice</code><span class=\"lock\">Bearer 认证</span></div><h2 id=\"authorization\">Authorization</h2><p>所有请求需要在 Header 中携带 API Key 进行 Bearer 认证：</p><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">Authorization: Bearer &lt;你的 API Key&gt;</pre></div><h2 id=\"header-parameters\">Header Parameters</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>X-Trace-Id</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>请求追踪 ID。可自定义传入用于标记本次请求；若不传入，平台将自动生成。排查问题时，提供该值或响应头中的 x-siliconcloud-trace-id 均可。</td></tr><tr><td><code>traceparent</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>W3C Trace Context 标准追踪头。传入时，平台取其中的 trace-id 作为本次请求的追踪标识。</td></tr></tbody></table><h2 id=\"request-body\">Request Body</h2><h3>Base64 encoding of audio</h3><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>model</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>预定义音色风格模型名称　<em>示例：<code>&quot;FunAudioLLM/CosyVoice2-0.5B&quot;</code></em></td></tr><tr><td><code>customName</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>用户自定义音色风格名称　<em>示例：<code>&quot;your-voice-name&quot;</code></em></td></tr><tr><td><code>text</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>音频对应的文本内容　<em>示例：<code>&quot;在一无所知中, 梦里的一天结束了，一个新的轮回便会开始&quot;</code></em></td></tr><tr><td><code>audio</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>以 base64 编码的音频文件，头部格式为 <code>data:audio/mpeg;base64</code>　<em>示例：<code>&quot;data:audio/mpeg;base64,aGVsbG93b3JsZA==&quot;</code></em></td></tr></tbody></table><h3>File upload for audio</h3><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>model</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>预定义音色风格模型名称　<em>示例：<code>&quot;FunAudioLLM/CosyVoice2-0.5B&quot;</code></em></td></tr><tr><td><code>customName</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>用户自定义音色风格名称　<em>示例：<code>&quot;your-voice-name&quot;</code></em></td></tr><tr><td><code>text</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>音频对应的文本内容　<em>示例：<code>&quot;在一无所知中, 梦里的一天结束了，一个新的轮回便会开始&quot;</code></em></td></tr><tr><td><code>file</code></td><td><span class=\"type-chip\">file</span></td><td><span class=\"opt-badge\">可选</span></td><td>要上传的文件　<em>示例：<code>&quot;/path/to/audio.mp3&quot;</code></em></td></tr></tbody></table><h2 id=\"response-body\">Response Body</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>uri</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>　<em>示例：<code>&quot;speech:your-voice-name:xxx:xxx&quot;</code></em></td></tr></tbody></table><h2 id=\"examples\">请求示例</h2><div><div class=\"tabs\"><span class=\"tab active\" data-tab=\"0\">cURL</span><span class=\"tab\" data-tab=\"1\">Python</span></div><div data-pane=\"0\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">curl -X POST \"https://api.kerapi.cn/v1/uploads/audio/voice\" \\\n  -H \"Authorization: Bearer YOUR_API_KEY\" \\\n  -F \"file=@test.mp3\" \\\n  -F \"model=IndexTeam/IndexTTS-2\" \\\n  -F \"customName=your-voice-name\" \\\n  -F \"text=慢工出细活，再给我两分钟，你马上就能见识到超梦分析的厉害了\"</pre></div></div><div data-pane=\"1\" style=\"display:none\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">import requests\n\nurl = \"https://api.kerapi.cn/v1/uploads/audio/voice\"\nheaders = {\n    \"Authorization\": \"Bearer YOUR_API_KEY\"\n}\nfiles = {\n    \"file\": open(\"test.mp3\", \"rb\")\n}\ndata = {\n    \"model\": \"IndexTeam/IndexTTS-2\",\n    \"customName\": \"your-voice-name\",\n    \"text\": \"慢工出细活，再给我两分钟，你马上就能见识到超梦分析的厉害了\"\n}\n\nresponse = requests.post(url, headers=headers, files=files, data=data)\nprint(response.text)</pre></div></div></div><h2 id=\"response-example\">响应示例</h2><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"uri\": \"speech:your-voice-name:xxx:xxx\"\n}</pre></div><h2 id=\"errors\">错误响应</h2><table><thead><tr><th>状态码</th><th>说明</th><th>示例响应</th></tr></thead><tbody><tr><td><b>400</b></td><td>请求参数错误</td><td><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\" 邮箱或第三方平台账号）</td><td>用于帮助您完成本平台的账号注册与登录；用于用户消息告知、身份验证、安全验证等。</td><td>您主动提供的信息</td></tr><tr><td>2</td><td>实名认证</td><td>（1）个人用户：真实姓名、身份证件类型及证件号码；（2）企业用户（法定代表人认证）：企业名称、统一社会信用代码、法定代表人姓名、法定代表人身份证号；（3）企业用户（对公打款认证）：企业名称、统一社会信用代码、法定代表人姓名、开户行、开户行账号。</td><td>根据相关法律法规的规定，验证您的真实身份。</td><td>您主动提供，及第三方（支付宝/E签宝）收集的信息</td></tr><tr><td>3</td><td>余额充值</td><td>您的订单信息（包括商品类型、订单流水号、下单时间、支付金额）、您在第三方（微信）的支付单号、支付状态等</td><td>用于完成交易及提供对账服务。</td><td>您主动提供，及我们主动收集的信息</td></tr><tr><td>4</td><td>大模型 API 调用与推理服务</td><td>IP地址、调用的模型名称、Token消耗量、请求时间及请求状态码等日志信息</td><td>用于完成大模型推理计算、计费扣减、并发调度及保障系统的安全与稳定性。</td><td>我们主动收集的信息</td></tr><tr><td>5</td><td>平台内容安全与风控</td><td>使用行为信息（包括API调用频率、并发量、异常请求日志）、输入提示词（Prompt）和输出内容</td><td>基于保障平台算力资源不被滥用及履行生成式人工智能内容安全法定义务，进行自动化安全审核以识别和拦截违法违规内容。</td><td>我们主动收集的信息</td></tr><tr><td>6</td><td>改善和优化服务及保障账户安全</td><td>（1）设备信息：设备型号、硬件序列号、设备MAC地址、操作系统版本、设备设置、唯一设备识别码（IDFA、Android ID、GID、OAID、VAID、AAID、UAID、SIM信息）、UUID、必要的移动应用列表信息、应用运行列表、软硬件及设备、设备环境信息、设备所在位置相关信息（WLAN接入点和基站传感器信息)；（2）日志信息：分辨率、时区和语言等设备信息、网络接入方式及类型信息、网页浏览记录、使用频率、崩溃数据、使用情况及相关性能数据信息。</td><td>了解产品适配性、确保操作环境安全、识别账户异常状态，用于分析产品使用状况、排查崩溃原因、改进产品，以及保障账户和系统安全。</td><td>我们或第三方（网易易盾）主动收集的信息</td></tr><tr><td>7</td><td>发票开具</td><td>开票金额、费用项目名称、抬头名称和税号、邮箱、手机号</td><td>为您提供发票开具服务。</td><td>您主动提供的信息</td></tr><tr><td>8</td><td>工单反馈</td><td>接受反馈的邮箱、问题描述及相关附件、用户咨询记录、报障记录和针对用户故障的排障过程（如通信或通话记录）</td><td>及时响应您的帮助请求，解决您的问题并改进服务。</td><td>您主动提供，及我们主动收集的信息</td></tr><tr><td>9</td><td>商务合作</td><td>您的姓名、联系电话、所在企业或组织名称、邮箱及具体的需求内容</td><td>与您取得联系并建立商业合作。</td><td>您主动提供的信息</td></tr></tbody></table>"}, "legal-privacy": {"title": "隐私政策", "lead": "更新日期：2026 年 7 月 30 日", "html": "<p>引言：</p>\n<p>欢迎您（“您”的定义同<a href=\"#/legal-tos\">《平台使用协议》</a>）使用 Ker 平台。本《隐私政策》（以下简称“本政策”）适用于【公司主体名称占位】（以下简称“Ker”或“我们”）运营的 Ker平台（域名：kerapi.cn，以下统称“本平台”）的相关产品与服务。鉴于此，我们制定本《隐私政策》。本政策仅适用于我们所收集的个人信息。本平台可能包含第三方网站、应用程序提供的服务或链接，本政策不适用于第三方向您提供的任何产品或服务，您在访问第三方服务时需遵守其另行说明的隐私政策（如有）。此外，如您（或您代表的企业等经营实体）借助我们的产品或服务为您自己的客户提供服务，您需自行制定符合交易场景及相关法律的隐私政策。</p>\n<p>我们深知个人信息对您的重要性，并会尽全力保护您的个人信息安全可靠。我们致力于维持您对我们的信任，恪守以下原则，保护您的个人信息：权责一致原则、目的明确原则、选择同意原则、最小必要原则、确保安全原则、主体参与原则、公开透明原则等。同时，我们承诺，我们将按业界成熟的安全标准，采取相应的安全保护措施来保护您的个人信息与交互数据。</p>\n<p>本政策中，“个人信息”是指以电子或者其他方式记录的与已识别或者可识别的自然人有关的各种信息，不包括匿名化处理后的信息。“敏感个人信息”是指一旦泄露或者非法使用，容易导致自然人的人格尊严受到侵害或者人身、财产安全受到危害的个人信息，包括生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹等信息，以及未成年人的个人信息。对于“个人敏感信息”，我们采用 <strong>加粗</strong> 的书写方式进行提示。</p>\n<p>【特别提示】</p>\n<p>在您注册、登录及使用我们的产品/服务前，请您务必先仔细阅读和理解本政策，特别应重点阅读我们以粗体标识的条款，在确认充分理解并同意后再开始使用。如果您不同意本政策，您应当立即停止使用我们的服务。当您选择使用我们的服务时，即视为您接受和认可我们按照本政策对您的相关信息进行处理。</p>\n<p>您通过本平台提供的服务与开源模型、第三方网站、软件、应用程序或服务之间进行输入、反馈、修正、加工、存储、上传、下载、分发相关个人资料信息、视频、图像、音频、评论、问题和其他内容、文件、数据和信息等均为您的业务和客户数据（“交互数据”），您完全拥有您的交互数据。本平台作为中立的技术服务提供者，只会严格执行您的指示处理您的交互数据，我们及本平台只是作为交互数据的被动技术支持者或渠道，除非法律法规另有规定、依据特定产品规则另行约定或基于您的要求为您提供技术协助进行故障排除或解决技术问题。我们及本平台不会对您的交互数据进行任何非授权的使用或披露，同时亦不会进行任何存储。</p>\n<p>您应对您的交互数据来源及内容负责，我们提示您谨慎判断数据来源及内容的合法性。您应保证有权授权本平台通过提供技术服务对该等交互数据进行处理，且前述处理活动均符合相关法律法规的要求，不存在任何违法违规、侵权或违反与第三方合同约定的情形，亦不会将数据用于违法违规目的。若因您的交互数据内容或您处理以及您授权本平台处理交互数据的行为违反法律法规、部门规章或国家政策而造成的全部结果及责任均由您自行承担。</p>\n<p>本政策帮助您了解如下内容</p>\n<h2 id=\"一我们如何收集和使用您的个人信息\">一、我们如何收集和使用您的个人信息</h2>\n<h3 id=\"一基本业务功能一用户注册的个人信息收集使用规则\">（一）基本业务功能一：“用户注册”的个人信息收集使用规则</h3>\n<p>为帮助您完成本平台的用户注册与登录，您可通过短信验证等方式注册至本平台，您需要向我们提供的必要信息包括：您的手机号码、验证码。为方便登录操作，您亦可选择通过绑定邮箱或微信等第三方平台账号登录本平台，届时我们将会收集您的邮箱地址和第三方平台账号信息（如OpenID）。收集这些信息是为了帮助您完成本平台的注册与登录，若您不提供这类信息，您可能无法正常使用我们的服务。</p>\n<p>您知悉并同意，对于您在使用产品及/或服务的过程中提供的您的联系方式（即手机及电子邮箱），我们在运营中可能会向其中的一种或多种发送通知，用于用户消息告知、身份验证、安全验证、用户使用体验调研等用途；此外，我们也可能会向在前述过程中收集的手机号码通过短信、电话的方式，为您提供您可能感兴趣的服务、功能或活动等商业性信息的用途，但请您放心，如您不愿接受这些信息，您可以通过手机短信或回复邮件退订方式进行退订，也可以直接与我们联系进行退订。</p>\n<h3 id=\"二基本业务功能二实名认证的个人信息收集使用规则\">（二）基本业务功能二：“实名认证”的个人信息收集使用规则</h3>\n<p>鉴于本平台提供生成式人工智能API服务，且您可能基于该API进一步对外提供服务，为有效管控本平台内容安全与技术安全风险，并履行相关法律法规的法定合规义务，在您订购或开通使用我们提供的任一项产品/服务前，我们需要对您进行实名认证。</p>\n<p>如您使用的账户归个人所有，您需向我们提供您的真实姓名、<strong>身份证件类型及证件号码</strong>，用于完成实名认证。<strong>我们将您提供的真实姓名及身份证件号码提供给第三方支付宝（中国）网络技术有限公司（联系方式：【95188】），并由支付宝向您收集人脸识别信息进行比对核验，从而验证您的真实身份</strong>。</p>\n<p>如您使用的账户归企业或组织所有，您可通过以下两种方式实名认证：（1）如您选择法定代表人人脸识别认证的方式，您需向我们提供企业名称、统一社会信用代码、法定代表人姓名、<strong>法定代表人身份证号</strong>；（2）如您选择企业对公打款认证，您需向我们提供企业名称、统一社会信用代码、法定代表人姓名、开户行、开户行账号（中国银联成员机构I类银行账户或信用卡号），由您所在的公司完成对公打款并验证打款金额，以完成实名认证。<strong>我们将您提供的前述认证信息提供给第三方杭州天谷信息科技有限公司（E签宝，联系方式：【<a href=\"https://www.esign.cn/\">esign.cn</a>】），并由E签宝向您收集人脸识别信息进行比对核验，从而验证您的真实身份</strong>。</p>\n<p>如果您无法提供身份基本信息或人脸识别信息，将无法使用本平台的产品/服务。除前述规定外，除非经您自主选择或遵从相关法律法规要求，我们不会对外提供上述信息，或者将其用于该功能以外的其他用途。</p>\n<h3 id=\"三基本业务功能三余额充值的个人信息收集使用规则\">（三）基本业务功能三：“余额充值”的个人信息收集使用规则</h3>\n<p>本平台为您提供余额充值服务。当您选择余额充值时，我们需要收集和处理的信息包括：您的订单信息（包括商品类型、订单流水号、下单时间、支付金额）、您在第三方（微信）的支付单号、支付状态等，用于完成交易及提供对账服务。请您知悉，本平台采取计费模式，如您不提供上述信息并完成充值服务，我们可能无法为您提供本平台的产品/服务。</p>\n<h3 id=\"四基本业务功能四大模型-api-调用与推理服务的个人信息收集使用规则\">（四）基本业务功能四：&quot;大模型 API 调用与推理服务&quot;的个人信息收集使用规则</h3>\n<p>当您使用我们提供的大模型API服务（包括但不限于文本生成、图像生成等）时，为了完成大模型推理计算、计费扣减、并发调度及保障系统的安全与稳定性，我们需要收集您的 IP地址、调用的模型名称、Token消耗量、请求时间及请求状态码等日志信息。</p>\n<p>【特别说明】针对大模型API加速推理服务，我们仅作为底层算力与技术提供方。对于您通过API传输的业务数据（包括输入指令及生成的输出内容），我们仅在提供当次推理计算的必要且短暂的时间内进行处理。我们不会长期存储您的任何业务输入与输出数据；不会将您的业务数据用于任何大模型的预训练、微调或其他商业用途；推理计算完成后，相关业务数据将立即从我们的计算节点中销毁或不可恢复。同时，如您作为开发者或企业客户使用我们的API服务向最终用户提供服务，您应当确保您输入的数据来源合法，并已依法获取最终用户的充分授权同意。</p>\n<h3 id=\"五基本业务功能五平台内容安全与风控的个人信息收集使用规则\">（五）基本业务功能五：&quot;平台内容安全与风控&quot;的个人信息收集使用规则</h3>\n<p>基于保障平台算力资源不被滥用及履行《生成式人工智能服务管理暂行办法》等相关法律法规规定的内容安全法定义务，我们会收集您的使用行为信息（包括API调用频率、并发量、异常请求日志）。同时，我们会对您的输入提示词（Prompt）和输出内容进行自动化安全审核，以识别和拦截违法违规内容。请您知悉，该等审核仅用于履行法定合规义务，我们不会将其用于模型训练或其他商业目的。</p>\n<h3 id=\"六基本业务功能六改善和优化服务及保障账户安全的个人信息收集使用规则\">（六）基本业务功能六：改善和优化服务及保障账户安全的个人信息收集使用规则</h3>\n<p>我们提供的基本功能需要依赖部分信息才能运行，当您使用我们的产品和服务时，则需要向我们或第三方网易易盾（联系方式：【<a href=\"https://dun.163.com/\">dun.163.com</a>】）提供或允许收集的必要信息包括：</p>\n<p>（1）设备信息：我们收集您使用设备的设备 ID、IP 地址、手机号、操作数据、崩溃数据、设备及设备所处物理与网络环境信息、分辨率、时区和语言信息，以便了解产品对不同硬件设备适配性、确保操作环境安全、识别账号异常状态，用于分析产品的使用状况、排查崩溃原因、减少崩溃情况，以不断改进我们的产品，以及保障账号和系统安全。</p>\n<p>（2）日志信息：当您浏览或使用本平台时，为了保障网站和服务的正常运行及运营安全，预防网络攻击、侵入风险，更准确地识别违反法律法规或本平台的相关协议、服务规则的情况，我们会收集您的IP地址、分辨率、时区和语言等设备信息、网络接入方式及类型信息、界面操作和服务请求记录。这些信息是我们提供服务和保障服务正常运行和网络安全所必须收集的基本信息。为让您体验到更好的服务，并保障您的使用安全，我们可能记录网络日志信息，以及使用本平台及相关服务的频率、崩溃数据、使用情况及相关性能数据信息。</p>\n<h3 id=\"七扩展业务功能一发票开具的个人信息收集使用规则\">（七）扩展业务功能一：“发票开具”的个人信息收集使用规则</h3>\n<p>当您完成充值后，您可通过“发票开具”模块点击“申请开票”，我们需要收集您的开票金额、费用项目名称、抬头名称和税号、邮箱、手机号，用于发票开具。如您不提供上述信息，不影响您正常使用本平台的其他基本功能。</p>\n<h3 id=\"八扩展业务功能二工单反馈的个人信息收集使用规则\">（八）扩展业务功能二：“工单反馈”的个人信息收集使用规则</h3>\n<p><strong>为解决</strong>您在使用本平台遇到的包括但不限于账户注销、实名认证、充值相关的问题，您可通过工单反馈向我们反映，您需向我们提供接受反馈的邮箱、问题描述及相关附件，以及您使用本平台及相关服务而产生的用户咨询记录、报障记录和针对用户故障的排障过程（如通信或通话记录），我们将通过记录、分析这些信息以便更及时响应您的帮助请求，以及用于改进服务。请您知悉，如您不提供上述信息，您将无法正常提交工单，但不影响您继续使用本平台其他基本功能。</p>\n<h3 id=\"九扩展业务功能三商务合作的个人信息收集使用规则\">（九）扩展业务功能三：“商务合作”的个人信息收集使用规则</h3>\n<p>如您有商务生态合作或技术合作的需求，您可通过“商务合作”模块与我们取得联系。您需向我们提供您的姓名、联系电话、所在企业或组织名称、您的邮箱，及具体的需求内容，用于我们与您取得联系并建立商业合作。请您知悉，上述信息非本平台必需收集，如您不提供不影响您正常使用本平台的其他功能。</p>\n<h3 id=\"十征得授权同意的例外\">（十）征得授权同意的例外</h3>\n<p>依据相关法律法规及国家标准，以下情形中，我们可能会依法处理您的个人信息，无需征得您的同意：</p>\n<ul>\n<li>为订立、履行我们与您签署的合同所必需；</li>\n<li>为履行法定职责或者法定义务所必需，例如与国家安全、国防安全、与刑事侦查、起诉、审判和判决执行等直接相关的法定职责或者法定义务；</li>\n<li>为应对突发公共卫生事件，或者紧急情况下为保护自然人的生命健康和财产安全所必需；</li>\n<li>为公共利益实施新闻报道、舆论监督等行为，在合理的范围内处理个人信息；</li>\n<li>依照《个人信息保护法》规定在合理的范围内处理您自行公开或者其他已经合法公开的个人信息；</li>\n<li>法律法规规定的其他情形。</li>\n</ul>\n<p>除上述外，当我们要将信息用于本政策未载明的其它用途时，或要将基于特定目的收集而来的信息用于其他目的时，会以合理的方式向您告知，并在使用前再次征得您的同意。</p>\n<h2 id=\"二我们如何使用cookie和同类技术\">二、我们如何使用COOKIE和同类技术</h2>\n<p>在您使用我们的系统时，我们可能会使用Cookie和同类技术收集您的一些个人信息，包括：您访问的习惯、您的登录信息，Cookie和同类技术收集该类信息是为了您使用我们的系统的必要、简化您重复操作的步骤(如注册、登录)、向您提供更切合您个人需要的服务内容和您可能更感兴趣的内容、保护您的信息和账户安全性、提升我们的服务质量等。我们不会将Cookie用于前述目的之外的任何用途。</p>\n<p>您理解并知悉：我们系统的部分功能只能通过使用Cookie或同类技术才可得到实现，如您拒绝使用或删除的，您可能无法正常使用我们的相关服务或通过我们的服务获得最佳的体验，同时也可能会对您的信息保护和账户安全性造成一定的影响。</p>\n<h2 id=\"三我们如何委托处理共享转让公开披露您的个人信息\">三、我们如何委托处理、共享、转让、公开披露您的个人信息</h2>\n<h3 id=\"一委托处理\">（一）委托处理</h3>\n<p>对于委托处理用户信息的场景，我们会与受托合作方根据法律规定签署相关处理协议，并对其用户信息使用活动进行监督。</p>\n<h3 id=\"二共享\">（二）共享</h3>\n<p>我们不会与Ker以外的任何公司、组织和个人共享您的个人信息，但以下情况除外：</p>\n<p>（1）在获取明确同意的情况下共享：获得您的明确同意后，我们会向其他方提供您的个人信息；</p>\n<p>（2）在法定情形下的共享：我们可能会根据法律法规规定、诉讼、仲裁需要或按行政、司法等监管机关依法提出的要求，共享您的个人信息；</p>\n<p>（3）与授权合作伙伴共享：为了向您提供更完善、优质的服务，我们的某些服务将由授权合作伙伴提供。我们可能会向合作伙伴等第三方共享您的信息，以保障为您提供的服务顺利完成。但我们仅会出于合法、正当、必要、特定、明确的目的共享您的个人信息，并且只会共享提供服务所必要的个人信息。我们的合作伙伴无权将共享的个人信息用于任何其他用途，且我们将在与合作伙伴的协议中要求其承担严格的信息保护义务，并在我们委托其处理的事务结束后删除您的个人信息。我们的合作伙伴主要包括以下类型：</p>\n<p>运营商认证服务提供商：为实现手机号一键登录功能，我们需将您的相关设备信息及本机号码信息与运营商SDK服务商共享；</p>\n<p>个人或机构实名认证服务提供商：为进行账户实名认证，在您使用平台的主要功能或相关服务前，根据相关法律法规的规定及相关安全保障要求，需要您为相应账户完成实名认证以明确账户权属及责任归属。在实名认证过程中，与我们合作的认证服务机构可能需要使用您的真实姓名、身份证号码、手机号码等；</p>\n<p>支付服务提供商：为实现余额充值及支付功能，我们需将您的订单信息、交易金额等必要信息与第三方支付服务商共享；</p>\n<p>数据分析及安全服务提供商：为进行数据统计分析、安全风控等，我们可能与相关服务提供商共享必要信息。</p>\n<p><strong>【可以查阅<a href=\"#/legal-sharing\">《第三方共享信息清单和第三方 SDK 目录》</a>了解我们的合作伙伴及我们信息共享的具体情况。】</strong></p>\n<p>当您使用平台中由第三方提供的功能时，我们可能会接入由第三方提供的应用程序编程接口（API）及软件开发包（SDK）以实现相关功能。此时，第三方服务提供商可能会收集您相关的个人信息。<strong>前述服务提供商收集和处理信息等行为遵守其自身的隐私条款，而不适用于本政策</strong>。为了最大程度保障您的信息安全，我们建议您在使用任何第三方API、SDK类服务前先行查看其隐私条款。为保障您的合法权益，如您发现这等API、SDK或其他类似的应用程序存在风险时，建议您立即终止相关操作并及时与我们取得联系。</p>\n<p><strong>【可以查阅<a href=\"#/legal-sharing\">《第三方共享信息清单和第三方 SDK 目录》</a>了解我们的合作伙伴及我们信息共享的具体情况。】</strong></p>\n<p>对我们与之共享个人信息的公司、组织和个人，我们会与其签署严格的保密协定，要求他们按照我们的说明、<a href=\"#/legal-privacy\">本隐私政策</a>以及其他任何相关的保密和安全措施来处理个人信息。在个人敏感数据使用上，我们要求第三方采用数据脱敏和加密技术，从而更好地保护用户数据。</p>\n<p>如果您不再希望允许我们共享这些信息，请通过邮箱：【<a href=\"#\">contact@kerapi.cn</a>】联系我们。</p>\n<h3 id=\"三转让\">（三）转让</h3>\n<ol>\n<li>\n<p>除非获取您的明确同意，我们不会将您的个人信息转让给任何公司、组织或个人。</p>\n</li>\n<li>\n<p>如果发生合并、收购或破产清算，或其他涉及合并、收购或破产清算情形时，如涉及到个人信息向新的主体提供，此种情况下我们将告知您新的持有您个人信息的公司、组织的名称及联系方式，并要求新的持有您个人信息的公司、组织继续受<a href=\"#/legal-privacy\">本隐私政策</a>的约束。如果新的持有您个人信息的公司、组织针对<a href=\"#/legal-privacy\">本隐私政策</a>中约定的个人信息的收集、处理目的及方式发生任何改变，我们会要求该公司、组织将重新向您征求授权同意。</p>\n</li>\n</ol>\n<h3 id=\"四公开披露\">（四）公开披露</h3>\n<p>我们仅会在以下情况下，公开披露您的个人信息：</p>\n<p>（1）获得您明确同意后；</p>\n<p>（2）基于法律的披露：在法律、法律程序、诉讼或政府主管部门强制性要求的情况下，我们可能会公开披露您的个人信息。</p>\n<p>（3）因需要对违规账户、欺诈行为进行处罚公告的。</p>\n<p>特别提示：对于公开披露的您的个人信息，我们会在收到公开披露申请后第一时间审慎审查其正当性、合理性、合法性，并在公开披露时和公开披露后采取最严格个人信息安全保护措施和手段对其进行保护。</p>\n<h3 id=\"五共享转让公开披露您的个人信息的例外\">（五）共享、转让、公开披露您的个人信息的例外</h3>\n<p>以下情形中，共享、转让、公开披露您的个人信息无需事先征得您的授权同意：</p>\n<ul>\n<li>为订立、履行个人作为一方当事人的合同所必需，或者按照依法制定的劳动规章制度和依法签订的集体合同实施人力资源管理所必需；</li>\n<li>为履行法定职责或者法定义务所必需；</li>\n<li>为应对突发公共卫生事件，或者紧急情况下为保护自然人的生命健康和财产安全所必需；</li>\n<li>为公共利益实施新闻报道、舆论监督等行为，在合理的范围内处理个人信息；</li>\n<li>依照法律规定在合理的范围内处理个人自行公开或者其他已经合法公开的个人信息；</li>\n<li>法律、行政法规规定的其他情形。</li>\n</ul>\n<h2 id=\"四我们如何保护您的个人信息\">四、我们如何保护您的个人信息</h2>\n<p>我们非常重视用户信息的安全，将努力采取合理的安全措施（包括技术方面和管理方面）来保护您的信息，防止您提供的信息被不当使用或未经授权的情况下被访问、公开披露、使用、修改、损坏、丢失或泄漏。 我们会使用不低于行业通行的加密技术、匿名化处理等合理可行的手段保护您的信息，并使用安全保护机制尽可能地降低您的信息遭到恶意攻击的可能性。</p>\n<p>我们会有专门的人员和制度保障您的信息安全。我们采取严格的数据使用和访问制度。尽管已经采取了上述合理有效措施，并已经遵守了相关法律规定要求的标准，但请您理解，由于技术的限制以及可能存在的各种恶意手段，在互联网行业，即便竭尽所能加强安全措施，也不可能始终保证信息百分之百的安全，我们将尽力确保您提供给我们的信息的安全性。您知悉并理解，您接入我们的服务所用的系统和通讯网络，有可能因我们可控范围外的因素而出现问题。因此，我们强烈建议您采取积极措施保护信息的安全，包括但不限于不向任何人提供短信验证码、不通过任何非kerapi.cn域名网站登录、妥善保管并定期轮转 API Key、在邀请任何用户加入组织账户前核实其真实身份、审慎评估任何第三方网站、应用的安全性等措施。</p>\n<p>我们会制定应急处理预案，并在发生用户信息安全事件时立即启动应急预案，努力阻止该等安全事件的影响和后果扩大。一旦不幸发生用户信息安全事件（泄露、丢失等）后，我们将按照法律法规的要求，及时向您告知：安全事件的基本情况和可能的影响、我们已经采取或将要采取的处置措施、您可自主防范和降低风险的建议、对您的补救措施等。我们将及时将事件相关情况<strong>以短信、邮件等形式告知您，难以逐一告知时，我们会采取合理、有效的方式发布公告</strong>。我们可能采取<strong>包括不限于封停事件涉及的用户、账户，停用 API Key，暂停或调整相关服务等措施控制事件影响和后果</strong>。同时，我们还将<strong>按照相关监管部门要求，上报用户信息安全事件的处置情况</strong>。</p>\n<p>我们谨此特别提醒您，本隐私政策提供的用户信息保护措施仅适用于本平台及相关服务。一旦您离开本平台及相关服务，浏览或使用其他网站、产品、服务及内容资源，我们即没有能力及义务保护您在本平台及相关服务之外的软件、网站提交的任何信息，无论您登录、浏览或使用上述软件、网站是否基于本平台的链接或引导。</p>\n<h2 id=\"五您的权利\">五、您的权利</h2>\n<p>按照中国相关的法律、法规、标准，以及其他国家、地区的通行做法， 我们保障您对自己的个人信息行使以下权利：</p>\n<h3 id=\"一查询更正或补充您的个人信息\">（一）查询、更正或补充您的个人信息</h3>\n<p>您可以通过以下方式自行进行：</p>\n<p>登陆 Ker 平台，访问个人中心，查询和更正您的用户信息；使用平台的其他对应功能确认您提供的其他信息。</p>\n<p>如果您无法通过上述方式查询、更正或补充信息的，您可以随时发送电子邮件至【<a href=\"#\">contact@kerapi.cn</a>】联系我们，我们将在15个工作日内反馈结果，后台将同步更正、补充相关信息。</p>\n<p>为同等的保护不同用户的个人信息，您的信息查询、更正或补充诉求可能需要以您向我们证实您的身份为前提。若您无法配合进行证实，您的相应诉求可能无法得到满足。</p>\n<h3 id=\"二删除您的个人信息\">（二）删除您的个人信息</h3>\n<p>在以下情形中，您可以通过电子邮件【<a href=\"#\">contact@kerapi.cn</a>】向我们提出删除个人信息的请求：</p>\n<ul>\n<li>如果您不再使用我们的产品或服务，或注销了用户及账户；</li>\n<li>如果我们处理个人信息的行为违反法律法规；</li>\n<li>如果我们收集、使用您的个人信息，却未征得您的同意；</li>\n<li>如果我们处理个人信息的行为违反了与您的约定；</li>\n<li>如果您撤回同意授权；</li>\n<li>如果我们不再为您提供产品或服务。</li>\n</ul>\n<p>收到您的删除请求后，我们会根据您的要求进行删除处理并在15个工作日内向您反馈结果（法律法规要求必须保留的数据除外）。</p>\n<p>当您或我们协助您删除相关信息后，因为适用的法律和安全技术，我们可能无法立即从备份系统中删除相应的信息，我们将安全地存储您的个人信息并将其进行进一步的处理和隔离，直到备份可以清除或实现匿名。</p>\n<h3 id=\"三您有权改变您授权同意的范围或撤销您的授权同意\">（三）您有权改变您授权同意的范围或撤销您的授权同意</h3>\n<p>每个业务功能需要一些基本的个人信息才能得以完成，基于您的同意处理您的个人信息的，您可以随时改变您的授权范围或撤回授权同意。如果您希望变更您的授权范围或撤回授权的，您可以通过电子邮件【<a href=\"#\">contact@kerapi.cn</a>】向我们提出改变授权范围或撤回授权同意的请求。</p>\n<h3 id=\"四复制下载您的个人信息\">（四）复制、下载您的个人信息</h3>\n<p>如您希望获取您在我们的平台中的个人信息副本，您可以通过电子邮件【<a href=\"#\">contact@kerapi.cn</a>】向我们提出请求；同时，我们有权根据复制、下载个人信息的成本收取必要费用。</p>\n<h3 id=\"五注销您的账户\">（五）注销您的账户</h3>\n<p>您随时可注销此前注册的用户及账户，您可以通过Ker平台个人中心提交注销申请表单。</p>\n<p>请您务必认真阅读申请表单公示的《用户注销规则》，并按真实意思表示做出注销决策。您需要知悉，注销之后您将无法使用已注销用户的手机号重新注册，我们将停止为您提供产品或服务，并依法删除/匿名化处理您的个人信息，法律法规另有规定的除外。</p>\n<p>若您注销用户前创建过任何组织账户：1）若该账户归您个人所有，该账户将一并被注销；2）若该账户归组织、企业所有，其所有者权限将移交给其他成员用户。</p>\n<h3 id=\"六响应您的上述请求\">（六）响应您的上述请求</h3>\n<p>您享有注销用户及账户、举报或投诉的权利。为保障安全，您可能需要提供书面请求，并以其它方式证明您的身份。我们对于您的书面请求响应时间为15个工作日。对于您合理的请求，我们原则上不收取费用。但对多次重复、超出合理限度的请求，我们将视具体情形收取一定成本费用。对于那些无端重复、需要过多技术手段（例如，需要开发新系统或从根本上改变现行惯例）、给他人合法权益带来风险或者不切实际（例如，涉及备份磁带上存放的信息）的请求，我们可能会予以拒绝。</p>\n<h3 id=\"七在以下情形中按照法律法规要求我们将无法响应您的请求\">（七）在以下情形中，按照法律法规要求，我们将无法响应您的请求：</h3>\n<ul>\n<li>与个人信息控制者履行法律法规规定的义务相关的；</li>\n<li>与国家安全、国防安全直接相关的；</li>\n<li>与公共安全、公共卫生、重大公共利益直接相关的；</li>\n<li>与刑事侦查、起诉、审判和执行判决直接相关的；</li>\n<li>个人信息控制者有充分证据表明个人信息主体存在主观恶意或滥用权利的；</li>\n<li>出于维护个人信息主体或其他个人的生命、财产、人格重大合法权益但又很难得到本人同意的；</li>\n<li>响应个人信息主体的请求将导致个人信息主体或其他个人、组织的合法权益受到严重损害的；</li>\n<li>涉及商业秘密的。</li>\n</ul>\n<h2 id=\"六我们如何处理儿童的个人信息\">六、我们如何处理儿童的个人信息</h2>\n<p>Ker一直非常注重对未成年人的保护，致力于践行我们的企业社会责任。本平台的所有服务仅面向年满18周岁且具有完全民事行为能力的成年用户。如您是未成年人，请勿注册、登录或以任何方式使用本平台服务。</p>\n<p>在注册或使用本平台服务时，您应当确认自身年满18周岁且具有完全民事行为能力。您在完成注册或使用本平台服务的行为，即视为您对此作出了真实的确认与承诺。如您以虚假信息注册或隐瞒真实年龄使用本平台服务，由此产生的一切后果由您（及您的监护人）自行承担，本平台有权在发现后立即终止向您提供服务，并有权注销相关用户账户、删除相关数据，且不承担任何责任。</p>\n<p>您亦不应将您的平台用户身份及账户以任何形式交由未成年人使用，不应邀请您知晓实际由未成年人注册的用户加入您的组织账户。由此产生的一切后果由您（及您的监护人）自行承担，本平台有权在发现后立即终止向您提供服务，并有权注销相关用户账户、删除相关数据，且不承担任何责任。</p>\n<h2 id=\"七您的个人信息的存储\">七、您的个人信息的存储</h2>\n<p>存储地点：我们依照法律法规的规定，仅会将收集到的有关您的个人信息存储于中华人民共和国境内。</p>\n<p>如果确有必要进行个人信息的跨境传输，我们会单独向您明确告知（包括出境的目的、接收方、使用方式与范围、使用内容、安全保障措施、安全风险等），并征得您的授权同意，我们会确保接收方有充足的个人信息保护能力来保护您的个人信息，并确保您的个人信息得到在中华人民共和国境内足够同等的保护。</p>\n<p>存储期限：我们在为您提供满足产品/服务目的所必需且最短的期间内保留您的个人信息，例如：当您使用我们的用户注册/登录功能时，我们需要收集您的手机号码，且在您提供后并在您使用该功能期间，我们需要持续保存您的手机号码，以向您正常提供该功能、保障您的账户和系统安全。</p>\n<p>在超出上述存储期限后，我们会对您的个人信息进行删除或匿名化处理，法律法规另有规定的除外。</p>\n<h2 id=\"八本隐私政策如何更新\">八、本隐私政策如何更新</h2>\n<p>1、为给您提供更好的服务以及随着Ker业务的发展，本隐私政策也会随之更新。但未经您明确同意，我们不会削减您依据本隐私政策所应享有的权利。我们会通过在平台上发出更新版本并在生效前通过网站公告或以其他适当方式提醒您相关内容的更新，也请您访问平台文档中心以便及时了解最新的隐私政策。</p>\n<p>2、对于重大变更，我们还会提供更为显著的通知（我们会通过包括但不限于短信、邮件或在页面做特别提示等方式，说明隐私政策的具体变更内容）。</p>\n<p>本政策所指的重大变更包括但不限于：</p>\n<p>（1）我们的服务模式发生重大变化。如处理个人信息的目的、处理的个人信息类型、个人信息的使用方式等；</p>\n<p>（2）我们在所有权结构、组织架构等方面发生重大变化。如业务调整、破产并购等引起的所有者变更等；</p>\n<p>（3）个人信息共享、转让或公开披露的主要对象发生变化；</p>\n<p>（4）您参与个人信息处理方面的权利及其行使方式发生重大变化；</p>\n<p>（5）我们负责处理个人信息安全的责任部门、联络方式及投诉渠道发生变化时；</p>\n<p>（6）个人信息安全影响评估报告表明存在高风险时。</p>\n<p>3、我们还会将本策略的旧版本存档，如您有查阅需求，请发送邮件至【<a href=\"#\">contact@kerapi.cn</a>】与我们联系。</p>\n<h2 id=\"九如何联系我们\">九、如何联系我们</h2>\n<p>如您对本隐私政策或您个人信息的相关事宜有任何问题、意见或建议，请通过发送邮件至【<a href=\"#\">contact@kerapi.cn</a>】与我们联系。</p>\n<p>一般情况下，我们将在 15 天内回复。如果您对我们的回复不满意，特别是我们的个人信息处理行为损害了您的合法权益，您还可以向网信、电信、公安及工商等监管部门进行投诉或举报。</p>\n<p>您也可以通过以下地址联系我们：</p>\n<p>【公司主体名称占位】：北京市海淀区中关村东路 1 号院 8 号楼 D 座 23 层 2301</p>\n<p>我们将在收到您的意见后 15 天内予以回复。</p>\n<p>感谢您花时间了解我们的隐私政策，谢谢!</p>"}, "legal-privacy-summary": {"title": "隐私政策摘要", "lead": "更新日期：2026 年 7 月 30 日", "html": "<p>我们非常重视您的个人信息安全，我们将严格遵守法律法规，为您提供更加安全、可靠的服务。以下摘要能帮助您更直观、简洁地概览产品隐私政策的内容。</p>\n<p>请您注意，阅读本摘要并不代表已阅读隐私政策全文，如您希望了解我们详细的隐私政策，请查阅完整的<a href=\"#/legal-privacy\">《Ker隐私政策》</a>。</p>\n<h2 id=\"一我们收集的信息\">一、我们收集的信息</h2>\n<p><strong>业务场景：用户注册与登录</strong>\n<strong>个人信息字段：</strong> 您的手机号码、验证码；（可选提供：绑定的邮箱或微信等第三方平台账号）。\n<strong>收集目的：</strong> 用于帮助您完成本平台的账户注册与登录，若不提供可能无法正常使用我们的服务。</p>\n<p><strong>业务场景：实名认证</strong>\n<strong>个人信息字段：</strong> （1）个人用户：真实姓名、<strong>身份证件类型及证件号码</strong>；（2）企业用户（法定代表人认证）：企业名称、统一社会信用代码、法定代表人姓名、<strong>法定代表人身份证号</strong>；（3）企业用户（对公打款认证）：企业名称、统一社会信用代码、法定代表人姓名、开户行、开户行账号。\n<strong>收集目的：</strong> 根据相关法律法规的规定，验证您的真实身份。</p>\n<p><strong>业务场景：余额充值</strong>\n<strong>个人信息字段：</strong> 您的订单信息（包括商品类型、订单流水号、下单时间、支付金额）、您在第三方（微信）的支付单号、支付状态等。\n<strong>收集目的：</strong> 用于完成交易及提供对账服务。</p>\n<p><strong>业务场景：大模型 API 调用与推理服务</strong>\n<strong>个人信息字段：</strong> IP地址、调用的模型名称、Token消耗量、请求时间及请求状态码等日志信息。\n<strong>收集目的：</strong> 用于完成大模型推理计算、计费扣减、并发调度及保障系统的安全与稳定性。</p>\n<p><strong>业务场景：平台内容安全与风控</strong>\n<strong>个人信息字段：</strong> 使用行为信息（包括API调用频率、并发量、异常请求日志）、输入提示词（Prompt）和输出内容。\n<strong>收集目的：</strong> 基于保障平台算力资源不被滥用及履行《生成式人工智能服务管理暂行办法》等相关法律法规规定的内容安全法定义务，进行自动化安全审核以识别和拦截违法违规内容。</p>\n<p><strong>业务场景：改善和优化服务及保障账户安全</strong>\n<strong>个人信息字段：</strong> （1）设备信息：设备型号、硬件序列号、设备MAC地址、操作系统版本、设备设置、唯一设备识别码（IDFA、Android ID、GID、OAID、VAID、AAID、UAID、SIM信息等）、UUID、必要的移动应用列表信息、应用运行列表、软硬件及设备、设备环境信息、设备所在位置相关信息（WLAN接入点和基站传感器信息）；（2）日志信息：分辨率、时区和语言等设备信息、网络接入方式及类型信息、网页浏览记录、使用频率、崩溃数据、使用情况及相关性能数据信息。\n<strong>收集目的：</strong> 了解产品适配性、确保操作环境安全、识别账户异常状态，用于分析产品使用状况、排查崩溃原因、改进产品，以及保障账户和系统安全。</p>\n<p><strong>业务场景：发票开具（扩展功能）</strong>\n<strong>个人信息字段：</strong> 开票金额、费用项目名称、抬头名称和税号、邮箱、手机号。\n<strong>收集目的：</strong> 为您提供发票开具服务。</p>\n<p><strong>业务场景：工单反馈（扩展功能）</strong>\n<strong>个人信息字段：</strong> 接受反馈的邮箱、问题描述及相关附件、用户咨询记录、报障记录和针对用户故障的排障过程（如通信或通话记录）。\n<strong>收集目的：</strong> 及时响应您的帮助请求，解决您的问题并改进服务。</p>\n<p><strong>业务场景：商务合作（扩展功能）</strong>\n<strong>个人信息字段：</strong> 您的姓名、联系电话、所在企业或组织名称、邮箱及具体的需求内容。\n<strong>收集目的：</strong> 与您取得联系并建立商业合作。</p>\n<p>对于我们收集的个人信息清单明细，您可以查阅<a href=\"#/legal-collection\">《个人信息收集清单》</a>。</p>\n<h2 id=\"二我们如何保护您的个人信息\">二、我们如何保护您的个人信息</h2>\n<p>我们为您的信息提供相应的安全保障，以防止信息的丢失、不当使用、未经授权访问或披露，包括：</p>\n<ol>\n<li>我们使用不低于行业通行的加密技术、匿名化处理等符合业界标准的安全防护措施保护您提供的个人信息。</li>\n<li>我们建立专门的管理制度、流程和组织确保您的信息安全，采取严格的数据使用和访问制度。</li>\n<li>我们会采取合理可行的措施，尽力避免收集无关的个人信息。</li>\n<li>我们制定了应急处理预案，并在发生用户信息安全事件时立即启动应急预案，努力阻止该等安全事件的影响和后果扩大。</li>\n</ol>\n<h2 id=\"三我们服务中涉及的第三方数据处理\">三、我们服务中涉及的第三方数据处理</h2>\n<p>请您知悉，我们为您所提供的产品/服务大多是无法单独完成的，因此我们可能会与我们的授权合作伙伴等第三方共享或委托其处理您的部分个人信息。目前，除再次获得您明确同意或授权外，此类共享或委托处理涉及的主要情形包括：运营商认证服务提供商（实现手机号一键登录）、实名认证服务提供商（如支付宝、E签宝）、支付服务提供商（如微信支付）、数据分析及安全风控服务提供商（如网易易盾）等。</p>\n<p>我们会与其签署严格的信息保护和保密协定，要求他们遵守协议并采取相关的安全措施来处理个人信息，在个人敏感数据使用上要求第三方采用数据脱敏和加密技术。</p>\n<p>对于我们使用的第三方软件工具开发包（&quot;SDK&quot;），以及与第三方共享的个人信息，您可以点击<a href=\"#/legal-sharing\">《第三方共享信息清单和第三方 SDK 目录》</a>查阅。</p>\n<h2 id=\"四您如何管理您的个人信息\">四、您如何管理您的个人信息</h2>\n<p>您有权管理您的个人信息，包括查询、更正、补充和删除您的个人信息，改变您授权同意的范围或撤回授权，复制下载您的个人信息以及注销您的账户。您可以通过我们平台中提供的功能设置自行进行上述操作。如果您无法通过上述方式进行管理，您可以通过我们以下提供的联系方式联系我们，我们将在15个工作日内反馈结果。</p>\n<h2 id=\"五您如何联系我们\">五、您如何联系我们</h2>\n<p>如您对本隐私政策或您个人信息的相关事宜有任何问题、意见或建议，请通过发送邮件至 <a href=\"#\">contact@kerapi.cn</a> 与我们联系。</p>\n<p>一般情况下，我们将在收到您的意见后15天内予以回复。如果您对我们的回复不满意，特别是我们的个人信息处理行为损害了您的合法权益，您还可以向网信、电信、公安及工商等监管部门进行投诉或举报。</p>\n<p>您也可以通过以下地址联系我们：\n【公司主体名称占位】：北京市海淀区中关村东路 1 号院 8 号楼 D 座 23 层 2301</p>"}, "legal-recharge": {"title": "用户充值协议", "lead": "更新日期：2026 年 7 月 30 日", "html": "<p>尊敬的用户，为保障您的合法权益，请您在点击&quot;确认支付&quot;按钮前，完整、仔细地阅读本充值协议，当您点击&quot;确认支付&quot;按钮，即表示您已阅读、理解本协议内容，并同意按照本协议约定的规则进行充值和使用余额行为。如您不接受本协议的部分或全部内容，请您不要点击&quot;确认支付&quot;按钮。</p>\n<h2 id=\"1-接受条款\">1. 接受条款</h2>\n<p>欢迎您使用 Ker 平台。以下所述条款和条件为充值用户（以下简称&quot;用户&quot;或&quot;您&quot;）和【公司主体名称占位】（以下简称&quot;Ker&quot;）就充值以及余额使用所达成的协议。 当您以在线点击&quot;确认支付&quot;等方式确认本协议或实际进行充值时，即表示您已理解本协议内容并同意受本协议约束，包括但不限于本协议正文及所有Ker已经发布的或将来可能发布的关于服务的各类规则、规范、公告、说明和（或）通知等，以及其他各项网站规则、制度等。所有前述规则为本协议不可分割的组成部分，与协议正文具有同等法律效力。 Ker有权根据国家法律法规的变化以及实际业务运营的需要不时修改本协议相关内容，并以公示于网站、发送短信或邮件等任一方式通知公告。修改后的条款应于公示通知指定的日期生效。如果您选择继续充值即表示您同意并接受修改后的协议且受其约束；如果您不同意我们对本协议的修改，请立即放弃充值或者停止使用本服务。如果您对本协议的条款有疑问的，请通过客服渠道（电子邮箱：<a href=\"#\">contact@kerapi.cn</a>）进行询问，Ker将向您解释条款内容。如果您不同意本协议的任意内容，或者无法准确理解Ker对条款的解释，请不要同意（&quot;同意&quot;的定义见前文所述）本协议或使用本协议项下的服务。</p>\n<h2 id=\"2-定义\">2. 定义</h2>\n<p><strong>2.1</strong> 余额账户：指由Ker为每个 Ker 平台账户自动配置的资金账户。用户向指定平台账户的余额账户充值的行为，视为用户向Ker支付或预付服务费。</p>\n<p><strong>2.2</strong> 由于平台服务计费发生于服务被实际使用之后，或由于您或您代表的公司、组织的要求，余额账户可能出现透支情况，此时您的充值行为将被视为对已发生服务的费用进行补足支付。</p>\n<p><strong>2.3</strong> 余额账户未出现透支时，您的充值行为被视为预付服务费，该预付服务费可用于购买 Ker 平台提供的产品或服务，并在产品或服务实际交付时从您的余额账户扣除。</p>\n<h2 id=\"3-充值条件\">3. 充值条件</h2>\n<p>您仅能为您已加入、具有相应功能权限且已完成实名认证的 Ker 平台账户进行充值。</p>\n<h2 id=\"4-账户安全\">4. 账户安全</h2>\n<p><strong>4.1</strong> 当您进行充值时，您应仔细确认当前操作的账户及信息，若因为您自身操作不当、不了解或未充分了解充值方式及后果等因素造成充错账户、错选充值种类、错误打款等情形而导致自身权益受到损害的，应由您自行承担责任。</p>\n<p><strong>4.2</strong> 您在充值时使用第三方支付企业提供的服务的，应当遵守与该第三方的各项协议及其服务规则；在使用第三方支付服务过程中用户应当妥善保管个人信息，包括但不限于银行账号、密码、验证码等；您同意并确认，Ker对因第三方支付服务产生的纠纷不承担任何责任。</p>\n<p><strong>4.3</strong> 无论使用何种充值方式，您不得通过对二维码进行截图转发、对支付链接进行转发等任何形式欺诈、诱骗他人进行支付，否则Ker有权将该等充值款项原路退还，且由此产生的一切法律后果由欺诈行为实施者承担。</p>\n<h2 id=\"5-充值方式\">5. 充值方式</h2>\n<p><strong>5.1</strong> 您可以选择Ker认可的第三方支付企业（目前支持支付宝和微信支付）支付充值金额。</p>\n<p><strong>5.2</strong> 用户如委托第三方对指定余额账户充值，则用户承诺并保证其了解和信任第三方，且第三方亦了解和同意接受用户委托为用户充值，该等委托关系存续于用户和第三方双方之间，与Ker无关；否则，如Ker被第三方告知该等充值非经第三方同意，则Ker有权立即封禁充值用户和充值行为相关的 Ker 平台账户（账户封禁期间，Ker有权暂停该账户使用本平台服务，包括不限于 API 请求或任何线上功能，下同）。自用户及相关账户被封禁之日起 30 日或Ker要求的期限内，用户应提供充足证据证实第三方事先同意为其充值，否则Ker将配合第三方的要求，自被封禁的账户中将相应款项退还第三方。如届时账户余额不足以退还的，将导致相应账户欠费，无论账户是否被封禁，欠费都可能影响相关账户对平台功能的使用。若产生欠费，则欠费部分由充值用户承担，且应在 30 日内补足欠款。</p>\n<p><strong>5.3</strong> 用户承诺并保证其用于充值的资金来源的合法性，否则Ker有权配合司法机关或其他政府主管机关的要求，对用户或相关的 Ker 平台账户进行相应处理，包括但不限于封禁用户和 Ker 平台账户等。</p>\n<h2 id=\"6-充值余额使用\">6. 充值余额使用</h2>\n<p><strong>6.1</strong> 您充值后，充值余额的使用不设有效期，不能转移、转赠。因此，请您根据自己的消耗情况选择充值金额，Ker对充值次数不做限制。</p>\n<p><strong>6.2</strong> 充值成功后，通常您可以立即开始使用相应产品（或服务），部分情况下可能存在延迟到账的情况，若较长时间仍未到账您可通过客服渠道（电子邮箱：<a href=\"#\">contact@kerapi.cn</a>）联系Ker的服务支持人员为您处理。</p>\n<h2 id=\"7-发票\">7. 发票</h2>\n<p>Ker将在您的充值余额消耗后，按照实际支付并消耗完毕的金额（不含任何抵扣、折扣部分），根据您订购的产品（或服务）协议开具等额相应发票。仅支付未消耗的金额（仍为充值账户余额）不能开票。</p>\n<h2 id=\"8-关于退款\">8. 关于退款</h2>\n<p><strong>8.1</strong> 您应充分预估实际需求并确定充值金额。</p>\n<p><strong>8.2</strong> 若您使用在线支付方式，通过第三方支付企业进行充值，充值完成后 <strong>360</strong> 日内，对于尚未消费的余额您可自行操作退款。Ker及其合作第三方支付企业将对用户的退款操作进行审核，若审核通过将会按照原支付路径退回，并可能产生相应手续费，手续费将由您自行承担。</p>\n<p><strong>8.3</strong> 原则上，您的每一笔在线支付充值仅支持一次退款。如遇特殊情况，您可通过客服渠道（电子邮箱：<a href=\"#\">contact@kerapi.cn</a>）联系Ker的服务支持人员为您处理。</p>\n<p><strong>8.4</strong> 您通过对公转账或其他方式充值的金额，不支持自助退款，您可通过客服渠道（电子邮箱：<a href=\"#\">contact@kerapi.cn</a>）联系Ker的服务支持人员，配合提供相关证明材料，Ker将在审核完成后将应退金额退回给用户，并可能产生相应手续费。</p>\n<p><strong>8.5</strong> 您完成充值并已经消耗完毕的金额，或根据相关产品（或服务）协议应予扣除的金额，Ker将不予退还。</p>\n<h2 id=\"9-争议解决\">9. 争议解决</h2>\n<p>本协议适用中华人民共和国大陆地区法律。如您因本协议与Ker发生争议的，双方应首先友好协商解决，协商不成时，我们与您任一方均有权提请北京仲裁委员会按照其届时有效仲裁规则进行仲裁，仲裁规则由此条款纳入本协议。仲裁语言为中文。仲裁地为北京。仲裁结果为终局且对双方都有约束力。</p>"}, "legal-sharing": {"title": "第三方共享信息清单和第三方 SDK 目录", "lead": "更新日期：2026 年 6 月 25 日", "html": "<p>为保障产品稳定运行、实现产品功能等目的，我们需要在您使用对应功能时向第三方共享您的个人信息。部分功能通过接入由第三方提供的软件工具开发包（SDK）的形式实现。如果您未使用相关功能，我们不会将您的个人信息与第三方共享。</p>\n<p>为向您完整、清晰地告知我们与第三方的信息共享情况，我们将可能与第三方存在的信息共享，以及涉及个人信息类型、使用目的、处理方式等信息展示如下。您可以根据名称在目录中查找并查看对应产品的信息共享详细情况，您还可以通过第三方网站链接查看第三方收集使用个人信息的规则，具体请以其公示的官方说明为准。</p>\n<p>我们将督促相关第三方按照我们在<a href=\"#/legal-privacy\">《Ker隐私政策》</a>中与您的约定收集和使用您的个人信息，并采取适当的安全技术和管理措施保障您的个人信息安全。我们也会对接入的第三方软件工具开发包（SDK）进行严格的安全监测，以保护您的个人信息安全。具体如下：</p>\n<h2 id=\"服务名称网易智企易盾\">服务名称：【网易智企·易盾】</h2>\n<p>第三方主体：【网易（杭州）网络有限公司】</p>\n<p>使用场景：【注册登录及实名认证】</p>\n<p>使用目的：【完成注册、登录及认证操作】</p>\n<p>共享数据范围：【设备 ID、IP 地址、手机号、操作数据、服务请求记录、崩溃数据、设备及设备所处物理与网络环境信息、分辨率、时区和语言信息、性能数据】</p>\n<p>共享数据方式：【SDK】</p>\n<p>处理方式：【加密】</p>\n<p>第三方隐私声明或者开发指南：【<a href=\"https://support.dun.163.com/?locale=zh-CN\">https://support.dun.163.com/?locale=zh-CN</a>】</p>\n<h2 id=\"服务名称支付宝\">服务名称：【支付宝】</h2>\n<p>第三方主体：【支付宝（杭州）数字服务技术有限公司】</p>\n<p>使用场景：【个人实名认证】</p>\n<p>使用目的：【完成个人实名认证】</p>\n<p>共享数据范围：【姓名、身份证号】</p>\n<p>共享数据方式：【API】</p>\n<p>处理方式：【加密】</p>\n<p>第三方隐私声明或者开发指南：【<a href=\"https://opendocs.alipay.com/open/02zlo2?pathHash=efd3543f\">https://opendocs.alipay.com/open/02zlo2?pathHash=efd3543f</a>】</p>\n<h2 id=\"服务名称e-签宝\">服务名称：【E 签宝】</h2>\n<p>第三方主体：【杭州天谷信息科技有限公司】</p>\n<p>使用场景：【企业/机构实名认证】</p>\n<p>使用目的：【完成企业/机构实名认证】</p>\n<p>共享数据范围：【机构名称、统一社会信用代码、法定代表人姓名、法定代表人身份证号、开户行、开户行账号】</p>\n<p>共享数据方式：【API】</p>\n<p>处理方式：【加密】</p>\n<p>第三方隐私声明或者开发指南：【<a href=\"https://open.esign.cn/doc/opendoc/identity_service/shiming\">https://open.esign.cn/doc/opendoc/i
