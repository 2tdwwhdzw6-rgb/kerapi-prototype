根据现有图像，加上prompt输入，生成图像变体。</p>\n<ul>\n<li>\n<p><strong>根据文本提示创建图像</strong></p>\n<p>在使用文生图的大模型时，为了生成更高质量的图像，输入的prompt（提示词）需要精心设计。以下是一些有助于提高生成图像质量的提示词输入技巧：</p>\n<ul>\n<li>\n<p><strong>具体描述</strong>：尽量详细地描述你想要生成的图像内容。比如，如果你想生成一幅日落的海滩风景，不要仅仅输入“海滩日落”，而是可以尝试输入“一个宁静的海滩上，夕阳西下，天空呈现出橙红色，海浪轻轻拍打着沙滩，远处有一艘小船”。</p>\n</li>\n<li>\n<p><strong>情感和氛围</strong>：除了描述图像的内容，还可以加入对情感或氛围的描述，比如“温馨的”、“神秘的”、“充满活力的”等，这样可以帮助模型更好地理解你想要的风格。</p>\n</li>\n<li>\n<p><strong>风格指定</strong>：如果你有特定的艺术风格偏好，比如“印象派”、“超现实主义”等，可以在prompt中明确指出，这样生成的图像更有可能符合你的期待。</p>\n</li>\n<li>\n<p><strong>避免模糊不清的词汇</strong>：尽量避免使用过于抽象或模糊不清的词汇，比如“美”、“好”等，这些词汇对于模型来说难以具体化，可能会导致生成的图像与预期相差较大。</p>\n</li>\n<li>\n<p><strong>使用否定词</strong>：如果你不希望图像中出现某些元素，可以使用否定词来排除。例如，“生成一幅海滩日落的图片，但不要有船”。</p>\n</li>\n<li>\n<p><strong>分步骤输入</strong>：对于复杂场景，可以尝试分步骤输入提示词，先生成基础图像，再根据需要调整或添加细节。</p>\n</li>\n<li>\n<p><strong>尝试不同的描述方式</strong>：有时候，即使描述的是同一个场景，不同的描述方式也会得到不同的结果。可以尝试从不同的角度或使用不同的词汇来描述，看看哪种方式能得到更满意的结果。</p>\n</li>\n<li>\n<p><strong>利用模型的特定功能</strong>：一些模型可能提供了特定的功能或参数调整选项，比如调整生成图像的分辨率、风格强度等，合理利用这些功能也可以帮助提高生成图像的质量。</p>\n</li>\n</ul>\n</li>\n</ul>\n<p>通过上述方法，可以有效地提高使用文生图大模型时生成图像的质量。不过，由于不同的模型可能有不同的特点和偏好，实际操作中可能还需要根据具体模型的特性和反馈进行适当的调整。</p>\n<p>可以参考如下示例：</p>\n<blockquote>\n<p>A futuristic eco-friendly skyscraper in central Tokyo. The building incorporates lush vertical gardens on every floor, with cascading plants and trees lining glass terraces. Solar panels and wind turbines are integrated into the structure&#x27;s design, reflecting a sustainable future. The Tokyo Tower is visible in the background, contrasting the modern eco-architecture with traditional city landmarks.</p>\n</blockquote>\n<blockquote>\n<p>An elegant snow leopard perched on a cliff in the Himalayan mountains, surrounded by swirling snow. The animal’s fur is intricately detailed with distinctive patterns and a thick winter coat. The scene captures the majesty and isolation of the leopard&#x27;s habitat, with mist and mountain peaks fading into the background.</p>\n</blockquote>\n<ul>\n<li><strong>根据现有图像，生成图像变体</strong></li>\n</ul>\n<p>有部分生图模型支持通过已有图像生成图像变体，这种情况下，仍然需要输入适当的prompt，才能达到预期的效果，具体prompt输入，可以参考上面内容。</p>\n<h2 id=\"2体验地址\">2.体验地址</h2>\n<p>可以通过 <a href=\"https://console.kerapi.cn/playground/image\">图像生成</a> 体验生图的功能，也可以通过 <a href=\"#/api-images\">API文档</a> 介绍，通过API进行调用。</p>\n<ul>\n<li>OpenAI 调用方式如下</li>\n</ul>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">from openai import OpenAI\n\nclient = OpenAI(api_key=\"Your-api_key\", base_url=\"https://api.kerapi.cn/v1\")\n\nresponse = client.images.generate(\n    model=\"Kwai-Kolors/Kolors\",\n    prompt=\"a cat\",\n    size=\"1024x1024\",\n    n=1,\n    extra_body={\n        \"step\": 20\n    }\n)\n\nprint(response)</pre></div>\n<ul>\n<li>\n<p><strong>重点参数介绍</strong></p>\n<ul>\n<li>\n<p><strong>image_size</strong>：控制参数的图像分辨率，API请求时候，可以自定义多种分辨率。</p>\n</li>\n<li>\n<p><strong>num_inference_steps</strong>：控制图像生成的步长。</p>\n</li>\n<li>\n<p><strong>negative_prompt</strong>：这里可以输入图像中不想出现的某些元素，消除一些影响影响因素。</p>\n</li>\n<li>\n<p><strong>seed</strong>：如果想要每次都生成固定的图片，可以把seed设置为固定值。</p>\n</li>\n<li>\n<p><strong>X-Enable-Watermark</strong>：是否为 API 生成的图片添加「AI 生成」显式水印（隐式水印固定添加），默认添加。当且仅当需要对生成图片执行下游的进一步处理时，才应显式传入 <code>X-Enable-Watermark: 0</code>；此时，开发者有法定义务自行对最终输出图片添加相关显式水印。</p>\n</li>\n</ul>\n</li>\n</ul>\n<!-- -->\n<h2 id=\"3支持模型列表\">3.支持模型列表</h2>\n<p>目前已支持的生图模型，可以通过<a href=\"https://console.kerapi.cn/models?types=to-image\">模型广场</a>查看。</p>\n<!-- -->\n注意：支持的生图模型可能发生调整，请在「模型广场」筛选“生图”标签，了解支持的模型列表。"}, "video": {"title": "视频生成", "lead": "视频生成能力支持文生视频和图生视频，提供创意内容生产的全新方式。", "html": "<h2 id=\"1-使用场景\">1. 使用场景</h2>\n<p>视频生成模型是一种利用文本或图像描述生成动态视频内容的技术，随着技术的不断发展，它的应用场景也越来越广泛。以下是一些潜在的应用领域：</p>\n<ol>\n<li>动态内容生成：视频生成模型可以生成动态的视觉内容，用于描述和解释信息；</li>\n<li>多模态智能交互：结合图像和文本输入，视频生成模型可用于更智能、更交互式的应用场景；</li>\n<li>替代传统视觉技术：视频生成模型可以替代或增强传统的机器视觉技术，解决更复杂的多模态问题； 随着技术的进步，视频生成模型的多模态能力会与视觉语言模型融合，推动其在智能交互、自动化内容生成以及复杂场景模拟等领域的全面应用。此外，视频生成模型还能与图像生成模型（图生视频）结合，进一步拓展其应用范围，实现更加丰富和多样化的视觉内容生成。</li>\n</ol>\n<h2 id=\"2-使用建议\">2. 使用建议</h2>\n<p>在编写提示词时，请关注详细、按时间顺序描述动作和场景。包含具体的动作、外貌、镜头角度以及环境细节，所有内容都应连贯地写在一个段落中，直接从动作开始，描述应具体和精确，将自己想象为在描述镜头脚本的摄影师，提示词保持在200单词以内。</p>\n<p>为了获得最佳效果，请按照以下结构构建提示词：</p>\n<ul>\n<li>从主要动作的一句话开始<!-- -->\n<ul>\n<li>示例：A woman with light skin, wearing a blue jacket and a black hat with a veil,She first looks down and to her right, then raises her head back up as she speaks.</li>\n</ul>\n</li>\n<li>添加关于动作和手势的具体细节<!-- -->\n<ul>\n<li>示例：She first looks down and to her right, then raises her head back up as she speaks.</li>\n</ul>\n</li>\n<li>精确描述角色/物体的外观<!-- -->\n<ul>\n<li>示例：She has brown hair styled in an updo, light brown eyebrows, and is wearing a white collared shirt under her blue jacket.</li>\n</ul>\n</li>\n<li>包括背景和环境的细节<!-- -->\n<ul>\n<li>示例：The background is out of focus, but shows trees and people in period clothing.</li>\n</ul>\n</li>\n<li>指定镜头角度和移动方式<!-- -->\n<ul>\n<li>示例：The camera remains stationary on her face as she speaks.</li>\n</ul>\n</li>\n<li>描述光线和颜色效果<!-- -->\n<ul>\n<li>示例：The scene is captured in real-life footage, with natural lighting and true-to-life colors.</li>\n</ul>\n</li>\n<li>注意任何变化或突发事件<!-- -->\n<ul>\n<li>示例：A gust of wind blows through the trees, causing the woman&#x27;s veil to flutter slightly.</li>\n</ul>\n</li>\n</ul>\n<p>上述prompt生成的视频示例：</p>\n<video><source><p>Your browser does not support the video tag.</p></video>\n<h2 id=\"3-体验地址\">3. 体验地址</h2>\n<p>可以点击 <a href=\"https://console.kerapi.cn/playground/text-to-video\">playground</a> 进行体验，也可以通过 <a href=\"#/api-video-submit\">API文档</a> 查看 api 调用方式。</p>\n<h2 id=\"4-支持模型\">4. 支持模型</h2>\n<h3 id=\"41-文生视频模型\">4.1 文生视频模型</h3>\n<p>目前已经支持的文生视频模型：</p>\n<ul>\n<li>Wan-AI/Wan2.2-T2V-A14B</li>\n</ul>\n<h3 id=\"42-图生视频模型\">4.2 图生视频模型</h3>\n<ol>\n<li>目前已经支持的图生视频模型：</li>\n</ol>\n<ul>\n<li>Wan-AI/Wan2.2-I2V-A14B</li>\n</ul>\n<ol start=\"2\">\n<li>图生视频的分辨率\n根据用户上传图片的宽高比自动匹配分辨率：</li>\n</ol>\n<ul>\n<li>16:9 👉 1280×720</li>\n<li>9:16 👉 720×1280</li>\n<li>1:1 👉 960×960</li>\n</ul>\n<p>为了保证最佳生成效果，建议您使用宽高比为 16:9 / 9:16 / 1:1 的图片生成视频。</p>\n注意：支持的文生视频模型可能发生调整，请在「模型广场」筛选“视频”标签，了解支持的模型列表。"}, "text-to-speech": {"title": "语音合成", "lead": "文本转语音（TTS）支持多音色语音合成，包括系统预设、用户自定义和动态音色克隆。", "html": "<h2 id=\"1-使用场景\">1. 使用场景</h2>\n<p>文本转语音模型（TTS）是一种将文本信息转换为语音输出的 AI 模型。该模型将输入文本内容生成自然流畅、富有表现力的语音，适用于多种应用场景：</p>\n<ul>\n<li>为博客文章提供音频朗读</li>\n<li>生成多语言语音内容</li>\n<li>支持实时流媒体音频输出</li>\n</ul>\n<h2 id=\"2-api-使用指南\">2. API 使用指南</h2>\n<ul>\n<li>端点：/audio/speech，具体使用可参考<a href=\"#/api-audio-speech\">api文档</a></li>\n<li>主要请求参数：<!-- -->\n<ul>\n<li>model：用于语音合成的模型，支持的<a href=\"https://console.kerapi.cn/models?types=speech\">模型列表</a>。</li>\n<li>input：待转换为音频的文本内容。</li>\n<li>voice：参考音色，支持系统预置音色、用户预置音色、用户动态音色。</li>\n<li>speed：可以控制音频速度，float类型，默认值是1.0，可选范围是[0.25,4.0]；</li>\n<li>gain：音频增益，单位dB，可以控制音频声音大小，float类型，默认值是0.0，可选范围是[-10,10]；</li>\n<li>response_format：控制输出格式，支持 mp3、opus、wav 和 pcm 格式。在选择不同的输出格式时，输出的采样率也会有所不同。</li>\n<li>sample_rate：可以控制输出采样率，对于不同的视频输出类型，默认值和可取值范围均不同，具体如下：<!-- -->\n<ul>\n<li>opus: 目前只支持48000hz</li>\n<li>wav, pcm: 支持 (8000, 16000, 24000, 32000, 44100), 默认44100</li>\n<li>mp3: 支持(32000, 44100), 默认44100</li>\n</ul>\n</li>\n</ul>\n</li>\n</ul>\n注意：输入内容不要加空格，参考音频要小于30s\n<h3 id=\"21-系统预置音色\">2.1 系统预置音色：</h3>\n<p>目前系统预置了如下 8 种音色：</p>\n<ul>\n<li>\n<p>男生音色：</p>\n<ul>\n<li>沉稳男声: <a href=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/voice_template/fish_audio-Alex.mp3\">alex</a></li>\n<li>低沉男声: <a href=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/voice_template/fish_audio-Benjamin.mp3\">benjamin</a></li>\n<li>磁性男声: <a href=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/voice_template/fish_audio-Charles.mp3\">charles</a></li>\n<li>欢快男声: <a href=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/voice_template/fish_audio-David.mp3\">david</a></li>\n</ul>\n</li>\n<li>\n<p>女生音色：</p>\n<ul>\n<li>沉稳女声: <a href=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/voice_template/fish_audio-Anna.mp3\">anna</a></li>\n<li>激情女声: <a href=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/voice_template/fish_audio-Bella.mp3\">bella</a></li>\n<li>温柔女声: <a href=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/voice_template/fish_audio-Claire.mp3\">claire</a></li>\n<li>欢快女声: <a href=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/voice_template/fish_audio-Diana.mp3\">diana</a></li>\n</ul>\n</li>\n</ul>\n<p><a href=\"https://soundcloud.com/siliconcloud/sets/siliconcloud-online-voice\">在线试听</a>上述音频。</p>\n<p>在请求中使用系统预置音色。\n在使用对应的系统预置音色时，需要在前面加上模型名称，比如：</p>\n<p><code>FunAudioLLM/CosyVoice2-0.5B:alex</code> 表示 <code>FunAudioLLM/CosyVoice2-0.5B</code> 模型下的 <code>alex</code> 音色。</p>\n<!-- -->\n<h3 id=\"22-用户预置音色\">2.2 用户预置音色：</h3>\n注意：使用用户预置音色，需要进行实名认证。\n<h4 id=\"221-通过-base64-编码格式上传用户预置音色\">2.2.1 通过 <code>base64</code> 编码格式上传用户预置音色</h4>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">import requests\nimport json\n\nurl = \"https://api.kerapi.cn/v1/uploads/audio/voice\"\nheaders = {\n    \"Authorization\": \"Bearer your-api-key\", # 从 https://console.kerapi.cn/account/ak 获取\n    \"Content-Type\": \"application/json\"\n}\ndata = {\n    \"model\": \"FunAudioLLM/CosyVoice2-0.5B\", # 模型名称\n    \"customName\": \"your-voice-name\", # 用户自定义的音频名称\n    \"audio\": \"data:audio/mpeg;base64,SUQzBAAAAAAAIlRTU0UAAAAOAAADTGF2ZjYxLjcuMTAwAAAAAAAAAAAAAAD/40DAAAAAAAAAAAAASW5mbwAAAA8AAAAWAAAJywAfHx8fKioqKio1NTU1Pz8/Pz9KSkpKVVVVVVVfX19fampqamp1dXV1f39/f3+KioqKlZWVlZWfn5+fn6qqqqq1tbW1tb+/v7/KysrKytXV1dXf39/f3+rq6ur19fX19f////\", # 参考音频的 base64 编码\n    \"text\": \"在一无所知中, 梦里的一天结束了，一个新的轮回便会开始\" # 参考音频的文字内容\n}\n\nresponse = requests.post(url, headers=headers, data=json.dumps(data))\n\n# 打印响应状态码和响应内容\nprint(response.status_code)\nprint(response.json())  # 如果响应是 JSON 格式</pre></div>\n<p>上述接口返回的 <code>uri</code> 字段，即为自定义音色的 ID，用户可以将其作为后续的 <code>voice</code> 参数中，进行请求。</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{'uri': 'speech:your-voice-name:cm04pf7az00061413w7kz5qxs:mjtkgbyuunvtybnsvbxd'}</pre></div>\n<p>在请求中使用用户预置音色。</p>\n<h4 id=\"222-通过文件上传用户预置音色\">2.2.2 通过文件上传用户预置音色</h4>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">import requests\n\nurl = \"https://api.kerapi.cn/v1/uploads/audio/voice\"\nheaders = {\n    \"Authorization\": \"Bearer your-api-key\" # 从 https://console.kerapi.cn/account/ak 获取\n}\nfiles = {\n    \"file\": open(\"/Users/senseb/Downloads/fish_audio-Alex.mp3\", \"rb\") # 参考音频文件\n}\ndata = {\n    \"model\": \"FunAudioLLM/CosyVoice2-0.5B\", # 模型名称\n    \"customName\": \"your-voice-name\", # 参考音频名称\n    \"text\": \"在一无所知中, 梦里的一天结束了，一个新的轮回便会开始\" # 参考音频的文字内容\n}\n\nresponse = requests.post(url, headers=headers, files=files, data=data)\n\nprint(response.status_code)\nprint(response.json())  # 打印响应内容（如果是JSON格式）</pre></div>\n<p>上述接口返回的 <code>uri</code> 字段，即为自定义音色的 ID，用户可以将其作为后续的 <code>voice</code> 参数中，进行请求。</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{'uri': 'speech:your-voice-name:cm04pf7az00061413w7kz5qxs:mjtkgbyuunvtybnsvbxd'}</pre></div>\n<p>在请求中使用用户预置音色。</p>\n<h3 id=\"23-获取用户动态音色列表\">2.3 获取用户动态音色列表</h3>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">import requests\nurl = \"https://api.kerapi.cn/v1/audio/voice/list\"\n\nheaders = {\n    \"Authorization\": \"Bearer your-api-key\" # 从https://console.kerapi.cn/account/ak获取\n}\nresponse = requests.get(url, headers=headers)\n\nprint(response.status_code)\nprint(response.json()) # 打印响应内容（如果是JSON格式）</pre></div>\n<p>上述接口返回的 <code>uri</code> 字段，即为自定义音色的 ID，用户可以将其作为后续的 <code>voice</code> 参数中，进行请求。</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{'uri': 'speech:your-voice-name:cm04pf7az00061413w7kz5qxs:mjtkgbyuunvtybnsvbxd'}</pre></div>\n<p>在请求中使用用户预置音色。</p>\n<h3 id=\"24-使用用户动态音色\">2.4 使用用户动态音色</h3>\n注意：使用用户预置音色，需要进行实名认证。\n<p>在请求中使用用户动态音色。</p>\n<h3 id=\"25-删除用户动态音色\">2.5 删除用户动态音色</h3>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">import requests\n\nurl = \"https://api.kerapi.cn/v1/audio/voice/deletions\"\nheaders = {\n    \"Authorization\": \"Bearer your-api-key\",\n    \"Content-Type\": \"application/json\"\n}\npayload = {\n    \"uri\": \"speech:your-voice-name:cm02pf7az00061413w7kz5qxs:mttkgbyuunvtybnsvbxd\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.status_code)\nprint(response.text) #打印响应内容</pre></div>\n<p>上述接口请求参数中的 <code>uri</code> 字段，即为自定义音色的 ID。</p>\n<h2 id=\"3-支持模型列表\">3. 支持模型列表</h2>\n注意：支持的 TTS 模型可能发生调整，请在「模型广场」筛选<a href=\"https://console.kerapi.cn/models?types=speech\">“语音”标签</a> 获得当前支持的模型列表。\n计费方式：按照输入文本长度对应的 UTF-8 字节 数进行计费，<a href=\"https://mothereff.in/byte-counter\">在线字节计数器演示</a>。\n<!-- -->\n<h3 id=\"31-funaudiollmcosyvoice2-05b-系列模型\">3.1 FunAudioLLM/CosyVoice2-0.5B 系列模型</h3>\n<ul>\n<li>跨语言语音合成：实现不同语言之间的语音合成，中文、英文、日语、韩语、中国方言（粤语，四川话，上海话，郑州话，长沙话，天津话）</li>\n<li>情感控制：支持生成具有多种情感表达的语音，包括快乐、兴奋、悲伤、愤怒等。</li>\n<li>细粒度控制：通过富文本或自然语言，对生成语音的情感和韵律进行细粒度控制。</li>\n</ul>\n<h3 id=\"32-fnlpmoss-ttsd-v05\">3.2 fnlp/MOSS-TTSD-v0.5</h3>\n<ul>\n<li>高表现力语音：自然对话语调，支持情感表达</li>\n<li>双人语音克隆：零样本克隆，自动切换说话人</li>\n<li>中英双语支持：流畅混合合成，发音自然</li>\n<li>长篇语音生成：低延迟，稳定输出长文本</li>\n</ul>\n<h2 id=\"4-参考音频的最佳实践\">4. 参考音频的最佳实践</h2>\n<p>提供参考音频的高质量样本可以提升语音克隆效果。</p>\n<h3 id=\"41-音频质量指南\">4.1 音频质量指南</h3>\n<ul>\n<li>仅限单一说话人</li>\n<li>吐字清晰、稳定的音量、音调和情绪</li>\n<li>简短的停顿（建议 0.5 秒）</li>\n<li>理想情况：无背景噪音、专业录音质量、无房间回声</li>\n<li>建议时间8～10s左右</li>\n</ul>\n<h3 id=\"42-文件格式\">4.2 文件格式</h3>\n<ul>\n<li>支持格式：mp3, wav, pcm, opus</li>\n<li>推荐使用 192kbps 以上的 mp3 以避免质量损失</li>\n<li>未压缩格式（例如 WAV）提供的额外优势有限</li>\n</ul>\n<h2 id=\"5-使用示例\">5. 使用示例</h2>\n<h3 id=\"51-使用系统预置音色\">5.1 使用系统预置音色</h3>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">from pathlib import Path\nfrom openai import OpenAI\n\nspeech_file_path = Path(__file__).parent / \"siliconcloud-generated-speech.mp3\"\n\nclient = OpenAI(\n    api_key=\"您的 APIKEY\", # 从 https://console.kerapi.cn/account/ak 获取\n    base_url=\"https://api.kerapi.cn/v1\"\n)\n\nwith client.audio.speech.with_streaming_response.create(\n  model=\"FunAudioLLM/CosyVoice2-0.5B\", # 支持 fishaudio / GPT-SoVITS / CosyVoice2-0.5B 系列模型\n  voice=\"FunAudioLLM/CosyVoice2-0.5B:alex\", # 系统预置音色\n  # 用户输入信息\n  input=\"你能用高兴的情感说吗？&lt;|endofprompt|&gt;今天真是太开心了，马上要放假了！I'm so happy, Spring Festival is coming!\",\n  response_format=\"mp3\" # 支持 mp3, wav, pcm, opus 格式\n) as response:\n    response.stream_to_file(speech_file_path)</pre></div>\n<h4 id=\"52-使用用户预置音色\">5.2 使用用户预置音色</h4>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">from pathlib import Path\nfrom openai import OpenAI\n\nspeech_file_path = Path(__file__).parent / \"siliconcloud-generated-speech.mp3\"\n\nclient = OpenAI(\n    api_key=\"您的 APIKEY\", # 从 https://console.kerapi.cn/account/ak 获取\n    base_url=\"https://api.kerapi.cn/v1\"\n)\n\nwith client.audio.speech.with_streaming_response.create(\n  model=\"FunAudioLLM/CosyVoice2-0.5B\", # 支持 fishaudio / GPT-SoVITS / CosyVoice2-0.5B 系列模型\n  voice=\"speech:your-voice-name:cm02pf7az00061413w7kz5qxs:mttkgbyuunvtybnsvbxd\", # 用户上传音色名称，参考\n  # 用户输入信息\n  input=\" 请问你能模仿粤语的口音吗？&lt; |endofprompt| &gt;多保重，早休息。\",\n  response_format=\"mp3\"\n) as response:\n    response.stream_to_file(speech_file_path)</pre></div>\n<h4 id=\"53-使用用户动态音色\">5.3 使用用户动态音色</h4>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">from pathlib import Path\nfrom openai import OpenAI\nclient = OpenAI()\n\nspeech_file_path = Path(__file__).parent / \"siliconcloud-generated-speech.mp3\"\n\nclient = OpenAI(\n    api_key=\"您的 APIKEY\", # 从 https://console.kerapi.cn/account/ak 获取\n    base_url=\"https://api.kerapi.cn/v1\"\n)\n\nwith client.audio.speech.with_streaming_response.create(\n  model=\"FunAudioLLM/CosyVoice2-0.5B\", \n  voice=\"\", # 此处传入空值，表示使用动态音色\n  # 用户输入信息\n  input=\"  [laughter]有时候，看着小孩子们的天真行为[laughter]，我们总会会心一笑。\",\n  response_format=\"mp3\",\n  extra_body={\"references\":[\n        {\n            \"audio\": \"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/voice_template/fish_audio-Alex.mp3\", # 参考音频 url。也支持 base64 格式\n            \"text\": \"在一无所知中, 梦里的一天结束了，一个新的轮回便会开始\", # 参考音频的文字内容\n        }\n    ]}\n) as response:\n    response.stream_to_file(speech_file_path)</pre></div>\n<h4 id=\"54-fnlpmoss-ttsd-v05-使用示例\">5.4 fnlp/MOSS-TTSD-v0.5 使用示例</h4>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\"># -*- coding: utf-8 -*-\nimport requests\nimport json\n\nurl = \"https://api.kerapi.cn/v1/audio/speech\"\ntoken = \"Your-api-key\"\n\nrequest_data = {\n                \"model\": \"fnlp/MOSS-TTSD-v0.5\",\n                \"stream\": True,\n                \"input\": \"[S1]Hello, how are you today?[S2]I'm doing great, thanks for asking![S1]That's wonderful to hear.\",\n                \"references\": [\n                    {\n                        \"audio\": \"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/voice_template/fish_audio-Charles.mp3\",\n                        \"text\": \"他又躺在那里，眼睛闭着，仍然沉浸在梦境的气氛里。那是个庞杂而亮堂的梦\",\n                    },\n                    {\n                        \"audio\": \"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/voice_template/fish_audio-Claire.mp3\",\n                        \"text\": \"他又躺在那里，眼睛闭着，仍然沉浸在梦境的气氛里。那是个庞杂而亮堂的梦\"\n                    }\n                    ],\n                \"max_tokens\": 1600,\n                \"response_format\": \"mp3\",\n                \"speed\": 1,\n                \"gain\": 0\n                }\nheaders = {'Content-Type': 'application/json', 'Authorization': \"Bearer \" + token}\ntry:\n    res = requests.post(url=url, data=json.dumps(request_data), headers=headers)\n    if res.status_code != 200:\n        print(res.text)\n    with open('./test.mp3', 'wb') as file:\n        file.write(res.content)\nexcept Exception as e:\n    print(request_data)\n    print(e)</pre></div>"}, "rate-limit": {"title": "限流说明", "lead": "了解 Ker API 的速率限制规则，以及触发限流后的应对方式。", "html": "\n<p>Ker API 对各模型的调用实施速率限制（RPM：每分钟请求数；TPM：每分钟 Token 数），以保障服务稳定性。各模型的具体限额以模型详情页与价格页标注为准。</p>\n<h2 id=\"触发限流\">触发限流的表现</h2>\n<p>当请求超过速率限制时，接口返回 <code>429</code> 状态码，响应中会说明具体限制类型（如 TPM limit reached / RPM limit reached）。</p>\n<h2 id=\"应对建议\">应对建议</h2>\n<ul>\n<li><strong>指数退避重试</strong>：收到 429 后按 1s、2s、4s… 的间隔递增重试，避免持续冲击；</li>\n<li><strong>降低并发</strong>：控制客户端并发请求数，或将任务错峰调度；</li>\n<li><strong>合并请求</strong>：在满足业务的前提下减少请求频率或单次输入 Token 量；</li>\n<li><strong>申请提升限额</strong>：如确有更高的调用需求，可通过工单反馈联系平台评估调整。</li>\n</ul>\n<div class=\"code-wrap\"><span class=\"copy-btn\" data-copy>复制</span><pre class=\"code\">说明：用户等级与配额权益体系将在后续版本上线，当前各模型限额以平台配置为准。</pre></div>\n"}, "auth": {"title": "实名认证", "lead": "完成个人或企业实名认证，解锁支付、开票与更高额度能力。", "html": "\n<p>实名认证用于完成个人或企业主体核验，是使用支付、开票以及更高额度能力的前提。</p>\n<h2 id=\"认证类型\">认证类型</h2>\n<ul>\n<li><strong>个人认证</strong>：面向个人开发者，支持扫码、银行卡等核验方式；</li>\n<li><strong>企业认证</strong>：面向企业主体，支持法人人脸、对公打款等核验方式。</li>\n</ul>\n<p>具体可选的核验方式以认证页面实际提供为准（由合规方案确定）。</p>\n<h2 id=\"认证状态\">认证状态</h2>\n<table><thead><tr><th>状态</th><th>说明</th></tr></thead><tbody>\n<tr><td>未认证</td><td>尚未提交认证，支付、开票等能力受限</td></tr>\n<tr><td>认证中</td><td>资料已提交，等待核验结果</td></tr>\n<tr><td>已认证</td><td>核验通过，可使用对应主体的完整能力</td></tr>\n<tr><td>认证失败</td><td>核验未通过，页面展示失败原因和重新提交入口</td></tr>\n<tr><td>已过期</td><td>认证已失效（如有），需重新认证</td></tr>\n</tbody></table>\n<h2 id=\"注意事项\">注意事项</h2>\n<ul>\n<li>请确保填写的主体信息真实有效；已认证主体修改关键信息后，可能需要重新认证，以页面提示为准；</li>\n<li>认证资料仅用于主体核验，平台会对资料的保存、查看权限和数据保护做严格管控；</li>\n<li>企业认证通过后，开票、对公转账等企业能力将与认证主体关联。</li>\n</ul>\n"}, "error-code": {"title": "API 请求错误排查", "lead": "API 错误码参考手册，帮助开发者快速定位并解决接口调用中的各类错误。", "html": "<p><strong>1. 尝试获取 HTTP 错误代码，初步定位问题</strong></p>\n<p>a. 在代码中，尽量把错误码和报错信息（message）打印出来，利用这些信息，可以定位大部分问题。</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">HTTP/1.1 400 Bad Request\nDate: Thu, 19 Dec 2024 08:39:19 GMT\nContent-Type: application/json; charset=utf-8\nContent-Length: 87\nConnection: keep-alive\n\n{\"code\":20012,\"message\":\"Model does not exist. Please check it carefully.\",\"data\":null}</pre></div>\n<ul>\n<li>常见错误代码及原因：<!-- -->\n<ul>\n<li><strong>400</strong>：参数不正确，请参考报错信息（message）修正不合法的请求参数；</li>\n<li><strong>401</strong>：API Key 没有正确设置；</li>\n<li><strong>402</strong>：账户欠费，请充值后重试；</li>\n<li><strong>403</strong>：权限不够，最常见的原因是该模型需要实名认证，其他情况参考报错信息（message）；</li>\n<li><strong>429</strong>：触发了 rate limits；参考报错信息（message）判断触发的是 <code>RPM /RPD / TPM / TPD / IPM / IPD</code> 中的具体哪一种，可以参考 <a href=\"#/rate-limit\">Rate Limits</a> 了解具体的限流策略</li>\n<li><strong>504 / 503</strong>：<!-- -->\n<ul>\n<li>一般是服务系统负载比较高，可以稍后尝试；</li>\n<li>对于对话和文本转语音请求，可以尝试使用流式输出（&quot;stream&quot; : true），参考 <a href=\"#/stream-mode\">流式输出</a>；</li>\n</ul>\n</li>\n<li><strong>500</strong>：服务发生了未知的错误，可以联系相关人员进行排查</li>\n</ul>\n</li>\n</ul>\n<img src=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/doc-resources/images/faqs/mic/image_3.webp\">\n<p>b. 如果客户端没有输出相应的信息，可以考虑在命令行下运行 curl 命令 （以 LLM 模型为例）:</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">curl --request POST \\\n   --url https://api.kerapi.cn/v1/chat/completions \\\n   --header 'accept: application/json' \\\n   --header 'authorization: Bearer 改成你的apikey' \\\n   --header 'content-type: application/json' \\\n   --data '\n{\n  \"model\": \"记得改模型\",\n  \"messages\": [\n    {\n      \"role\": \"user\",\n      \"content\": \"你好\"\n    }\n  ],\n  \"max_tokens\": 128\n}' -i</pre></div>\n<p><strong>2. 可以尝试换一个模型，看看问题是否依旧</strong></p>\n<p><strong>3. 如果开了代理，可以考虑将代理关闭后再尝试访问</strong></p>\n 如遇其他问题，请点击<a href=\"#\">KerMaaS线上需求收集表</a>反馈。"}, "misc": {"title": "模型问题排查", "lead": "", "html": "<h2 id=\"1-模型输出乱码\">1. 模型输出乱码</h2>\n<p>目前看到部分模型在不设置参数的情况下，容易出现乱码，遇到上述情况，可以尝试设置<code>temperature</code>，<code>top_k</code>，<code>top_p</code>，<code>frequency_penalty</code>这些参数。</p>\n<p>对应的 payload 修改为如下形式，不同语言酌情调整</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">    payload = {\n        \"model\": \"Qwen/Qwen2.5-Math-72B-Instruct\",\n        \"messages\": [\n            {\n                \"role\": \"user\",\n                \"content\": \"1+1=?\",\n            }\n        ],\n        \"max_tokens\": 200,  # 按需添加\n        \"temperature\": 0.7, # 按需添加\n        \"top_k\": 50,        # 按需添加\n        \"top_p\": 0.7,       # 按需添加\n        \"frequency_penalty\": 0 # 按需添加\n    }</pre></div>\n<h2 id=\"2-关于max_tokens说明\">2. 关于<code>max_tokens</code>说明</h2>\n<p>max_tokens 与<code>上下文长度</code>相等，由于部分模型推理服务尚在更新中，请不要在请求时将 max_tokens 设置为最大值（上下文长度），建议留出 10k 左右作为输入内容的空间。</p>\n<h2 id=\"3-关于context_length说明\">3. 关于<code>context_length</code>说明</h2>\n<p>不同的LLM模型，<code>context_length</code>是有差别的，具体可以在<a href=\"https://console.kerapi.cn/models\">模型广场</a>上搜索对应的模型，查看模型具体信息。</p>\n<!-- -->\n<h2 id=\"4-pro-和非-pro-模型有什么区别\">4. Pro 和非 Pro 模型有什么区别</h2>\n<ol>\n<li>\n<p>对于部分模型，平台同时提供免费版和收费版。免费版按原名称命名；收费版在名称前加上“Pro/”以示区分。免费版的 Rate Limits 固定，收费版的 Rate Limits 可变，具体规则请参考：<a href=\"#/rate-limit\">Rate Limits</a>。</p>\n</li>\n<li>\n<p>对于 <code>DeepSeek R1</code> 和 <code>DeepSeek V3</code> 模型，平台根据<code>支付方式</code>的不同要求区分命名。<code>Pro 版</code>仅支持<code>充值余额</code>支付，<code>非 Pro 版</code>支持<code>赠费余额</code>和<code>充值余额</code>支付。</p>\n</li>\n</ol>\n<h2 id=\"5-语音模型中对用户自定义音色有时间音质要求么\">5. 语音模型中，对用户自定义音色有时间音质要求么</h2>\n<ul>\n<li>cosyvoice2 上传音色必须小于30s</li>\n</ul>\n<h2 id=\"6-模型输出截断问题\">6. 模型输出截断问题</h2>\n<p>可以从以下几方面进行问题的排查：</p>\n<ul>\n<li>通过API请求时候，输出截断问题排查：<!-- -->\n<ul>\n<li>max_tokens设置：max_token设置到合适值，输出大于max_token的情况下，会被截断。</li>\n<li>设置流式输出请求：非流式请求时候，输出内容比较长的情况下，容易出现504超时。</li>\n<li>设置客户端超时时间：把客户端超时时间设置大一些，防止未输出完成，达到客户端超时时间被截断。</li>\n</ul>\n</li>\n<li>通过第三方客户端请求，输出截断问题排查：<!-- -->\n<ul>\n<li>Cherry Studio 默认的 max_tokens 是 4096，用户可以通过设置，打开“开启消息长度限制”的开关，将max_token设置到合适值</li>\n</ul>\n</li>\n</ul>\n<img src=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/doc-resources/images/faqs/mic/image_5.webp\">\n<h2 id=\"7-模型使用过程中返回429错误排查\">7. 模型使用过程中返回429错误排查</h2>\n<p>可以从以下几方面进行问题的排查：</p>\n<ul>\n<li>普通用户：检查用户等级及模型对应的 Rate Limits（速率限制）。如果请求超出 Rate Limits，建议稍后再尝试请求。</li>\n<li>专属实例用户：专属实例通常没有 Rate Limits 限制。如果出现 429 错误，首先确认是否调用了专属实例的正确模型名称，并检查使用的 api_key 是否与专属实例匹配。</li>\n</ul>\n<h2 id=\"8-已充值成功仍然提示账户余额不足\">8. 已充值成功，仍然提示账户余额不足</h2>\n<p>可以从以下几方面进行问题的排查：</p>\n<ul>\n<li>确认使用的 api_key 是否与刚刚充值的账户匹配。</li>\n<li>如果 api_key 无误，可能是充值过程中存在网络延迟，建议等待几分钟后再重试。</li>\n</ul>\n<h2 id=\"9-已实名认证还是无法访问部分模型\">9. 已实名认证，还是无法访问部分模型</h2>\n<p>可以从以下几方面进行问题的排查：</p>\n<ul>\n<li>确认使用的 api_key 是否与刚刚完成实名认证的账户匹配。</li>\n<li>如果 api_key 无误，可以进入<a href=\"https://console.kerapi.cn/account/authentication\">实名认证</a>页面，检查认证状态。如果状态显示为“认证中”，可以尝试取消并重新进行认证。</li>\n</ul>\n<h2 id=\"10-fnlpmoss-ttsd-v05-使用问题\">10. fnlp/MOSS-TTSD-v0.5 使用问题</h2>\n<ul>\n<li>该模型输入的文字过短时候，容易出现错误</li>\n<li>使用该模型进行对话合成时，输入文案格式如下：<!-- -->\n<ul>\n<li>[S1]发言人1说话内容。[S2]发言人2说话内容。</li>\n</ul>\n</li>\n</ul>\n 如遇其他问题，请点击<a href=\"#\">KerMaaS线上需求收集表</a>反馈。"}, "misc-finance": {"title": "财务相关", "lead": "财务相关常见问题，包括余额充值、消费记录、退款政策及代金券使用说明。", "html": "<h2 id=\"1-如何充值\">1. 如何充值</h2>\n<ol>\n<li>电脑端登录 <a href=\"https://console.kerapi.cn/\">Ker</a> 官网。</li>\n<li>点击左侧边栏 &quot;<a href=\"https://console.kerapi.cn/account/authentication\">实名认证</a>&quot; 进行认证。</li>\n<li>点击左侧边栏 &quot;<a href=\"https://console.kerapi.cn/expensebill\">余额充值</a>&quot; 进行充值。</li>\n</ol>\n<p>平台提供三种余额充值方式：在线充值、支付宝自动充值和对公转账汇款。</p>\n<h3 id=\"在线充值\">在线充值</h3>\n<p>在线充值适用于即时到账的小额或中额充值（单笔最大金额为 10 万元）。电脑端会展示付款二维码，使用手机扫码完成支付；手机端会跳转至第三方支付 App 进行支付。</p>\n<p><strong>操作步骤</strong></p>\n<ol>\n<li>在余额充值页面，切换到 <strong>在线充值</strong> Tab</li>\n<li>选择 <strong>支付金额</strong>：可选择金额选项，也可点击「其它金额」自定义输入</li>\n<li>选择 <strong>支付方式</strong>：<!-- -->\n<ul>\n<li>支付宝</li>\n<li>其他支付方式（目前支持微信支付）</li>\n</ul>\n</li>\n<li>完成安全验证（点击「点击完成验证」区域）</li>\n<li>勾选「我已知悉充值资金不支持直接开具发票，确认支付即代表同意本平台「充值协议」」</li>\n<li>点击 <strong>确认支付</strong>：<!-- -->\n<ul>\n<li><strong>电脑端</strong>：系统生成支付二维码，使用支付宝或微信扫码完成付款</li>\n<li><strong>手机端</strong>：系统将自动跳转至对应的第三方支付 App，按提示完成支付</li>\n</ul>\n</li>\n<li>支付成功后，充值金额将实时到账至账户余额</li>\n</ol>\n<img src=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/doc-resources/images/faqs/mic/image_recharge_online.webp\">\n<p><strong>注意事项</strong></p>\n<ul>\n<li>若支付过程中遇到问题，请检查网络连接或尝试更换支付方式</li>\n<li>支付成功后若余额未及时更新，请稍后刷新页面查看</li>\n</ul>\n<h3 id=\"支付宝自动充值\">支付宝自动充值</h3>\n<p>支付宝自动充值由支付宝提供签约服务。开通后，当账户余额低于设定的阈值时，平台会自动发起充值，无需手动操作，且支持随时取消。</p>\n<p><strong>自动充值规则</strong></p>\n<ul>\n<li>签约后，平台每 10 分钟检测一次余额</li>\n<li>当余额低于设定阈值时，自动触发充值</li>\n<li>使用自动充值功能时，单次上限 ¥2,000，每日累计上限 ¥6,000，每月累计上限 ¥100,000</li>\n<li>默认不在夜间（22:00 ~ 次日 08:00）执行，开通后可在设置中调整</li>\n<li>自动充值执行前 10 分钟，系统会向你发送短信通知</li>\n<li>可随时取消自动充值签约</li>\n</ul>\n<p><strong>操作步骤</strong></p>\n<ol>\n<li>在余额充值页面，切换到 <strong>自动充值</strong> Tab</li>\n<li>选择 <strong>设定阈值</strong> 和 <strong>充值金额</strong>\n<ul>\n<li><strong>设定阈值</strong>：可选阈值选项或点击「其他金额」自定义填写，范围为 ¥5 ~ ¥1,000</li>\n<li><strong>自动充值金额</strong>：可选充值金额选项或「其他金额」自定义填写，必须大于设定阈值，小于 ¥2,000</li>\n</ul>\n</li>\n<li>确认页面下方显示的触发规则（例如：余额 &lt; ¥10 时，自动充值 ¥20）</li>\n<li>点击 <strong>立即签约</strong></li>\n<li>使用支付宝扫描二维码完成签约授权</li>\n<li>签约成功后，自动充值功能即生效</li>\n</ol>\n<img src=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/doc-resources/images/faqs/mic/image_recharge_auto.webp\">\n<p><strong>注意事项</strong></p>\n<ul>\n<li>自动充值签约与支付宝账户绑定，请确保账户余额充足</li>\n<li>如需调整阈值、单次充值金额，请先解除旧约再签新约</li>\n<li>当扣款失败时，自动充值功能将自动停止，用户需要手动解约再签新约</li>\n<li>解除签约后，自动充值将立即停止，已发起的扣款不受影响</li>\n</ul>\n<h3 id=\"对公转账汇款\">对公转账汇款</h3>\n<p>对公转账汇款适用于企业用户的大额充值（单笔最大金额为 1 亿元）。使用前需先完成企业认证，再创建订单，然后向平台分配的专属对公账户汇款。款项确认后，系统自动充值至账户余额。</p>\n<p><strong>操作步骤</strong></p>\n<ol>\n<li>在余额充值页面，切换到 <strong>对公转账汇款</strong> Tab</li>\n<li>确认已完成企业认证，且计划打款账户与实名认证主体名称一致</li>\n<li>选择 <strong>充值金额</strong>：支持选择金额选项，也可点击「其它金额」自定义输入</li>\n<li>勾选「我已知悉充值资金不支持直接开具发票，确认支付即代表同意本平台「充值协议」」</li>\n<li>点击 <strong>创建订单</strong></li>\n<li>系统跳转至对公转账订单详情页，页面展示：<!-- -->\n<ul>\n<li>订单号、商户名称、创单日期、应付金额</li>\n<li>专属收款账号信息（账户名称、收款银行、专属收款账号、金额）</li>\n<li>支付剩余时间（订单需在有效期内完成支付，超时将自动取消）</li>\n</ul>\n</li>\n<li>点击「复制全部收款信息」或逐项复制，也可直接分享订单链接，交给财务人员进行银行转账</li>\n<li>转账完成后，系统将在 1~5 分钟内更新交易状态</li>\n</ol>\n<img src=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/doc-resources/images/faqs/mic/image_recharge_corp.webp\">\n<p><strong>注意事项</strong></p>\n<ul>\n<li>向专属对公账户汇款前，<strong>必须先创建订单</strong>，付款金额需与订单金额完全一致</li>\n<li>请务必使用与实名认证主体名称一致的银行账户进行转账，否则将导致充值失败</li>\n<li>若因企业认证名称发生变更导致汇款失败，请联系 <a href=\"#\">contact@kerapi.cn</a></li>\n<li>转账后，系统通常需要 <strong>1~5 分钟</strong> 更新交易状态，请勿重复转账</li>\n<li>若因未按要求转账导致订单交易失败，已转账资金通常将在 <strong>24 小时内退回</strong></li>\n<li>如遇银行转账系统关闭，资金将在交易恢复后陆续到账，请耐心等待</li>\n<li>若在预期时间内充值款项未到账，请联系 <a href=\"#\">contact@kerapi.cn</a></li>\n</ul>\n<h2 id=\"2-如何查询使用账单\">2. 如何查询使用账单</h2>\n<ol>\n<li>电脑端登录 <a href=\"https://console.kerapi.cn/\">Ker</a> 官网。</li>\n<li>点击左侧边栏 “<a href=\"https://console.kerapi.cn/bills\">费用账单</a>” 了解。<br>\n如您需要开发票，请根据 <a href=\"#/invoice\">开具发票</a> 发邮件，我们会根据您的实际消耗费用开发票。</li>\n</ol>\n<img src=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/doc-resources/images/faqs/mic/image_1.webp\">\n<h2 id=\"3-模型微调的计费规则\">3. 模型微调的计费规则</h2>\n<p>模型微调功能会按照训练和推理两个不同场景独立计费。\n费用查看路径：<a href=\"https://console.kerapi.cn/fine-tune\">模型微调</a> - 新建微调任务，选择所需的“基础模型”后，页面会显示对应的“微调训练价格”和“微调推理价格”。</p>\n<img src=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/doc-resources/images/faqs/mic/image_4.webp\">\n 如遇其他问题，请点击<a href=\"#\">KerMaaS线上需求收集表</a>反馈。"}, "invoice": {"title": "发票管理", "lead": "如何查询可开票金额、申请开票以及跟踪开票进度。", "html": "\n<h2 id=\"开票资格\">开票资格</h2>\n<p>仅<b>已消费金额</b>可申请开票。未消费的充值余额、系统赠送金额暂不支持开票，具体以平台财务规则为准。</p>\n<p>您可以在控制台「发票管理」页面查看三个金额：</p>\n<ul>\n<li><strong>累计已消费金额</strong>：账户内已实际消耗的费用总额，是可申请开票的额度来源；</li>\n<li><strong>已开票金额</strong>：历史已成功开具发票的金额合计；</li>\n<li><strong>剩余可开票金额</strong>：累计已消费金额减去已开票金额，即本次最多可申请的开票金额。</li>\n</ul>\n<h2 id=\"申请发票\">申请发票</h2>\n<p>进入控制台「发票管理」页面，点击「申请开票」，按以下步骤操作：</p>\n<ol>\n<li><strong>选择消费订单</strong>：勾选本次需要开票的账单记录，申请金额不得超过剩余可开票金额；</li>\n<li><strong>填写开票信息</strong>：按发票类型填写下方信息，提交前请仔细核对；</li>\n<li><strong>提交申请</strong>：提交后进入审核流程，平台财务确认无误后开具发票，并回传至系统。</li>\n</ol>\n<p>发票类型分为<b>普通发票</b>与<b>专用发票</b>，所需信息如下：</p>\n<table><thead><tr><th>信息项</th><th>普通发票</th><th>专用发票</th></tr></thead><tbody>\n<tr><td>发票抬头</td><td>必填</td><td>必填</td></tr>\n<tr><td>税号</td><td>必填</td><td>必填</td></tr>\n<tr><td>发票内容</td><td>必填</td><td>必填</td></tr>\n<tr><td>开票金额</td><td>必填</td><td>必填</td></tr>\n<tr><td>接收邮箱</td><td>必填</td><td>必填</td></tr>\n<tr><td>开票人</td><td>必填</td><td>必填</td></tr>\n<tr><td>身份证号</td><td>必填</td><td>必填</td></tr>\n<tr><td>电话</td><td>必填</td><td>必填</td></tr>\n<tr><td>注册地址</td><td>—</td><td>必填</td></tr>\n<tr><td>开户行及银行账号</td><td>—</td><td>必填</td></tr>\n</tbody></table>\n<p>信息校验失败时会提示具体原因（如税号格式错误、金额超出剩余可开票金额等），请根据提示修正后重新提交。</p>\n<h2 id=\"发票记录\">发票记录与状态</h2>\n<p>「发票管理」页面展示全部开票申请记录，包含申请单号、申请时间、金额、发票抬头、状态、发票号码和操作。</p>\n<table><thead><tr><th>状态</th><th>说明</th></tr></thead><tbody>\n<tr><td><b>审核中</b></td><td>申请已提交，等待平台财务审核</td></tr>\n<tr><td><b>已开具</b></td><td>发票已开具，可在记录中下载电子发票，同时发送至接收邮箱</td></tr>\n<tr><td><b>已驳回</b></td><td>审核未通过，记录中会展示驳回原因，修正后可重新提交</td></tr>\n<tr><td><b>已撤销</b></td><td>申请已被撤销，对应的可开票金额自动释放</td></tr>\n</tbody></table>\n<h2 id=\"常见问题\">常见问题</h2>\n<p><strong>Q：赠送金额可以开票吗？</strong><br/>不可以。仅已实际消费的金额可申请开票，系统赠送金额不参与开票。</p>\n<p><strong>Q：申请金额填错了怎么办？</strong><br/>申请金额不能超过剩余可开票金额。如已提交错误申请，可在记录中撤销（审核中状态下），金额释放后重新申请。</p>\n<p><strong>Q：发票多久可以开具？</strong><br/>提交后由平台财务统一审核开票，具体时效以页面提示为准；开具后可发票记录页下载，也会发送至您填写的接收邮箱。</p>\n<p><strong>Q：驳回后怎么处理？</strong><br/>在发票记录中查看驳回原因，修正开票信息后重新提交申请即可。</p>\n"}, "misc-use": {"title": "账户相关", "lead": "使用相关常见问题，解答 API 调用、模型选择、参数配置等实际操作中的疑问。", "html": "<h2 id=\"1-如何注销账号\">1. 如何注销账号</h2>\n<p>请进入<a href=\"#\">个人中心</a>页面，点击“申请注销”，填写注销账号申请。核实后将在 15 个工作日内处理。</p>\n<img src=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/doc-resources/images/faqs/mic/image_6.webp\">\n<h2 id=\"2-如何邀请\">2. 如何邀请</h2>\n<ol>\n<li>电脑端登录 <a href=\"https://console.kerapi.cn/\">Ker</a> 官网。</li>\n<li>点击左侧边栏 <strong>「推荐官计划」</strong>，进入<a href=\"https://console.kerapi.cn/me/campaigns/inviter\">推荐官页面</a>，点击 <strong>申请成为推荐官</strong> ；</li>\n<li>分享邀请信息。</li>\n<li>邀请成功的具体信息会显示在 <strong>我的邀请记录</strong> 模块</li>\n</ol>\n<p>有三种邀请方式供选择：二维码、邀请码和邀请链接。</p>\n<img src=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/doc-resources/images/faqs/mic/image_2.webp\">\n<h2 id=\"3-为什么我的手机号无法注册或绑定\">3. 为什么我的手机号无法注册或绑定？</h2>\n<p>为保障平台用户的账户安全与服务体验，平台对部分可能存在安全风险的手机号号段（如部分虚拟运营商号段）做了注册与绑定限制。此举旨在为您提供更加安全、稳定的服务环境，降低因恶意行为对正常使用可能带来的干扰和影响。</p>\n<p>建议您使用中国大陆常见运营商（如中国移动、中国联通、中国电信）所提供的常规手机号进行注册或绑定操作。</p>\n<p>如您使用的是正规手机号但仍出现提示，可添加小助手微信，我们将及时协助您解决。</p>\n<img src=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/doc-resources/images/faqs/mic/assistant.jpeg\">\n<h2 id=\"4-为什么无法进行-google--github-关联登录了\">4. 为什么无法进行 Google / GitHub 关联登录了？</h2>\n<p>为了提升账户安全性，Ker中文站已于近期下线 Google / GitHub 的关联登录功能。\n如您已绑定手机号，仍可通过手机登录；或使用“邮箱登录”功能，输入您的 Google / GitHub 邮箱地址接收验证码完成登录。</p>\n 如遇其他问题，请点击<a href=\"#\">KerMaaS线上需求收集表</a>反馈。"}, "release-notes": {"title": "更新公告", "lead": "Ker API 平台更新日志，涵盖版本发布、功能上线与重要变更。", "html": "\n<p><strong>发布时间：2026 年 9 月 29 日</strong></p>\n<p>Ker API 平台 <strong>v0.1.0</strong> 正式上线 🎉 本期上线内容如下：</p>\n<h3 id=\"核心能力\">核心能力</h3>\n<ul>\n<li>大模型 API 服务正式开放，支持<b>对话生成、深度推理、多模态理解</b>等能力；</li>\n<li>兼容 <b>OpenAI</b> 与 <b>Anthropic</b> 接口协议，官方 SDK 替换 base_url 即可接入；</li>\n<li>支持<b>流式输出、Function Calling、JSON 模式、前缀续写、FIM 补全</b>等特性；</li>\n<li>图片生成、视频生成、语音合成等多模态生成能力同步上线。</li>\n</ul>\n<h3 id=\"模型与计费\">模型与计费</h3>\n<ul>\n<li>模型广场上线首批模型，展示模型详情、上下文长度、价格与速率上限；</li>\n<li>按 Token 与按次 / 按时长计费，价格按渠道基础折扣结算；</li>\n<li>「计费规则」「账单中心」上线，消费明细与资金流水可查询、可导出。</li>\n</ul>\n<h3 id=\"账户与权益\">账户与权益</h3>\n<ul>\n<li>支持<b>手机号 / 邮箱</b>双通道注册登录；</li>\n<li><b>个人实名认证</b>与<b>企业认证</b>上线，认证后可使用支付、开票与更高额度能力；</li>\n<li>「API Key 管理」上线：支持预算控制（固定总预算 / 月度预算）、有效期、IP 白名单、模型与供应商限制；</li>\n<li>「余额充值」上线：支持支付宝、微信、银行卡与对公转账；</li>\n<li>「发票管理」上线：支持查询可开票金额、申请开票与进度跟踪。</li>\n</ul>\n<h3 id=\"服务与支持\">服务与支持</h3>\n<ul>\n<li>「文档中心」「通知公告」上线，重要变更将第一时间同步；</li>\n<li>「工单反馈」上线，支持提交产品、账户、支付和接口问题并跟踪处理进度。</li>\n</ul>\n<h3 id=\"后续计划\">后续计划</h3>\n<ul>\n<li>用户等级与配额权益体系；</li>\n<li>团队管理与成员协作；</li>\n<li>更多模型与渠道持续接入，敬请期待。</li>\n</ul>\n"}, "api-audio-speech": {"title": "创建文本转语音请求", "lead": "根据输入文本生成音频。接口生成的数据为音频二进制数据，需要用户自行处理。", "html": "<div class=\"endpoint-card\"><span class=\"method m-post\">POST</span><code class=\"ep-path\">https://api.kerapi.cn/v1/audio/speech</code><span class=\"lock\">Bearer 认证</span></div><h2 id=\"authorization\">Authorization</h2><p>所有请求需要在 Header 中携带 API Key 进行 Bearer 认证：</p><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">Authorization: Bearer &lt;你的 API Key&gt;</pre></div><h2 id=\"header-parameters\">Header Parameters</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>X-Trace-Id</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>请求追踪 ID。可自定义传入用于标记本次请求；若不传入，平台将自动生成。排查问题时，提供该值或响应头中的 x-siliconcloud-trace-id 均可。</td></tr><tr><td><code>traceparent</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>W3C Trace Context 标准追踪头。传入时，平台取其中的 trace-id 作为本次请求的追踪标识。</td></tr></tbody></table><h2 id=\"request-body\">Request Body</h2><h3>MOSS-TTSD-v0.5</h3><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>model</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>MOSS-TTSD（text to spoken dialogue）是一个开源的双语对话语音合成模型，支持中文和英文。它可以将两位说话人之间的对话脚本转换为自然、富有表现力的对话语音。MOSS-TTSD 支持声音克隆和长单会话语音生成，非常适合 AI 播客制作。\n为更好地提升服务质量，我们会对本服务提供的模型进行定期变更，包括但不限于模型上下线和模型服务能力的调整。在可行的情况下，我们会通过公告或消息推送等适当方式通知您此类变更。　<em>可选值：<code>&quot;fnlp/MOSS-TTSD-v0.5&quot;</code></em></td></tr><tr><td><code>input</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>对话文本使用说话人标签来标识轮次：\n[S1]：表示说话人 1 正在说话\n[S2]：表示说话人 2 正在说话　<em>示例：<code>&quot;[S1]Hello, how are you today?[S2]I&#x27;m doing great, thanks for asking![S1]That&#x27;s wonderful to hear &quot;</code></em></td></tr><tr><td><code>max_tokens</code></td><td><span class=\"type-chip\">integer</span></td><td><span class=\"opt-badge\">可选</span></td><td>要生成的最大 token 数量。输入 + 输出不超过 32k token。</td></tr><tr><td><code>references</code></td><td><span class=\"type-chip\">array&lt;object&gt;</span></td><td><span class=\"opt-badge\">可选</span></td><td>voice 字段和 references 字段互斥。如需使用脚本化对话，需要通过 references 字段传入两种音色。脚本化对话仅适用于 MOSS-TTSD 模型。</td></tr><tr><td><code>voice</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>voice 字段目前不支持两种音色。如需上传两种音色，请使用 references 字段。　<em>示例：<code>&quot;fnlp/MOSS-TTSD-v0.5:alex&quot;</code></em></td></tr><tr><td><code>response_format</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>音频的输出格式。支持的格式有 <code>mp3</code>、<code>opus</code>、<code>wav</code>、<code>pcm</code>　<em>可选值：<code>&quot;mp3&quot; | &quot;opus&quot; | &quot;wav&quot; | &quot;pcm&quot;</code></em></td></tr><tr><td><code>sample_rate</code></td><td><span class=\"type-chip\">number</span></td><td><span class=\"opt-badge\">可选</span></td><td>控制输出采样率。不同音频输出类型的默认值和支持范围如下：opus：支持 48000 Hz。wav、pcm：支持 8000、16000、24000、32000、44100 Hz，默认值为 44100 Hz。mp3：支持 32000、44100 Hz，默认值为 44100 Hz</td></tr><tr><td><code>stream</code></td><td><span class=\"type-chip\">boolean</span></td><td><span class=\"opt-badge\">可选</span></td><td>是否使用流式输出　<em>可选值：<code>false | true</code></em></td></tr><tr><td><code>speed</code></td><td><span class=\"type-chip\">number</span></td><td><span class=\"opt-badge\">可选</span></td><td>生成音频的语速。可选值范围为 <code>0.25</code> 到 <code>4.0</code>。默认值为 <code>1.0</code>。</td></tr><tr><td><code>gain</code></td><td><span class=\"type-chip\">number</span></td><td><span class=\"opt-badge\">可选</span></td><td>音频增益，用于调整输出音量。取值范围为 <code>-10.0</code> 到 <code>10.0</code>，默认值为 <code>0.0</code>。</td></tr></tbody></table><h3>CosyVoice2-0.5B</h3><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>model</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>对应的模型名称。为更好地提升服务质量，我们会对本服务提供的模型进行定期变更，包括但不限于模型上下线和模型服务能力的调整。在可行的情况下，我们会通过公告或消息推送等适当方式通知您此类变更。　<em>可选值：<code>&quot;FunAudioLLM/CosyVoice2-0.5B&quot;</code></em></td></tr><tr><td><code>input</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>对于自然语言指令，请在自然语言描述前添加特殊结束标记 &quot;&lt;|endofprompt|&gt;&quot;。这些描述涵盖情感、语速、角色扮演和方言等方面。对于详细指令，在文本标记之间插入音高变化，使用如 &quot;[laughter]&quot; 和 &quot;[breath]&quot; 之类的标记。此外，我们将音高特征标记应用于短语；例如：Can you say it with a happy emotion? &lt;|endofprompt|&gt; Today is really happy, Spring Festival is coming! I’m so happy, Spring Festival is coming! [laughter] [breath].　<em>示例：<code>&quot;Can you say it with a happy emotion? &lt;|endofprompt|&gt;I&#x27;m so happy, Spring Festival is coming!&quot;</code></em></td></tr><tr><td><code>voice</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>voice 字段目前不支持两种音色。如需上传两种音色，请使用 references 字段。　<em>示例：<code>&quot;FunAudioLLM/CosyVoice2-0.5B:alex&quot;</code></em></td></tr><tr><td><code>references</code></td><td><span class=\"type-chip\">array&lt;object&gt;</span></td><td><span class=\"opt-badge\">可选</span></td><td>voice 字段和 references 字段互斥。</td></tr><tr><td><code>response_format</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>音频的输出格式。支持的格式有 <code>mp3</code>、<code>opus</code>、<code>wav</code>、<code>pcm</code>　<em>可选值：<code>&quot;mp3&quot; | &quot;opus&quot; | &quot;wav&quot; | &quot;pcm&quot;</code></em></td></tr><tr><td><code>sample_rate</code></td><td><span class=\"type-chip\">number</span></td><td><span class=\"opt-badge\">可选</span></td><td>控制输出采样率。不同音频输出类型的默认值和支持范围如下：opus：支持 48000 Hz。wav、pcm：支持 8000、16000、24000、32000、44100 Hz，默认值为 44100 Hz。mp3：支持 32000、44100 Hz，默认值为 44100 Hz</td></tr><tr><td><code>stream</code></td><td><span class=\"type-chip\">boolean</span></td><td><span class=\"opt-badge\">可选</span></td><td>是否使用流式输出</td></tr><tr><td><code>speed</code></td><td><span class=\"type-chip\">number</span></td><td><span class=\"opt-badge\">可选</span></td><td>生成音频的语速。可选值范围为 <code>0.25</code> 到 <code>4.0</code>。默认值为 <code>1.0</code>。</td></tr><tr><td><code>gain</code></td><td><span class=\"type-chip\">number</span></td><td><span class=\"opt-badge\">可选</span></td><td>音频增益，用于调整输出音量。取值范围为 <code>-10.0</code> 到 <code>10.0</code>，默认值为 <code>0.0</code>。</td></tr></tbody></table><h2 id=\"response-body\">Response Body</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>response</code></td><td><span class=\"type-chip\">file</span></td><td><span class=\"opt-badge\">可选</span></td><td>　<em>示例：<code>&quot;音频的二进制数据&quot;</code></em></td></tr></tbody></table><h2 id=\"examples\">请求示例</h2><div><div class=\"tabs\"><span class=\"tab active\" data-tab=\"0\">cURL</span><span class=\"tab\" data-tab=\"1\">Python</span></div><div data-pane=\"0\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">curl --request POST \\\n  --url https://api.kerapi.cn/v1/audio/speech \\\n  -H \"Authorization: Bearer YOUR_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"model\": \"fnlp/MOSS-TTSD-v0.5\",\n    \"input\": \"你站在桥上看风景，看风景的人在楼上看你。明月装饰了你的窗子，你装饰了别人的梦\",\n    \"voice\": \"fnlp/MOSS-TTSD-v0.5:alex\",\n    \"response_format\": \"mp3\"\n  }' --output output.mp3</pre></div></div><div data-pane=\"1\" style=\"display:none\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">import requests\n\nurl = \"https://api.kerapi.cn/v1/audio/speech\"\npayload = {\n    \"model\": \"fnlp/MOSS-TTSD-v0.5\",\n    \"input\": \"你站在桥上看风景，看风景的人在楼上看你。明月装饰了你的窗子，你装饰了别人的梦\",\n    \"voice\": \"fnlp/MOSS-TTSD-v0.5:alex\",\n    \"response_format\": \"mp3\"\n}\nheaders = {\n    \"Authorization\": \"Bearer YOUR_API_KEY\",\n    \"Content-Type\": \"application/json\"\n}\n\nresponse = requests.post(url, json=payload, headers=headers)\nwith open(\"output.mp3\", \"wb\") as f:\n    f.write(response.content)</pre></div></div></div><h2 id=\"response-example\">响应示例</h2><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">\"音频的二进制数据\"</pre></div><h2 id=\"errors\">错误响应</h2><table><thead><tr><th>状态码</th><th>说明</th><th>示例响应</th></tr></thead><tbody><tr><td><b>400</b></td><td>请求参数错误</td><td><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"code\": 20012,\n  \"message\": \"string\",\n  \"data\": \"string\"\n}</pre></div></td></tr><tr><td><b>401</b></td><td>身份认证失败（API Key 无效）</td><td><code>\"Invalid token\"</code></td></tr><tr><td><b>403</b></td><td>没有权限访问该资源</td><td><code>\"Forbidden\"</code></td></tr><tr><td><b>404</b></td><td>资源不存在</td><td><code>\"404 page not found\"</code></td></tr><tr><td><b>429</b></td><td>触发速率限制</td><td><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"message\": \"Request was rejected due to rate limiting. If you want more, please contact contact@kerapi.cn. Deta</pre></div></td></tr><tr><td><b>503</b></td><td>模型服务过载，请稍后重试</td><td><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"code\": 50505,\n  \"message\": \"Model service overloaded. Please try again later.\",\n  \"data\": \"string\"\n}</pre></div></td></tr><tr><td><b>504</b></td><td>请求超时</td><td><code>\"string\"</code></td></tr></tbody></table>"}, "api-chat": {"title": "创建对话请求（OpenAI）", "lead": "根据给定的聊天对话创建模型响应。", "html": "<div class=\"endpoint-card\"><span class=\"method m-post\">POST</span><code class=\"ep-path\">https://api.kerapi.cn/v1/chat/completions</code><span class=\"lock\">Bearer 认证</span></div><h2 id=\"authorization\">Authorization</h2><p>所有请求需要在 Header 中携带 API Key 进行 Bearer 认证：</p><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">Authorization: Bearer &lt;你的 API Key&gt;</pre></div><h2 id=\"header-parameters\">Header Parameters</h2><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>X-Trace-Id</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>请求追踪 ID。可自定义传入用于标记本次请求；若不传入，平台将自动生成。排查问题时，提供该值或响应头中的 x-siliconcloud-trace-id 均可。</td></tr><tr><td><code>traceparent</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>W3C Trace Context 标准追踪头。传入时，平台取其中的 trace-id 作为本次请求的追踪标识。</td></tr></tbody></table><h2 id=\"request-body\">Request Body</h2><h3>LLM</h3><table><thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody><tr><td><code>model</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"req-badge\">必填</span></td><td>对应的模型名称。为更好地提升服务质量，我们会对本服务提供的模型进行定期变更，包括但不限于模型上下线和模型服务能力的调整。在可行的情况下，我们会通过公告或消息推送等适当方式通知您此类变更。<strong>完整可用模型列表请查看 <a href=\"https://console.kerapi.cn/models?types=chat\">对话模型</a></strong>。　<em>示例：<code>&quot;deepseek-ai/DeepSeek-V4-Flash&quot;</code></em></td></tr><tr><td><code>messages</code></td><td><span class=\"type-chip\">array&lt;object&gt;</span></td><td><span class=\"req-badge\">必填</span></td><td>对话消息列表</td></tr><tr><td><code>stream</code></td><td><span class=\"type-chip\">boolean</span></td><td><span class=\"opt-badge\">可选</span></td><td>如果设置，token 将以 SSE（Server-Sent Events）的形式流式输出。流式传输通常以 <code>data: [DONE]</code> 结束　<em>可选值：<code>false | true</code></em></td></tr><tr><td><code>max_tokens</code></td><td><span class=\"type-chip\">integer</span></td><td><span class=\"opt-badge\">可选</span></td><td>要生成的最大 token 数量，不包含思维链部分。建议不要将 max_tokens 设置为窗口上限，为输入和系统开销预留约 10k token 的缓冲区。</td></tr><tr><td><code>enable_thinking</code></td><td><span class=\"type-chip\">boolean</span></td><td><span class=\"opt-badge\">可选</span></td><td>在推理模式与非推理模式之间切换。该字段适用于大多数<a href=\"https://console.kerapi.cn/me/models?tags=Reasoning\">推理模型</a>。　<em>可选值：<code>false | true</code></em></td></tr><tr><td><code>thinking_budget</code></td><td><span class=\"type-chip\">integer</span></td><td><span class=\"opt-badge\">可选</span></td><td>思维链输出的最大 token 数量。该字段适用于大多数<a href=\"https://console.kerapi.cn/me/models?tags=Reasoning\">推理模型</a>。</td></tr><tr><td><code>reasoning_effort</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>该字段适用于 Pro/deepseek-ai/DeepSeek-V4、deepseek-ai/DeepSeek-V4-Flash 以及 Pro/zai-org/GLM-5.2。\n在推理模式下，常规请求的默认 effort 为 high；对于某些复杂的智能体类型请求（如 Claude Code、OpenCode），effort 会自动设置为 max。\n在推理模式下，为兼容起见，low 和 medium 会映射为 high，xhigh 会映射为 max。　<em>可选值：<code>&quot;high&quot; | &quot;max&quot;</code></em></td></tr><tr><td><code>min_p</code></td><td><span class=\"type-chip\">number</span></td><td><span class=\"opt-badge\">可选</span></td><td>根据 token 概率动态调整的过滤阈值。该字段仅适用于 Qwen3。</td></tr><tr><td><code>stop</code></td><td><span class=\"type-chip\">array&lt;string&gt; | string | null</span></td><td><span class=\"opt-badge\">可选 d><td><span class=\"type-chip\">integer</span></td><td><span class=\"opt-badge\">可选</span></td><td></td></tr><tr><td><code>model</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td></td></tr><tr><td><code>object</code></td><td><span class=\"type-chip\">string</span></td><td><span class=\"opt-badge\">可选</span></td><td>　<em>可选值：<code>&quot;chat.completion&quot;</code></em></td></tr></tbody></table><h2 id=\"examples\">请求示例</h2><h3>示例 1</h3><div><div class=\"tabs\"><span class=\"tab active\" data-tab=\"0\">cURL</span><span class=\"tab\" data-tab=\"1\">Python</span></div><div data-pane=\"0\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">curl --request POST \\\n  --url https://api.kerapi.cn/v1/chat/completions \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Authorization: Bearer YOUR_API_KEY\" \\\n  -d '{\n    \"model\": \"deepseek-ai/DeepSeek-V4-Flash\",\n    \"messages\": [\n      {\"role\": \"system\", \"content\": \"你是一个有用的助手\"},\n      {\"role\": \"user\", \"content\": \"你好，请介绍一下你自己\"}\n    ]\n  }'</pre></div></div><div data-pane=\"1\" style=\"display:none\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">from openai import OpenAI\n\nclient = OpenAI(\n    api_key=\"YOUR_API_KEY\",\n    base_url=\"https://api.kerapi.cn/v1\"\n)\n\nresponse = client.chat.completions.create(\n    model=\"deepseek-ai/DeepSeek-V4-Flash\",\n    messages=[\n        {\"role\": \"system\", \"content\": \"你是一个有用的助手\"},\n        {\"role\": \"user\", \"content\": \"你好，请介绍一下你自己\"}\n    ]\n)\nprint(response.choices[0].message.content)</pre></div></div></div><h3>示例 2</h3><div><div class=\"tabs\"><span class=\"tab active\" data-tab=\"0\">cURL</span><span class=\"tab\" data-tab=\"1\">Python</span></div><div data-pane=\"0\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">curl --request POST \\\n  --url https://api.kerapi.cn/v1/chat/completions \\\n  -H \"Content-Type: application/json\" \\\n  -H \"Authorization: Bearer ***\" \\\n  -d '{\n    \"model\": \"moonshotai/Kimi-K2.7-Code\",\n    \"messages\": [\n      {\n        \"role\": \"user\",\n        \"content\": [\n          {\"type\": \"text\", \"text\": \"描述这张图片\"},\n          {\"type\": \"image_url\", \"image_url\": {\"url\": \"https://example.com/image.jpg\"}}\n        ]\n      }\n    ],\n    \"max_tokens\": 4096\n  }'</pre></div></div><div data-pane=\"1\" style=\"display:none\"><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">from openai import OpenAI\n\nclient = OpenAI(\n    api_key=\"YOUR_API_KEY\",\n    base_url=\"https://api.kerapi.cn/v1\"\n)\n\ntools = [\n  {\n    \"type\": \"function\",\n    \"function\": {\n      \"name\": \"get_current_weather\",\n      \"description\": \"Get the current weather in a given location\",\n      \"parameters\": {\n        \"type\": \"object\",\n        \"properties\": {\n          \"location\": {\n            \"type\": \"string\",\n            \"description\": \"The city and state, e.g. San Francisco, CA\",\n          },\n          \"unit\": {\"type\": \"string\", \"enum\": [\"celsius\", \"fahrenheit\"]},\n        },\n        \"required\": [\"location\"],\n      },\n    }\n  }\n]\n\nmessages = [\n    {\"role\": \"system\", \"content\": \"你是一个有用的助手\"},\n    {\"role\": \"user\", \"content\": \"波士顿今天天气怎么样？\"},\n    {\"role\": \"assistant\", \"content\": \"波士顿今天晴，气温 20°C。\"},\n    {\"role\": \"user\", \"content\": \"那纽约呢？\"}\n]\n\nstream = client.chat.completions.create(\n    model=\"deepseek-ai/DeepSeek-V4-Flash\",\n    messages=messages,\n    tools=tools,\n    tool_choice=\"auto\",\n    stream=True,\n)\n\nfor chunk in stream:\n    delta = chunk.choices[0].delta\n    if delta.content:\n        print(delta.content, end=\"\", flush=True)\n    if delta.tool_calls:</pre></div></div></div><h2 id=\"response-example\">响应示例</h2><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n  \"id\": \"019bdaa55225ef854b320e9b838f77ce\",\n  \"object\": \"chat.completion\",\n  \"created\": 1768899826,\n  \"model\": \"deepseek-ai/DeepSeek-V4-Flash\",\n  \"choices\": [\n    {\n      \"index\": 0,\n      \"message\": {\n        \"role\": \"assistant\",\n        \"content\": \"你好！...\",\n        \"reasoning_content\": \"...\"\n      },\n      \"finish_reason\": \"stop\"\n    }\n  ],\n  \"usage\": {\n    \"prompt_tokens\": 15,\n    \"completion_tokens\
