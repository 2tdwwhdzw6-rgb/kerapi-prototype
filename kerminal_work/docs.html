<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ker API 文档中心</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#fff; --border:#e6e8eb; --text:#1f2329; --muted:#646a73; --faint:#8f959e;
  --primary:#3370ff; --primary-weak:#eaf1ff; --code-bg:#f7f8fa;
  --orange:#ff8800; --green:#34c724; --red:#f54a45;
}
html { scroll-behavior:smooth; }
body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       color:var(--text); font-size:14px; background:var(--bg); }
a { color:var(--primary); text-decoration:none; }
a:hover { text-decoration:underline; cursor:pointer; }
::selection { background:#d4e4ff; }

/* ============ 顶部导航 ============ */
.navbar { height:56px; display:flex; align-items:center; gap:24px; padding:0 24px;
          border-bottom:1px solid var(--border); background:rgba(255,255,255,.92);
          position:sticky; top:0; z-index:30; backdrop-filter:blur(6px); }
.brand { display:flex; align-items:center; gap:9px; font-weight:700; font-size:15px; color:var(--text); }
.brand:hover { text-decoration:none; }
.brand-logo { width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,#3370ff,#7c5cff);
              color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; }
.navbar .doc-badge { font-size:12px; color:var(--primary); background:var(--primary-weak);
                     padding:2px 8px; border-radius:4px; font-weight:600; }
.nav-search { flex:0 0 300px; height:32px; border:1px solid var(--border); border-radius:8px;
              background:var(--code-bg); font-size:13px; padding:0 12px; color:var(--faint);
              display:flex; align-items:center; justify-content:space-between; cursor:pointer; }
.nav-search:hover { border-color:#c9cdd4; }
.nav-search kbd { font-size:11px; border:1px solid var(--border); background:#fff; border-radius:4px;
                  padding:1px 6px; color:var(--faint); font-family:inherit; }
.nav-links { margin-left:auto; display:flex; align-items:center; gap:22px; font-size:13.5px; }
.nav-links a { color:var(--muted); }
.nav-links a:hover { color:var(--text); text-decoration:none; }
.nav-links .cta { color:#fff; background:var(--primary); padding:7px 14px; border-radius:8px; font-weight:500; }
.nav-links .cta:hover { background:#285ddd; }

/* ============ 三栏布局 ============ */
.layout { display:flex; align-items:flex-start; }
.sidebar { width:272px; flex-shrink:0; border-right:1px solid var(--border); background:var(--bg);
           position:sticky; top:56px; height:calc(100vh - 56px); overflow-y:auto; padding:18px 10px 60px; }
.sidebar::-webkit-scrollbar { width:5px; } .sidebar::-webkit-scrollbar-thumb { background:#d5d8dd; border-radius:3px; }

.side-folder { margin-bottom:4px; }
.side-folder > .f-head { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px;
                         font-size:14.5px; font-weight:700; color:var(--text); cursor:pointer; user-select:none; }
.side-folder > .f-head:hover { background:#f2f3f5; }
.side-folder > .f-head .ico { font-size:16px; line-height:1; }
.side-folder > .f-head .f-name { flex:1; }
.side-folder > .f-head .chev { width:0; height:0; border-left:4.5px solid #c0c4cb; border-top:4px solid transparent;
                               border-bottom:4px solid transparent; transition:transform .15s; }
.side-folder.open > .f-head .chev { transform:rotate(90deg); }
.side-folder .f-body { display:none; padding-bottom:2px; }
.side-folder.open .f-body { display:block; }
.side-sep { display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:#565b63;
            padding:14px 10px 5px; letter-spacing:.02em; }
.side-sep .ico { font-size:13px; line-height:1; }
.side-item { display:flex; align-items:center; gap:7px; padding:7px 10px 7px 12px; border-radius:8px; font-size:14px;
             color:#3c4149; cursor:pointer; margin-bottom:1px; }
.side-item span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.side-item:hover { background:#f2f3f5; color:var(--text); text-decoration:none; }
.side-item.active { background:var(--primary-weak); color:var(--primary); font-weight:700;
                    box-shadow:inset 3px 0 0 var(--primary); }
.side-item .ext { margin-left:auto; font-size:11px; color:var(--faint); flex-shrink:0; }
.side-item.side-top { font-weight:700; }

/* ============ 文章区 ============ */
.article { flex:1; min-width:0; padding:36px 48px 80px 40px; }
.layout .article > * { max-width:920px; margin-left:auto; margin-right:auto; }
.crumb { font-size:12.5px; color:var(--faint); margin-bottom:14px; }
.crumb b { color:var(--muted); font-weight:500; }
.crumb .sep { margin:0 6px; color:#c9cdd4; }
.article h1 { font-size:30px; font-weight:700; margin-bottom:12px; line-height:1.35; color:var(--text); }
.lead { color:var(--muted); font-size:15.5px; line-height:1.75; margin-bottom:26px; }
.article h2 { font-size:21px; font-weight:700; margin:36px 0 14px; padding-top:8px; line-height:1.4; color:var(--text); }
.article h3 { font-size:17px; font-weight:700; margin:26px 0 10px; color:var(--text); }
.article h4 { font-size:15px; font-weight:700; margin:18px 0 8px; color:var(--text); }
.article p { line-height:1.85; color:#2c3138; font-size:14.5px; margin-bottom:11px; }
.article ul, .article ol { padding-left:24px; line-height:1.9; color:#2c3138; font-size:14.5px; margin-bottom:11px; }
.article li { margin-bottom:3px; }
.article li::marker { color:var(--faint); }
.article strong { font-weight:600; color:var(--text); }
.article hr { border:none; border-top:1px solid var(--border); margin:22px 0; }
.article img { max-width:100%; border:1px solid var(--border); border-radius:10px; margin:8px 0;
               box-shadow:0 1px 3px rgba(31,35,41,.06); display:block; }
.article code { background:var(--code-bg); border:1px solid var(--border); border-radius:5px;
                padding:1px 6px; font-family:"SF Mono",ui-monospace,Menlo,monospace; font-size:13px;
                color:#d63384; word-break:break-all; }
.article table { width:100%; max-width:100%; border-collapse:collapse; margin:14px 0; font-size:13.5px; }
.article th { background:#f5f6f8; font-weight:600; color:var(--text); }
.article th, .article td { border:1px solid var(--border); padding:9px 13px; text-align:left;
                           line-height:1.7; vertical-align:top; }
.article blockquote { border-left:3px solid var(--primary); background:var(--primary-weak);
                      border-radius:0 8px 8px 0; padding:10px 16px; margin:14px 0; color:#2b4cb8; font-size:14px; }
.article blockquote p { margin:0; color:inherit; }
.article blockquote code { background:rgba(255,255,255,.6); }

/* 代码块 */
.code-wrap { position:relative; margin:14px 0; }
.copy-btn { position:absolute; top:10px; right:10px; width:30px; height:30px; display:flex; align-items:center;
            justify-content:center; background:rgba(255,255,255,.1); color:#c9d1d9;
            border:none; border-radius:7px; cursor:pointer; z-index:2; transition:background .12s; }
.copy-btn svg { width:15px; height:15px; }
.copy-btn:hover { background:rgba(255,255,255,.22); color:#fff; }
.copy-btn.copied { color:#7ee787; background:rgba(126,231,135,.12); }
pre.code { background:#0d1117; color:#c9d1d9; border-radius:10px; padding:16px 18px;
           font-family:"SF Mono",ui-monospace,Menlo,monospace; font-size:12.5px; line-height:1.75;
           overflow:auto; white-space:pre; }
pre.code::-webkit-scrollbar { height:6px; } pre.code::-webkit-scrollbar-thumb { background:#333; border-radius:3px; }

/* tabs */
.tabs { display:flex; gap:2px; border-bottom:1px solid var(--border); margin:16px 0 0; }
.tab { padding:8px 18px; font-size:13px; cursor:pointer; color:var(--muted);
       border-bottom:2px solid transparent; margin-bottom:-1px; user-select:none; }
.tab:hover { color:var(--text); }
.tab.active { color:var(--primary); border-color:var(--primary); font-weight:600; }

/* endpoint 卡片 */
.endpoint-card { display:flex; align-items:center; gap:12px; border:1px solid var(--border);
                 border-radius:10px; padding:13px 16px; margin:6px 0 20px; background:#fbfcfd;
                 box-shadow:0 1px 3px rgba(31,35,41,.05); }
.method { font-family:"SF Mono",ui-monospace,Menlo,monospace; font-size:12.5px; font-weight:700;
          padding:3px 10px; border-radius:6px; color:#fff; flex-shrink:0; }
.method.m-post, .method.m-put { background:var(--green); }
.method.m-get { background:var(--primary); }
.method.m-delete { background:var(--red); }
.ep-path { font-family:"SF Mono",ui-monospace,Menlo,monospace; font-size:13.5px; color:var(--text);
           background:transparent; border:none; padding:0; word-break:break-all; }
.endpoint-card .lock { margin-left:auto; font-size:12px; color:var(--faint); flex-shrink:0; }

/* API 参数表徽标 */
.req-badge { display:inline-block; font-size:11px; color:var(--red); border:1px solid #ffd5d2;
             background:#fff1f0; border-radius:4px; padding:0 6px; font-weight:600; }
.opt-badge { display:inline-block; font-size:11px; color:var(--faint); border:1px solid var(--border);
             background:#f7f8fa; border-radius:4px; padding:0 6px; }
.type-chip { font-family:"SF Mono",ui-monospace,Menlo,monospace; font-size:12px; color:var(--muted); }

/* 上一页 / 下一页 */
.pager { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:44px; padding-top:22px;
         border-top:1px solid var(--border); }
.pager a { display:flex; flex-direction:column; gap:4px; border:1px solid var(--border); border-radius:10px;
           padding:13px 16px; font-size:13px; color:var(--text); }
.pager a:hover { border-color:var(--primary); background:#fafbff; text-decoration:none; }
.pager a.next { text-align:right; align-items:flex-end; }
.pager .dir { font-size:11.5px; color:var(--faint); }
.pager .pt { font-weight:600; font-size:13.5px; color:var(--primary); }

/* ============ 右侧目录 ============ */
.toc { width:250px; flex-shrink:0; position:sticky; top:90px; height:fit-content; max-height:calc(100vh - 110px);
       overflow-y:auto; padding:36px 8px 20px 0; font-size:13.5px; }
.toc::-webkit-scrollbar { width:4px; } .toc::-webkit-scrollbar-thumb { background:#d5d8dd; border-radius:3px; }
.toc .t-title { color:var(--faint); font-weight:700; margin-bottom:8px; padding-left:12px; font-size:12.5px; }
.toc a { display:block; color:var(--muted); padding:4.5px 12px; border-left:2px solid transparent; line-height:1.55; }
.toc a:hover { color:var(--text); text-decoration:none; }
.toc a.lvl3 { padding-left:26px; font-size:13px; }
.toc a.on { color:var(--primary); border-left-color:var(--primary); font-weight:600; }

/* ============ 搜索弹层 ============ */
.search-mask { position:fixed; inset:0; background:rgba(31,35,41,.4); z-index:90; display:none;
               backdrop-filter:blur(2px); }
.search-mask.show { display:block; }
.search-modal { position:fixed; top:12vh; left:50%; transform:translateX(-50%); width:min(640px,92vw);
                background:#fff; border-radius:14px; box-shadow:0 12px 40px rgba(31,35,41,.18); z-index:91;
                display:none; overflow:hidden; }
.search-modal.show { display:block; }
.sm-input { display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--border); }
.sm-input svg { flex-shrink:0; }
.sm-input input { flex:1; border:none; outline:none; font-size:15px; font-family:inherit; color:var(--text); }
.sm-input input::placeholder { color:var(--faint); }
.sm-input kbd { font-size:11px; border:1px solid var(--border); border-radius:4px; padding:2px 6px; color:var(--faint); }
.sm-list { max-height:52vh; overflow-y:auto; padding:8px; }
.sm-item { display:flex; flex-direction:column; gap:2px; padding:10px 12px; border-radius:8px; cursor:pointer; }
.sm-item:hover, .sm-item.sel { background:var(--primary-weak); }
.sm-item .st { font-size:13.5px; font-weight:600; color:var(--text); display:flex; gap:8px; align-items:center; }
.sm-item .st .grp { font-size:11px; color:var(--faint); font-weight:400; flex-shrink:0; }
.sm-item .snip { font-size:12px; color:var(--muted); line-height:1.6; overflow:hidden; text-overflow:ellipsis;
                 display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.sm-empty { padding:28px; text-align:center; color:var(--faint); font-size:13px; }
.sm-foot { display:flex; gap:16px; padding:9px 16px; border-top:1px solid var(--border); font-size:11.5px;
           color:var(--faint); background:#fafbfc; }
.sm-foot b { font-weight:600; }

/* 响应式 */
@media (max-width:1100px) { .toc { display:none; } }
@media (max-width:820px) {
  .sidebar { position:fixed; left:-280px; z-index:50; transition:left .2s; box-shadow:0 0 24px rgba(0,0,0,.12); }
  .sidebar.mobile-open { left:0; }
  .article { padding:26px 20px 60px; }
  .nav-links a:not(.cta) { display:none; }
  .nav-search { flex:0 0 150px; }
  .menu-btn { display:flex !important; }
}
.menu-btn { display:none; width:32px; height:32px; border:1px solid var(--border); border-radius:8px;
            align-items:center; justify-content:center; cursor:pointer; color:var(--muted); font-size:16px; }

.code-lang { position:absolute; top:12px; right:64px; font-size:11px; color:#8b949e; font-family:"SF Mono",ui-monospace,Menlo,monospace; }
</style>
</head>

<nav class="navbar">
  <div class="menu-btn" id="menuBtn">☰</div>

</div>

window.__DOCS__ = {"introduction": {"title": "平台简介", "lead": "Ker 平台简介，了解Ker大模型云服务的核心能力与产品矩阵。", "html": "<h2 id=\"概述\">概述</h2>\n<p>Ker 平台依托先进自研推理引擎、高弹性算力调度平台和高扩展性 API 服务，致力于为广大开发者提供更快、更全面、更丝滑的大模型 API 调用和部署服务，帮助开发者和企业聚焦产品创新，轻松融入 AI 能力，享受高速、安全、稳定、智能、易用的 AI 云服务</p>\n<h2 id=\"核心产品矩阵\">核心产品矩阵</h2>\n<h3 id=\"开箱即用的大模型-api\">开箱即用的大模型 API</h3>\n<ul>\n<li>覆盖语言、语音、图片、视频、向量等场景和模态</li>\n<li>兼容 OpenAI、Anthropic 对话协议，无缝接入各类工具</li>\n</ul>\n<h3 id=\"预留实例\">预留实例</h3>\n<ul>\n<li>面向企业核心 AI 推理场景</li>\n<li>算力独占、精度保障、成本优化的一站式专属 AI 服务解决方案</li>\n</ul>\n<h3 id=\"高效能模型推理加速服务\">高效能模型推理加速服务</h3>\n<ul>\n<li>主流开源模型适配与自研模型接入</li>\n<li>极低时延，极致速度、极限性能</li>\n</ul>\n<h3 id=\"私有化部署\">私有化部署</h3>\n<ul>\n<li>企业级私有化方案，涵盖网关、推理全链路</li>\n<li>一站式解决模型部署、性能优化、运维服务痛点</li>\n</ul>\n<h2 id=\"平台优势\">平台优势</h2>\n<ol>\n<li>\n<p><strong>高速推理</strong></p>\n<ul>\n<li>专有推理引擎可将推理延迟最高降低 70%，并将吞吐量提升 3 至 5 倍</li>\n<li>自研高效算子和优化框架，推理加速引擎全球第一梯队</li>\n<li>极致提升吞吐能力，全面支持高吞吐场景的业务需求</li>\n<li>显著优化计算延迟，为低延迟场景提供卓越性能保障</li>\n</ul>\n</li>\n<li>\n<p><strong>高性价比</strong></p>\n<ul>\n<li>动态量化技术可降低 60% 至 80% 的推理计算需求，最大化 Token 生产效率</li>\n<li>端到端极致优化，推理和部署成本显著降低</li>\n<li>提供灵活按需付费模式，减少资源浪费，精准控制预算</li>\n<li>支持国产异构 GPU 部署，基于企业已有投资，节省企业投入</li>\n</ul>\n</li>\n<li>\n<p><strong>高稳定性</strong></p>\n<ul>\n<li>企业级 SLA 保障，经过开发者验证，保证高可靠稳定运行</li>\n<li>提供完善的监控和容错机制，保障服务能力</li>\n<li>提供专业技术支持，满足企业级场景需求，确保服务高可用性</li>\n</ul>\n</li>\n<li>\n<p><strong>高智能</strong></p>\n<ul>\n<li>提供多种先进模型服务，包括大语言模型、音视频等多模态模型</li>\n<li>智能扩展功能，灵活适配业务规模，满足多种服务需求</li>\n<li>智能成本分析，为业务优化提供支持，助力成本管控与效益提升</li>\n</ul>\n</li>\n<li>\n<p><strong>高安全性</strong></p>\n<ul>\n<li>支持 BYOC 部署，全面保护数据隐私与业务安全</li>\n<li>计算隔离/网络隔离/存储隔离，保障数据安全</li>\n<li>符合行业标准与合规要求，全面满足企业级用户的安全需求</li>\n</ul>\n</li>\n<li>\n<p><strong>高扩展性</strong></p>\n<ul>\n<li>动态扩容支持弹性业务模型，无缝适配多种复杂场景</li>\n<li>一键部署自定义模型，轻松应对规模化挑战</li>\n<li>灵活架构设计，满足多样化任务需求，支持混合云部署</li>\n</ul>\n</li>\n</ol>\n<h2 id=\"适用场景\">适用场景</h2>\n<ul>\n<li><strong>Agent &amp; Coding</strong>：一键接入主流 Agent 与 Coding 应用，占领 AI 生产力高地</li>\n<li><strong>AI 应用开发</strong>：快速集成大模型能力，构建智能应用</li>\n<li><strong>内容创作</strong>：利用文本、图像、视频生成模型辅助创作</li>\n<li><strong>企业智能化</strong>：通过私有化部署和预留实例满足企业核心推理需求</li>\n<li><strong>行业解决方案</strong>：覆盖互联网、教育、政务、智算中心、AI 硬件等领域</li>\n</ul>\n<h2 id=\"联系我们\">联系我们</h2>\n<p><a href=\"#\">contact@kerapi.cn</a></p>\n<h2 id=\"更多\">更多</h2>\n<ul>\n<li><a href=\"https://console.kerapi.cn/\">Ker 平台</a></li>\n<li><a href=\"#\">Ker 官网</a></li>\n<li><a href=\"#\">预留实例</a></li>\n<li><a href=\"#\">企业级 MaaS 平台（私有化）</a></li>\n<li><a href=\"#\">私有化大模型服务网关</a></li>\n<li><a href=\"#\">AI 算力运营服务</a></li>\n</ul>"}, "quickstart": {"title": "快速上手", "lead": "新用户快速入门指南，从注册登录到获取 API Key 并完成首次模型调用的完整流程。", "html": "<h2 id=\"1-登录平台\">1. 登录平台</h2>\n<p>访问 <a href=\"#\">Ker 官网</a>，点击右上角<a href=\"https://console.kerapi.cn/\">“登录”</a>按钮，按照提示填写基本信息完成登录。\n（目前支持短信登录、邮箱登录）</p>\n<h2 id=\"2-查看模型列表和模型详情\">2. 查看模型列表和模型详情</h2>\n<p>通过 <a href=\"https://console.kerapi.cn/models\">模型广场</a> 查看当前可用的模型详情、模型价格、速率上限等信息，也可以通过模型详情页的”在线体验”进入模型体验中心。</p>\n<h2 id=\"3-在-playground-体验-genai-能力\">3. 在 playground 体验 GenAI 能力</h2>\n<p>进入<a href=\"https://console.kerapi.cn/\">“体验中心( playground )”</a>页面，左侧栏可选择语言模型、文生图模型和图生图模型，选择相应模型即可开始实时体验。输入相关参数及 prompt ，点击“运行”按钮，即可看到模型生成的结果。</p>\n<h2 id=\"4-使用-ker-api-调用-genai-能力\">4. 使用 Ker API 调用 GenAI 能力</h2>\n<h3 id=\"41-创建-api-key\">4.1 创建 API Key</h3>\n<p>进入 <a href=\"https://console.kerapi.cn/account/ak\">API 密钥</a>页面，点击”新建 API 密钥”，创建您的 API Key。</p>\n<h3 id=\"42-通过-rest-接口进行服务调用\">4.2 通过 REST 接口进行服务调用</h3>\n<p>您可以直接在平台的 <a href=\"#/api-chat\">“文档链接”</a> 中使用 API Key 进行在线调用，此处可以生成对应语言的代码。</p>\n<h3 id=\"43-通过-openai-接口调用\">4.3 通过 OpenAI 接口调用</h3>\n<p>当前平台的大语言模型支持通过 OpenAI 库进行调用。请确保已安装 Python 3.7.1 或更高版本并配置好虚拟环境，然后在终端/命令行中运行以下命令安装 OpenAI Python 库：</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">pip install --upgrade openai</pre></div>\n<p>安装完成后，可直接通过 OpenAI 的相关接口进行调用，目前平台支持 OpenAI 相关的大多数参数。</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">from openai import OpenAI\n\nclient = OpenAI(api_key=\"YOUR_API_KEY_FROM_CLOUD_KER_CN\", \n                base_url=\"https://api.kerapi.cn/v1\")\nresponse = client.chat.completions.create(\n    model='Pro/deepseek-ai/DeepSeek-R1',\n    messages=[\n        {\"role\": \"user\", \n        \"content\": \"推理模型会给市场带来哪些新的机会\"}\n    ],\n    stream=True\n)\n\nfor chunk in response:\n    if not chunk.choices:\n        continue\n    if chunk.choices[0].delta.content:\n        print(chunk.choices[0].delta.content, end=\"\", flush=True)\n    reasoning = getattr(chunk.choices[0].delta, 'reasoning_content', None)\n    if reasoning:\n        print(reasoning, end=\"\", flush=True)</pre></div>"}, "text-generation": {"title": "开始使用", "lead": "文本生成是 Ker 的核心能力，支持多种大语言模型的对话、创作和知识问答。", "html": "<p>语言模型（LLM）使用说明手册</p>\n<h2 id=\"1-模型核心能力\">1. 模型核心能力</h2>\n<h3 id=\"11-基础功能\">1.1 基础功能</h3>\n<p>文本生成：根据上下文生成连贯的自然语言文本，支持多种文体和风格。</p>\n<p>语义理解：深入解析用户意图，支持多轮对话管理，确保对话的连贯性和准确性。</p>\n<p>知识问答：覆盖广泛的知识领域，包括科学、技术、文化、历史等，提供准确的知识解答。</p>\n<p>代码辅助：支持多种主流编程语言（如Python、Java、C++等）的代码生成、解释和调试。</p>\n<h3 id=\"12-进阶能力\">1.2 进阶能力</h3>\n<p>长文本处理：支持4k至64k tokens的上下文窗口，适用于长篇文档生成和复杂对话场景。</p>\n<p>指令跟随：精确理解复杂任务指令，如“用Markdown表格对比A/B方案”。</p>\n<p>风格控制：通过系统提示词调整输出风格，支持学术、口语、诗歌等多种风格。</p>\n<p>多模态支持：除了文本生成，还支持图像描述、语音转文字等多模态任务。</p>\n<h2 id=\"2-接口调用规范\">2. 接口调用规范</h2>\n<h3 id=\"21-基础请求结构\">2.1 基础请求结构</h3>\n<p>您可以通过 OpenAI SDK进行端到端接口请求</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">    from openai import OpenAI  \n    client = OpenAI(api_key=\"YOUR_KEY\", base_url=\"https://api.kerapi.cn/v1\")  \n\n    response = client.chat.completions.create(  \n        model=\"deepseek-ai/DeepSeek-V3.2\",  \n        messages=[  \n            {\"role\": \"system\", \"content\": \"You are a helpful assistant.\"},  \n            {\"role\": \"user\", \"content\": \"Write a haiku about recursion in programming.\"}  \n        ],  \n        temperature=0.7,  \n        max_tokens=1024,\n        stream=True\n    )  \n    # 逐步接收并处理响应\n    for chunk in response:\n        if not chunk.choices:\n            continue\n        if chunk.choices[0].delta.content:\n            print(chunk.choices[0].delta.content, end=\"\", flush=True)\n        if chunk.choices[0].delta.reasoning_content:\n            print(chunk.choices[0].delta.reasoning_content, end=\"\", flush=True)</pre></div><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">from openai import OpenAI\n\nclient = OpenAI(api_key=\"YOUR_KEY\", base_url=\"https://api.kerapi.cn/v1\")\n\nresponse = client.chat.completions.create(\n    model=\"Pro/moonshotai/Kimi-K2.6\",\n    messages=[\n        {\n            \"role\": \"user\",\n             \"content\": [\n                    {\n                        \"type\": \"image_url\",\n                        \"image_url\": {\n                            \"url\": \"https://example.png\",\n                        },\n                    },\n                     {\n                         \"type\": \"text\",\n                         \"text\": \"What's in this image?\"\n                     }\n                ],\n        }\n    ],\n    temperature=0.7,\n    max_tokens=1024,\n    stream=True\n)\n# 逐步接收并处理响应\nfor chunk in response:\n    if not chunk.choices:\n        continue\n    if chunk.choices[0].delta.content:\n        print(chunk.choices[0].delta.content, end=\"\", flush=True)\n    if chunk.choices[0].delta.reasoning_content:\n        print(chunk.choices[0].delta.reasoning_content, end=\"\", flush=True)</pre></div><div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">import json  \nfrom openai import OpenAI\n\nclient = OpenAI(\n    api_key=\"您的 APIKEY\", # 从https://console.kerapi.cn/account/ak获取\n    base_url=\"https://api.kerapi.cn/v1\"\n)\n\nresponse = client.chat.completions.create(\n        model=\"Pro/zai-org/GLM-5.1\",\n        messages=[\n            {\"role\": \"system\", \"content\": \"You are a helpful assistant designed to output JSON.\"},\n            {\"role\": \"user\", \"content\": \"? 2020 年世界奥运会乒乓球男子和女子单打冠军分别是谁? \"\n             \"Please respond in the format {\\\"男子冠军\\\": ..., \\\"女子冠军\\\": ...}\"}\n        ],\n        response_format={\"type\": \"json_object\"}\n    )\n\nprint(response.choices[0].message.content)</pre></div>\n<h3 id=\"22-消息体结构说明\">2.2 消息体结构说明</h3>\n<table><thead><tr><th>消息类型</th><th>功能描述</th><th>示例内容</th></tr></thead><tbody><tr><td>system</td><td>模型指令，设定AI角色，描述模型应一般如何行为和响应</td><td>例如：&quot;你是有10年经验的儿科医生&quot;</td></tr><tr><td>user</td><td>用户输入，将最终用户的消息传递给模型</td><td>例如：&quot;幼儿持续低烧应如何处理？&quot;</td></tr><tr><td>assistant</td><td>模型生成的历史回复，为模型提供示例，说明它应该如何回应当前请求</td><td>例如：&quot;建议先测量体温...&quot;</td></tr></tbody></table>\n<p>你想让模型遵循分层指令时，消息角色可以帮助你获得更好的输出。但它们并不是确定性的，所以使用的最佳方式是尝试不同的方法，看看哪种方法能给你带来好的结果。</p>\n<h2 id=\"3-模型系列选型指南\">3. 模型系列选型指南</h2>\n<p>可以进入<a href=\"https://console.kerapi.cn/models\">模型广场</a>，根据左侧的筛选功能，筛选支持不同功能的语言模型，根据模型的介绍，了解模型具体的价格、模型参数大小、模型上下文支持的最大长度及模型价格等内容。</p>\n<p>支持在<a href=\"https://console.kerapi.cn/playground/chat\">playground</a>进行体验（playground只进行模型体验，暂时没有历史记录功能，如果您想要保存历史的回话记录内容，请自己保存会话内容），想要了解更多使用方式，可以参考<a href=\"#/api-chat\">API文档</a></p>\n<img src=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/doc-resources/images/guides/capabilities/image.webp\">\n<h2 id=\"4-核心参数详解\">4. 核心参数详解</h2>\n<h3 id=\"41-创造性控制\">4.1 创造性控制</h3>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\"># 温度参数（0.0~2.0）   \ntemperature=0.5  # 平衡创造性与可靠性  \n\n# 核采样（top_p）   \ntop_p=0.9  # 仅考虑概率累积90%的词集</pre></div>\n<h3 id=\"42-输出限制\">4.2 输出限制</h3>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">max_tokens=1000  # 单次请求最大生成长度  \nstop=[\"\\n##\", \"&lt;|end|&gt;\"]  # 终止序列，在返回中遇到数组中对应的字符串，就会停止输出 \nfrequency_penalty=0.5  # 抑制重复用词（-2.0~2.0）  \nstream=true # 控制输出是否是流式输出，对于一些输出内容比较多的模型，建议设置为流式，防止输出过长，导致输出超时</pre></div>\n<h3 id=\"43-语言模型场景问题汇总\">4.3 语言模型场景问题汇总</h3>\n<p><strong>1. 模型输出乱码</strong></p>\n<p>目前看到部分模型在不设置参数的情况下，容易出现乱码，遇到上述情况，可以尝试设置<code>temperature</code>，<code>top_k</code>，<code>top_p</code>，<code>frequency_penalty</code>这些参数。</p>\n<p>对应的 payload 修改为如下形式，不同语言酌情调整</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">    payload = {\n        \"model\": \"Qwen/Qwen2.5-Math-72B-Instruct\",\n        \"messages\": [\n            {\n                \"role\": \"user\",\n                \"content\": \"1+1=?\",\n            }\n        ],\n        \"max_tokens\": 200,  # 按需添加\n        \"temperature\": 0.7, # 按需添加\n        \"top_k\": 50,        # 按需添加\n        \"top_p\": 0.7,       # 按需添加\n        \"frequency_penalty\": 0 # 按需添加\n    }</pre></div>\n<p><strong>2. 关于<code>max_tokens</code>说明</strong></p>\n<p>max_tokens 与<code>上下文长度</code>相等，由于部分模型推理服务尚在更新中，请不要在请求时将 max_tokens 设置为最大值（上下文长度），建议留出 10k 左右作为输入内容的空间。</p>\n<p><strong>3. 关于<code>context_length</code>说明</strong></p>\n<p>不同的LLM模型，<code>context_length</code>是有差别的，具体可以在<a href=\"https://console.kerapi.cn/models\">模型广场</a>上搜索对应的模型，\n查看模型具体信息。</p>\n<p><strong>4. 模型输出截断问题</strong></p>\n<p>可以从以下几方面进行问题的排查：</p>\n<ul>\n<li>通过API请求时候，输出截断问题排查：<!-- -->\n<ul>\n<li>max_tokens设置：max_token设置到合适值，输出大于max_token的情况下，会被截断。</li>\n<li>设置流式输出请求：非流式请求时候，输出内容比较长的情况下，容易出现504超时。</li>\n<li>设置客户端超时时间：把客户端超时时间设置大一些，防止未输出完成，达到客户端超时时间被截断。</li>\n</ul>\n</li>\n<li>通过第三方客户端请求，输出截断问题排查：<!-- -->\n<ul>\n<li>Cherry Studio 默认的 max_tokens 是 4096，用户可以通过设置，打开“开启消息长度限制”的开关，将max_token设置到合适值</li>\n</ul>\n</li>\n</ul>\n<img src=\"https://sf-maas-uat-prod.oss-cn-shanghai.aliyuncs.com/doc-resources/images/faqs/mic/image_5.webp\">\n<p><strong>5. 错误码处理</strong></p>\n<table><thead><tr><th>错误码</th><th>常见原因</th><th>解决方案</th></tr></thead><tbody><tr><td>400</td><td>参数格式错误</td><td>检查temperature等请求参数的取值范围</td></tr><tr><td>401</td><td>API Key 没有正确设置</td><td>检查API Key</td></tr><tr><td>403</td><td>权限不够</td><td>最常见的原因是该模型需要实名认证，其他情况参考报错信息</td></tr><tr><td>429</td><td>请求频率超限</td><td>实施指数退避重试机制</td></tr><tr><td>503/504</td><td>模型过载</td><td>切换备用模型节点</td></tr></tbody></table>\n<p><strong>6. x-siliconcloud-trace-id</strong></p>\n<p>响应头（Response Headers）</p>\n<table><thead><tr><th>参数名</th><th>类型</th><th>示例值</th><th>描述</th></tr></thead><tbody><tr><td>x-siliconcloud-trace-id</td><td>string</td><td>ti_xxx</td><td>用于追踪请求的唯一标识符，便于日志查询和问题排查。</td></tr></tbody></table>\n<p><strong>说明</strong></p>\n<ul>\n<li>x-siliconcloud-trace-id 是一个全局唯一的字符串，通常以 UUID 格式生成。</li>\n<li>客户端可以在调试或排查问题时，将该 x-siliconcloud-trace-id 提供给后端开发人员，以便快速定位请求链路中的日志信息。</li>\n<li>此字段由服务端自动生成并返回，客户端无需主动设置</li>\n</ul>\n<h2 id=\"5-计费与配额管理\">5. 计费与配额管理</h2>\n<h3 id=\"51-计费公式\">5.1 计费公式</h3>\n<p><code>总费用 = (输入tokens × 输入单价) + (输出tokens × 输出单价) </code></p>\n<h3 id=\"52-支持模型列表及单价\">5.2 支持模型列表及单价</h3>\n<p>支持的模型及具体价格可以进入<a href=\"https://console.kerapi.cn/me/models\">模型广场</a>下的模型详情页查看。</p>\n<h2 id=\"6-应用案例\">6. 应用案例</h2>\n<h3 id=\"61-技术文档生成\">6.1 技术文档生成</h3>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">from openai import OpenAI\nclient = OpenAI(api_key=\"YOUR_KEY\", base_url=\"https://api.kerapi.cn/v1\")\nresponse = client.chat.completions.create(  \n    model=\"Qwen/Qwen3.6-27B\",  \n    messages=[{  \n        \"role\": \"user\",  \n        \"content\": \"编写Python异步爬虫教程，包含代码示例和注意事项\"  \n    }],  \n    temperature=0.7,  \n    max_tokens=4096  \n)</pre></div>\n<h3 id=\"62-数据分析报告\">6.2 数据分析报告</h3>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">from openai import OpenAI\nclient = OpenAI(api_key=\"YOUR_KEY\", base_url=\"https://api.kerapi.cn/v1\")\nresponse = client.chat.completions.create(  \n    model=\"Qwen/QVQ-72B-Preview\",  \n    messages=[    \n        {\"role\": \"system\", \"content\": \"你是数据分析专家，用Markdown输出结果\"},  \n        {\"role\": \"user\", \"content\": \"分析2023年新能源汽车销售数据趋势\"}  \n    ],  \n    temperature=0.7,  \n    max_tokens=4096  \n)</pre></div>\n 模型能力持续更新中，建议定期访问<a href=\"https://console.kerapi.cn/models\">模型广场</a>获取最新信息。"}, "stream-mode": {"title": "流式输出", "lead": "流式输出模式让模型响应实时返回，适用于聊天、长文本生成等需要即时反馈的场景。", "html": "<h2 id=\"1-在-python-中使用流式输出\">1. 在 python 中使用流式输出</h2>\n<h3 id=\"11-基于-openai-库的流式输出\">1.1 基于 OpenAI 库的流式输出</h3>\n<p>在一般场景中，推荐您使用 OpenAI 的库进行流式输出。</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">from openai import OpenAI\n\nclient = OpenAI(\n    base_url='https://api.kerapi.cn/v1',\n    api_key='your-api-key'\n)\n\n# 发送带有流式输出的请求\nresponse = client.chat.completions.create(\n    model=\"Pro/zai-org/GLM-5.1\",\n    messages=[\n        {\"role\": \"user\", \"content\": \"Ker公测上线，每用户送3亿token 解锁开源大模型创新能力。对于整个大模型应用领域带来哪些改变？\"}\n    ],\n    stream=True  # 启用流式输出\n)\n\n# 逐步接收并处理响应\nfor chunk in response:\n    if not chunk.choices:\n        continue\n\n    delta = chunk.choices[0].delta\n\n    # 使用 getattr 安全获取属性，如果属性不存在则返回 None，避免报错\n    reasoning_content = getattr(delta, 'reasoning_content', None)\n    content = getattr(delta, 'content', None)\n\n    # 打印思考过程（如果存在）\n    if reasoning_content:\n        # \\033[90m 和 \\033[0m 是终端的灰色颜色代码，让思考过程呈现灰色，更易区分\n        print(f\"\\033[90m{reasoning_content}\\033[0m\", end=\"\", flush=True)\n\n    # 打印正式回复（如果存在）\n    if content:\n        print(content, end=\"\", flush=True)\n\n# 最后打印一个换行符，让命令行提示符在新的一行显示\nprint()</pre></div>\n<h3 id=\"12-基于-requests-库的流式输出\">1.2 基于 requests 库的流式输出</h3>\n<p>如果您有非 openai 的场景，如您需要基于 request 库使用 Ker API，请您注意：\n除了 payload 中的 stream 需要设置外，request 请求的参数也需要设置stream = True, 才能正常按照 stream 模式进行返回。</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">from openai import OpenAI\nimport requests\nimport json\n   \nurl = \"https://api.kerapi.cn/v1/chat/completions\"\n   \npayload = {\n        \"model\": \"Pro/zai-org/GLM-5.1\", # 替换成你的模型\n        \"messages\": [\n            {\n                \"role\": \"user\",\n                \"content\": \"Ker公测上线，每用户送3亿token 解锁开源大模型创新能力。对于整个大模型应用领域带来哪些改变？\"\n            }\n        ],\n        \"stream\": True # 此处需要设置为stream模式\n}\n\nheaders = {\n        \"accept\": \"application/json\",\n        \"content-type\": \"application/json\",\n        \"authorization\": \"Bearer your-api-key\"\n    }\n   \nresponse = requests.post(url, json=payload, headers=headers, stream=True) # 此处request需要指定stream模式\n# 打印流式返回信息\nif response.status_code == 200:\n    full_content = \"\"\n    full_reasoning_content = \"\"\n\n    for chunk in response.iter_lines():\n        if chunk:\n            chunk_str = chunk.decode('utf-8').replace('data: ', '')\n            if chunk_str != \"[DONE]\":\n                chunk_data = json.loads(chunk_str)\n                delta = chunk_data['choices'][0].get('delta', {})\n                content = delta.get('content', '')\n                reasoning_content = delta.get('reasoning_content', '')\n                if content:\n                    print(content, end=\"\", flush=True)\n                    full_content += content\n                if reasoning_content:\n                    print(reasoning_content, end=\"\", flush=True)\n                    full_reasoning_content += reasoning_content\nelse:\n    print(f\"请求失败，状态码：{response.status_code}\")</pre></div>\n<h2 id=\"2-curl-中使用流式输出\">2. curl 中使用流式输出</h2>\n<p>curl 命令的处理机制默认情况下，curl 会缓冲输出流，所以即使服务器分块（chunk）发送数据，也需要等缓冲区填满或连接关闭后才看到内容。传入 <code>-N</code>（或 <code>--no-buffer</code>）选项，可以禁止此缓冲，让数据块立即打印到终端，从而实现流式输出。</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">curl -N -s \\\n  --request POST \\\n  --url https://api.kerapi.cn/v1/chat/completions \\\n  --header 'Authorization: Bearer token' \\\n  --header 'Content-Type: application/json' \\\n  --data '{\n    \"model\": \"Qwen/Qwen2.5-72B-Instruct\",\n    \"messages\": [\n      {\"role\":\"user\",\"content\":\"有诺贝尔数学奖吗？\"}\n    ],\n    \"stream\": true\n}'</pre></div>"}, "reasoning": {"title": "推理模型", "lead": "推理模型通过思维链（Chain-of-Thought）解决数学、代码和复杂逻辑问题，支持 DeepSeek-R1 等模型。", "html": "<h2 id=\"1-概述\">1. 概述</h2>\n<p>推理模型是基于深度学习的AI系统，通过逻辑推演、知识关联和上下文分析解决复杂任务，典型应用包括数学解题、代码生成、逻辑判断和多步推理场景。这类模型通常具备以下特性：</p>\n<ul>\n<li>结构化思维：采用思维链（Chain-of-Thought）等技术分解复杂问题</li>\n<li>知识融合：整合领域知识库与常识推理能力</li>\n<li>自修正机制：通过验证反馈回路提升结果可靠性</li>\n<li>多模态处理：部分先进模型支持文本/代码/公式混合输入</li>\n</ul>\n<h2 id=\"2-平台支持推理模型\">2. 平台支持推理模型</h2>\n<p>平台支持的推理模型，可以通过<a href=\"https://console.kerapi.cn/me/models?tags=Reasoning\">模型广场</a>查询。</p>\n<h2 id=\"3-使用建议\">3. 使用建议</h2>\n<h3 id=\"31-api-参数\">3.1 API 参数</h3>\n<h4 id=\"311-请求参数\">3.1.1 请求参数</h4>\n<ul>\n<li>\n<p><strong>请求参数</strong>：</p>\n<ul>\n<li>\n<p><strong>最大思维链长度（thinking_budget）</strong>：模型用于内部推理的 token 数，合理设置 thinking_budget ，可以控制回答的思维链长度。</p>\n</li>\n<li>\n<p><strong>最大回复长度（max_tokens</strong>）：用于限制模型最终输出给用户的回复 token 数，控制回复的最大长度。</p>\n</li>\n</ul>\n</li>\n</ul>\n<p><strong>最大上下文长度（context_length）</strong>：非请求参数，不需要用户自己设置。不同模型支持的最大上下文长度可通过<a href=\"https://console.kerapi.cn/models\">模型广场</a>页面进行查看。</p>\n<p>推理模型思维链输出行为将遵循以下规则：</p>\n<ul>\n<li>若“思考阶段”生成的 <code>token</code> 数达到 <code>thinking_budget</code>，因 <code>Qwen3</code> 系列推理模型原生支持该参数模型将强制停止思维链推理，其他推理模型有可能会继续输出思考内容。</li>\n<li>若最大回复长度超过 <code>max_tokens</code>或上下文长度超过<code>context_length</code> 限制，回复内容将进行截断，响应中的 <code>finish_reason</code> 字段将标记为 <code>length</code>，表示因长度限制终止输出。</li>\n</ul>\n<h4 id=\"312-返回参数\">3.1.2 返回参数</h4>\n<ul>\n<li><strong>返回参数</strong>:<!-- -->\n<ul>\n<li>reasoning_content：思维链内容，与 content 同级。</li>\n<li>content：最终回答内容</li>\n</ul>\n</li>\n</ul>\n<h3 id=\"32-deepseek-r1-使用建议\">3.2 DeepSeek-R1 使用建议</h3>\n<ul>\n<li>将 temperature 设置在 0.5-0.7 范围内（推荐值为 0.6），以防止无限循环或不连贯的输出。</li>\n<li>将 top_p 的值设置在 0.95。</li>\n<li>避免添加系统提示,所有指令应包含在用户提示中。</li>\n<li>对于数学问题，建议在提示中包含一个指令，例如：“请逐步推理，并将最终答案写在 \\boxed<!-- --> 中。”</li>\n<li>在评估模型性能时，建议进行多次测试并平均结果。</li>\n</ul>\n<!-- -->\n<h2 id=\"4-openai-请求示例\">4. OpenAI 请求示例</h2>\n<h3 id=\"41-流式输出请求\">4.1 流式输出请求</h3>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">from openai import OpenAI\n\nurl = 'https://api.kerapi.cn/v1/'\napi_key = 'your api_key'\n\nclient = OpenAI(\n    base_url=url,\n    api_key=api_key\n)\n\n# 发送带有流式输出的请求\ncontent = \"\"\nreasoning_content=\"\"\nmessages = [\n    {\"role\": \"user\", \"content\": \"奥运会的传奇名将有哪些？\"}\n]\nresponse = client.chat.completions.create(\n    model=\"Pro/deepseek-ai/DeepSeek-V3.2\",\n    messages=messages,\n    stream=True,  # 启用流式输出\n    max_tokens=4096,\n    extra_body={\n        \"enable_thinking\": true,\n        \"thinking_budget\": 1024\n    }\n)\n# 逐步接收并处理响应\nfor chunk in response:\n    if chunk.choices[0].delta.content:\n        content += chunk.choices[0].delta.content\n    if chunk.choices[0].delta.reasoning_content:\n        reasoning_content += chunk.choices[0].delta.reasoning_content\n\n# Round 2\nmessages.append({\"role\": \"assistant\", \"content\": content})\nmessages.append({'role': 'user', 'content': \"继续\"})\nresponse = client.chat.completions.create(\n    model=\"Pro/deepseek-ai/DeepSeek-V3.2\",\n    messages=messages,\n    stream=True\n)</pre></div>\n<h3 id=\"42-非流式输出请求\">4.2 非流式输出请求</h3>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">from openai import OpenAI\nurl = 'https://api.kerapi.cn/v1/'\napi_key = 'your api_key'\n\nclient = OpenAI(\n    base_url=url,\n    api_key=api_key\n)\n\n# 发送非流式输出的请求\nmessages = [\n    {\"role\": \"user\", \"content\": \"奥运会的传奇名将有哪些？\"}\n]\nresponse = client.chat.completions.create(\n    model=\"Pro/deepseek-ai/DeepSeek-V3.2\",\n    messages=messages,\n    stream=False,\n    max_tokens=4096,\n    extra_body={\n        \"enable_thinking\": true,\n        \"thinking_budget\": 1024\n    }\n)\ncontent = response.choices[0].message.content\nreasoning_content = response.choices[0].message.reasoning_content\n\n# Round 2\nmessages.append({\"role\": \"assistant\", \"content\": content})\nmessages.append({'role': 'user', 'content': \"继续\"})\nresponse = client.chat.completions.create(\n    model=\"Pro/deepseek-ai/DeepSeek-V3.2\",\n    messages=messages,\n    stream=False\n)</pre></div>\n<h2 id=\"5-注意事项\">5. 注意事项</h2>\n<ul>\n<li>API 密钥：请确保使用正确的 API 密钥进行身份验证。</li>\n<li>流式输出：流式输出适用于需要逐步接收响应的场景，而非流式输出则适用于一次性获取完整响应的场景。</li>\n</ul>\n<!-- -->\n<h2 id=\"6-常见问题\">6. 常见问题</h2>\n<ul>\n<li>\n<p>如何获取 API 密钥？</p>\n<p>请访问 <a href=\"https://console.kerapi.cn/\">Ker</a> 注册并获取 API 密钥。</p>\n</li>\n<li>\n<p>如何处理超长文本？</p>\n<p>可以通过调整 max_tokens 参数来控制输出的长度。</p>\n</li>\n</ul>"}, "function-calling": {"title": "Function Calling", "lead": "Function Calling 功能指南，让模型调用外部工具扩展能力，解决知识时效性和幻觉问题。", "html": "<h2 id=\"1-使用场景\">1. 使用场景</h2>\n<p>Function Calling 功能让模型能够调用外部工具，来增强自身能力。\n该能力可以通过外部工具，通过大模型作为大脑调用外部工具（如搜索外部知识、查阅行程、或者某些特定领域工具），有效解决模型的幻觉、知识时效性等问题。</p>\n<h2 id=\"2-使用方式\">2. 使用方式</h2>\n<h3 id=\"21-通过-rest-api-添加-tools-请求参数\">2.1 通过 REST API 添加 tools 请求参数</h3>\n<p>在请求体中添加</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">\"tools\": [\n    {\n        'type': 'function',\n        'function': {\n            'name': '对应到实际执行的函数名称',\n            'description': '此处是函数相关描述',\n            'parameters': {\n                '_comments': '此处是函数参数相关描述'\n            },\n        }\n    },\n    {\n        '_comments': '其他函数相关说明'\n    }\n]</pre></div>\n<p>比如完整的 payload 信息：</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">payload = {\n    \"model\": \"Pro/zai-org/GLM-5.1\",\n    \"messages\": [\n        {\n            \"role\": \"user\",\n            \"content\": \"中国大模型行业2025年将会迎来哪些机遇和挑战\"\n        }\n    ],\n    \"tools\": [\n    {\n        'type': 'function',\n        'function': {\n            'name': '对应到实际执行的函数名称',\n            'description': '此处是函数相关描述',\n            'parameters': {\n                '_comments': '此处是函数参数相关描述'\n            },\n        }\n    },\n    {\n        '_comments': '其他函数相关说明'\n    }\n    ]\n    '_comments': '其他函数列表'\n}</pre></div>\n<h3 id=\"22-通过-openai-库请求\">2.2 通过 OpenAI 库请求</h3>\n<p>该功能和 OpenAI 兼容，在使用 OpenAI 的库时，对应的请求参数中添加<code>tools=[对应的 tools]</code>\n比如：</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">response = client.chat.completions.create(\n    model=\"Pro/zai-org/GLM-5.1\",\n    messages = messages,\n    tools=[\n        {\n            'type': 'function',\n            'function': {\n                'name': '对应到实际执行的函数名称',\n                'description': '此处是函数相关描述',\n                'parameters': {\n                    // 此处是函数参数相关描述\n                },\n            }\n        },\n        {\n            // 其他函数相关说明\n        }\n    ]\n    // chat.completions 其他参数\n)</pre></div>\n<h2 id=\"3-支持模型列表\">3. 支持模型列表</h2>\n<p>可以通过<a href=\"https://console.kerapi.cn/models?tags=Tools\">模型广场</a>查看当前支持tools的模型。</p>\n<h2 id=\"4-使用示例\">4. 使用示例</h2>\n<h3 id=\"41-示例-1通过function-calling-来扩展大语言模型的数值计算能力\">4.1. 示例 1：通过function calling 来扩展大语言模型的数值计算能力</h3>\n<p>本代码输入 4 个函数，分别是数值的加、减、比较大小、字符串中重复字母计数四个函数\n来演示通过function calling来解决大语言模型在tokens 预测不擅长的领域的执行问题。</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">\nfrom openai import OpenAI\n\nclient = OpenAI(\n    api_key=\"您的 APIKEY\", # 从https://console.kerapi.cn/account/ak获取\n    base_url=\"https://api.kerapi.cn/v1\"\n)\n\ndef add(a: float, b: float):\n    return a + b\n\ndef mul(a: float, b: float):\n    return a * b\n\ndef compare(a: float, b: float):\n    if a &gt; b:\n        return f'{a} is greater than {b}'\n    elif a &lt; b:\n        return f'{b} is greater than {a}'\n    else:\n        return f'{a} is equal to {b}'\n\ndef count_letter_in_string(a: str, b: str):\n    string = a.lower()\n    letter = b.lower()\n    \n    count = string.count(letter)\n    return(f\"The letter '{letter}' appears {count} times in the string.\")\n\ntools = [\n{\n    'type': 'function',\n    'function': {\n        'name': 'add',\n        'description': 'Compute the sum of two numbers',\n        'parameters': {\n            'type': 'object',\n            'properties': {\n                'a': {\n                    'type': 'int',\n                    'description': 'A number',\n                },\n                'b': {\n                    'type': 'int',\n                    'description': 'A number',\n                },\n            },\n            'required': ['a', 'b'],\n        },\n    }\n}, \n{\n    'type': 'function',\n    'function': {\n        'name': 'mul',\n        'description': 'Calculate the product of two numbers',\n        'parameters': {\n            'type': 'object',\n            'properties': {\n                'a': {\n                    'type': 'int',\n                    'description': 'A number',\n                },\n                'b': {\n                    'type': 'int',\n                    'description': 'A number',\n                },\n            },\n            'required': ['a', 'b'],\n        },\n    }\n},\n{\n    'type': 'function',\n    'function': {\n        'name': 'count_letter_in_string',\n        'description': 'Count letter number in a string',\n        'parameters': {\n            'type': 'object',\n            'properties': {\n                'a': {\n                    'type': 'str',\n                    'description': 'source string',\n                },\n                'b': {\n                    'type': 'str',\n                    'description': 'letter',\n                },\n            },\n            'required': ['a', 'b'],\n        },\n    }\n},\n{\n    'type': 'function',\n    'function': {\n        'name': 'compare',\n        'description': 'Compare two number, which one is bigger',\n        'parameters': {\n            'type': 'object',\n            'properties': {\n                'a': {\n                    'type': 'float',\n                    'description': 'A number',\n                },\n                'b': {\n                    'type': 'float',\n                    'description': 'A number',\n                },\n            },\n            'required': ['a', 'b'],\n        },\n    }\n}\n]\n\ndef function_call_playground(prompt):\n    messages = [{'role': 'user', 'content': prompt}]\n    response = client.chat.completions.create(\n        model=\"Pro/zai-org/GLM-5.1\",\n        messages = messages,\n        temperature=0.01,\n        top_p=0.95,\n        stream=False,\n        tools=tools)\n\n    # print(response)\n    func1_name = response.choices[0].message.tool_calls[0].function.name\n    func1_args = response.choices[0].message.tool_calls[0].function.arguments\n    func1_out = eval(f'{func1_name}(**{func1_args})')\n    # print(func1_out)\n\n    messages.append(response.choices[0].message)\n    messages.append({\n        'role': 'tool',\n        'content': f'{func1_out}',\n        'tool_call_id': response.choices[0].message.tool_calls[0].id\n    })\n    # print(messages)\n    response = client.chat.completions.create(\n        model=\"Pro/zai-org/GLM-5.1\",\n        messages=messages,\n        temperature=0.01,\n        top_p=0.95,\n        stream=False,\n        tools=tools)\n    return response.choices[0].message.content\n  \nprompts = [\n    \"用中文回答：strawberry中有多少个r?\", \n    \"用中文回答：9.11和9.9，哪个小?\"\n]\n\nfor prompt in prompts:\n    print(function_call_playground(prompt))</pre></div>\n<p>模型将输出：</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">strawberry中有3个r。\n9.11 比 9.9 小。</pre></div>\n<h3 id=\"42-示例-2通过function-calling-来扩展大语言模型对外部环境的理解\">4.2. 示例 2：通过function calling 来扩展大语言模型对外部环境的理解</h3>\n<p>本代码输入 1 个函数，通过外部 API 来查询外部信息</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">import requests\nfrom openai import OpenAI\n\nclient = OpenAI(\n    api_key=\"您的 APIKEY\", # 从https://console.kerapi.cn/account/ak获取\n    base_url=\"https://api.kerapi.cn/v1\"\n)\n\n# 使用 WeatherAPI 的天气查询函数\ndef get_weather(city: str):\n    # 使用 WeatherAPI 的 API 来获取天气信息\n    api_key = \"您的WeatherAPI APIKEY\"  # 替换为你自己的 WeatherAPI APIKEY\n    base_url = \"http://api.weatherapi.com/v1/current.json\"\n    params = {\n        'key': api_key,\n        'q': city,\n        'aqi': 'no'  # 不需要空气质量数据\n    }\n    \n    # 调用天气 API\n    response = requests.get(base_url, params=params)\n    \n    if response.status_code == 200:\n        data = response.json()\n        weather = data['current']['condition']['text']\n        temperature = data['current']['temp_c']\n        return f\"The weather in {city} is {weather} with a temperature of {temperature}°C.\"\n    else:\n        return f\"Could not retrieve weather information for {city}.\"\n\n# 定义 OpenAI 的 function calling tools\ntools = [\n    {\n        'type': 'function',\n        'function': {\n            'name': 'get_weather',\n            'description': 'Get the current weather for a given city.',\n            'parameters': {\n                'type': 'object',\n                'properties': {\n                    'city': {\n                        'type': 'string',\n                        'description': 'The name of the city to query weather for.',\n                    },\n                },\n                'required': ['city'],\n            },\n        }\n    }\n]\n\n# 发送请求并处理 function calling\ndef function_call_playground(prompt):\n    messages = [{'role': 'user', 'content': prompt}]\n    \n    # 发送请求到 OpenAI API\n    response = client.chat.completions.create(\n        model=\"Pro/zai-org/GLM-5.1\",\n        messages=messages,\n        temperature=0.01,\n        top_p=0.95,\n        stream=False,\n        tools=tools\n    )\n\n    # 处理 API 返回的工具调用请求\n    func1_name = response.choices[0].message.tool_calls[0].function.name\n    func1_args = response.choices[0].message.tool_calls[0].function.arguments\n    func1_out = eval(f'{func1_name}(**{func1_args})')\n\n    # 将结果添加到对话中并返回\n    messages.append(response.choices[0].message)\n    messages.append({\n        'role': 'tool',\n        'content': f'{func1_out}',\n        'tool_call_id': response.choices[0].message.tool_calls[0].id\n    })\n    \n    # 返回模型响应\n    response = client.chat.completions.create(\n        model=\"Pro/zai-org/GLM-5.1\",\n        messages=messages,\n        temperature=0.01,\n        top_p=0.95,\n        stream=False,\n        tools=tools\n    )\n    \n    return response.choices[0].message.content\n\n# 示例使用\nprompt = \"how is the weather today in beijing?\"\nprint(function_call_playground(prompt))</pre></div>\n<p>模型将输出：</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">The weather in Beijing today is sunny with a temperature of 21.4°C.</pre></div>"}, "json-mode": {"title": "JSON 模式", "lead": "JSON Mode 使用指南，让模型输出结构化 JSON 数据，便于程序解析和处理。", "html": "<h2 id=\"1-使用场景\">1. 使用场景</h2>\n<p>目前，Ker的大模型 API 平台 Ker 默认生成<strong>非结构化文本</strong>，但在某些应用场景中，您可能希望模型以<strong>结构化</strong>的形式输出内容，但用提示词的方式直接告诉大模型却无法获得正确的结构化输出。</p>\n<p>作为一种标准化、轻量级的数据交换格式，JSON 模式是支持大模型 API 进行结构化输出的重要功能。当您调用大模型的 API 进行请求时，模型返回的结果以 JSON 格式呈现，易于人类阅读和编写，同时也易于机器解析和生成。</p>\n<p>现在，Ker 平台上除了 VL 模型外，其他主要语言模型均已支持 JSON 模式，能让模型输出 JSON 格式的字符串，以确保模型以预期的结构输出，便于后续对输出内容进行逻辑解析。</p>\n<p>比如，您现在可以通过 Ker API 对以下案例尝试结构化输出：</p>\n<ul>\n<li>从公司相关报道中构建新闻数据库，包括新闻标题、链接等。</li>\n<li>从商品购买评价中提取出情感分析结构，包括情感极性（正面、负面、中性）、情感强度、情感关键词等。</li>\n<li>从商品购买历史中提取出产品列表，包括产品信息、推荐理由、价格、促销信息等。</li>\n</ul>\n<h2 id=\"2-使用方式\">2. 使用方式</h2>\n<p>在请求中添加</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">response_format={\"type\": \"json_object\"}</pre></div>\n<h2 id=\"3-支持模型列表\">3. 支持模型列表</h2>\n<p>目前线上，平台提供的大语言类模型都支持上述参数。</p>\n注意：支持的模型情况可能会发生变化，请查阅本文档了解最新支持的模型列表。\n你的应用必须检测并处理可能导致模型输出不完整JSON对象的边缘案例。\n请合理设置max_tokens，防止JSON字符串被中断。\n<h2 id=\"4-使用示例\">4. 使用示例</h2>\n<p>下面是在 OpenAI 中使用的例子：</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">import json  \nfrom openai import OpenAI\n\nclient = OpenAI(\n    api_key=\"您的 APIKEY\", # 从https://console.kerapi.cn/account/ak获取\n    base_url=\"https://api.kerapi.cn/v1\"\n)\n\nresponse = client.chat.completions.create(\n        model=\"Pro/zai-org/GLM-5.1\",\n        messages=[\n            {\"role\": \"system\", \"content\": \"You are a helpful assistant designed to output JSON.\"},\n            {\"role\": \"user\", \"content\": \"? 2020 年世界奥运会乒乓球男子和女子单打冠军分别是谁? \"\n             \"Please respond in the format {\\\"男子冠军\\\": ..., \\\"女子冠军\\\": ...}\"}\n        ],\n        response_format={\"type\": \"json_object\"}\n    )\n\nprint(response.choices[0].message.content)</pre></div>\n<p>模型将输出：</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\"男子冠军\": \"马龙\", \"女子冠军\": \"陈梦\"}</pre></div>"}, "multimodal-vision": {"title": "多模态输入", "lead": "多模态模型支持同时处理文本、图像、音频和视频输入，实现跨模态理解与融合分析。", "html": "<h2 id=\"1-概述\">1. 概述</h2>\n<p>多模态模型是能够同时处理多种模态信息（文本、图像、音频、视频）的大语言模型。Ker 提供了多个支持不同模态组合的强大模型，能够：</p>\n<ol>\n<li><strong>视觉理解</strong>：理解图片内容、OCR、图像描述</li>\n<li><strong>视频分析</strong>：提取视频帧、理解视频内容、动作识别</li>\n<li><strong>音频处理</strong>：语音识别、音频内容分析</li>\n<li><strong>多模态融合</strong>：同时处理多种媒体类型的综合分析</li>\n</ol>\n<h2 id=\"2-支持模型概览\">2. 支持模型概览</h2>\n<table><thead><tr><th>模型系列</th><th>视觉输入</th><th>音频输入</th><th>视频输入</th><th>主要特点</th></tr></thead><tbody><tr><td><strong>Qwen3-Omni 系列</strong></td><td>✅</td><td>✅</td><td>✅</td><td>全面多模态支持，音视频同时处理</td></tr><tr><td><strong>Qwen3-VL 系列</strong></td><td>✅</td><td>❌</td><td>✅</td><td>视觉+视频理解，无音频支持</td></tr><tr><td><strong>GLM 系列</strong></td><td>✅</td><td>❌</td><td>❌</td><td>仅视觉理解</td></tr><tr><td><strong>Qwen2-VL 系列</strong></td><td>✅</td><td>❌</td><td>❌</td><td>仅视觉理解</td></tr><tr><td><strong>DeepseekVL2 系列</strong></td><td>✅</td><td>❌</td><td>❌</td><td>仅视觉理解</td></tr><tr><td><strong>Step3</strong></td><td>✅</td><td>❌</td><td>❌</td><td>仅视觉理解</td></tr><tr><td><strong>DeepSeek-OCR</strong></td><td>✅</td><td>❌</td><td>❌</td><td>仅视觉理解，支持pdf输入</td></tr></tbody></table>\n<p>通过<a href=\"https://console.kerapi.cn/me/models?tags=VLM\">模型广场</a>查看当前支持的多模态模型列表。\n支持的模型可能发生调整，请以平台实际展示为准。</p>\n<h2 id=\"3-使用方式\">3. 使用方式</h2>\n<p>所有多模态模型都通过 <code>/chat/completions</code> 接口调用，使用标准化的 <code>messages</code> 格式，其中 <code>content</code> 可以包含不同类型的内容部分。</p>\n<h3 id=\"31-基本消息格式\">3.1 基本消息格式</h3>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n    \"role\": \"user\",\n    \"content\": [\n        {\n            \"type\": \"text\" | \"image_url\" | \"audio_url\" | \"video_url\",\n            \"[type]_url\": {\n                // 对应类型的配置\n            }\n        }\n    ]\n}</pre></div>\n<h3 id=\"32-通用参数说明\">3.2 通用参数说明</h3>\n<h4 id=\"图像参数-image_url\">图像参数 (<code>image_url</code>)</h4>\n<ul>\n<li><code>url</code>: 图像 URL 或 base64 编码数据，DeepSeek-OCR 还支持 PDF URL 或 base64 编码数据</li>\n<li><code>detail</code>: 细节级别 (<code>auto</code>, <code>low</code>, <code>high</code>)</li>\n</ul>\n<h4 id=\"视频参数-video_url\">视频参数 (<code>video_url</code>)</h4>\n<ul>\n<li><code>url</code>: 视频 URL 或 base64 编码数据</li>\n<li><code>detail</code>: 细节级别 (<code>auto</code>, <code>low</code>, <code>high</code>)</li>\n<li><code>max_frames</code>: 最大提取帧数</li>\n<li><code>fps</code>: 每秒提取帧数，最终帧数为 <code>min(fps × T, max_frames)</code></li>\n</ul>\n<h4 id=\"音频参数-audio_url\">音频参数 (<code>audio_url</code>)</h4>\n<ul>\n<li><code>url</code>: 音频 URL 或 base64 编码数据</li>\n</ul>\n<h2 id=\"4-使用示例\">4. 使用示例</h2>\n<h3 id=\"41-视觉理解\">4.1 视觉理解</h3>\n<h4 id=\"图像分析\">图像分析</h4>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n    \"role\": \"user\",\n    \"content\": [\n        {\n            \"type\": \"image_url\",\n            \"image_url\": {\n                \"url\": \"https://example.com/image.jpg\",\n                \"detail\": \"high\"\n            }\n        },\n        {\n            \"type\": \"text\",\n            \"text\": \"描述这张图片的内容\"\n        }\n    ]\n}</pre></div>\n<h4 id=\"多图对比\">多图对比</h4>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n    \"role\": \"user\",\n    \"content\": [\n        {\n            \"type\": \"image_url\",\n            \"image_url\": {\"url\": \"https://example.com/image1.jpg\"}\n        },\n        {\n            \"type\": \"image_url\",\n            \"image_url\": {\"url\": \"https://example.com/image2.jpg\"}\n        },\n        {\n            \"type\": \"text\",\n            \"text\": \"比较这两张图片的相同点和不同点\"\n        }\n    ]\n}</pre></div>\n<h4 id=\"pdf-ocr\">PDF OCR</h4>\n<p>DeepSeek-OCR 还支持 PDF URL 或 base64 编码数据。</p>\n<p>DeepSeek-OCR 支持多种场景的提示词：</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">- 文档转Markdown：&lt;image&gt;\\n&lt;|grounding|&gt;Convert the document to markdown.\n- 通用OCR：&lt;image&gt;\\n&lt;|grounding|&gt;OCR this image.\n- 无布局提取：&lt;image&gt;\\nFree OCR.\n- 图表解析：&lt;image&gt;\\nParse the figure.\n- 图像描述：&lt;image&gt;\\nDescribe this image in detail.\n- 文本定位：&lt;image&gt;\\nLocate &lt;|ref|&gt;特定文字&lt;|/ref|&gt; in the image.</pre></div>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n    \"role\": \"user\",\n    \"content\": [\n        {\n            \"type\": \"image_url\",\n            \"image_url\": { \n                \"url\": \"data:application/pdf;base64,\" + base64.b64encode(\n                            open(\"xxx.pdf\", \"rb\").read()).decode(\"utf-8\")\n                            }\n        },\n        {\n            \"type\": \"text\",\n            \"text\": \"&lt;image&gt;\\n&lt;|grounding|&gt;Convert the document to markdown. \"\n        }\n    ]\n}</pre></div>\n<h3 id=\"42-视频理解\">4.2 视频理解</h3>\n<h4 id=\"基础视频分析\">基础视频分析</h4>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n    \"role\": \"user\",\n    \"content\": [\n        {\n            \"type\": \"video_url\",\n            \"video_url\": {\n                \"url\": \"https://example.com/video.mp4\",\n                \"detail\": \"high\",\n                \"max_frames\": 16,\n                \"fps\": 1\n            }\n        },\n        {\n            \"type\": \"text\",\n            \"text\": \"总结这个视频的主要内容\"\n        }\n    ]\n}</pre></div>\n<h4 id=\"多模态分析视频--图片\">多模态分析（视频 + 图片）</h4>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n    \"role\": \"user\",\n    \"content\": [\n        {\n            \"type\": \"video_url\",\n            \"video_url\": {\n                \"url\": \"https://example.com/video.mp4\",\n                \"detail\": \"high\",\n                \"max_frames\": 16,\n                \"fps\": 1\n            }\n        },\n        {\n            \"type\": \"image_url\",\n            \"image_url\": {\"url\": \"https://example.com/thumbnail.jpg\"}\n        },\n        {\n            \"type\": \"text\",\n            \"text\": \"基于视频和缩略图，分析这个视频的主题和受众群体\"\n        }\n    ]\n}</pre></div>\n<h3 id=\"43-音频理解\">4.3 音频理解</h3>\n<h4 id=\"音频内容分析\">音频内容分析</h4>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n    \"role\": \"user\",\n    \"content\": [\n        {\n            \"type\": \"audio_url\",\n            \"audio_url\": {\n                \"url\": \"https://example.com/audio.mp3\"\n            }\n        },\n        {\n            \"type\": \"text\",\n            \"text\": \"转录这个音频的内容\"\n        }\n    ]\n}</pre></div>\n<h3 id=\"44-全模态分析\">4.4 全模态分析</h3>\n<h4 id=\"音视频综合分析\">音视频综合分析</h4>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{\n    \"role\": \"user\",\n    \"content\": [\n        {\n            \"type\": \"video_url\",\n            \"video_url\": {\n                \"url\": \"https://example.com/video.mp4\",\n                \"detail\": \"high\",\n                \"max_frames\": 16,\n                \"fps\": 1\n            }\n        },\n        {\n            \"type\": \"audio_url\",\n            \"audio_url\": {\n                \"url\": \"https://example.com/audio.mp3\"\n            }\n        },\n        {\n            \"type\": \"text\",\n            \"text\": \"对比分析视频画面和音频内容，找出它们之间的联系\"\n        }\n    ]\n}</pre></div>\n<h2 id=\"5-python-sdk-使用示例\">5. Python SDK 使用示例</h2>\n<h3 id=\"51-视觉识别\">5.1 视觉识别</h3>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">from openai import OpenAI\n\nclient = OpenAI(\n    api_key=\"your-api-key\",\n    base_url=\"https://api.kerapi.cn/v1\"\n)\n\nresponse = client.chat.completions.create(\n    model=\"Qwen/Qwen2.5-VL-72B-Instruct\",\n    messages=[\n        {\n            \"role\": \"user\",\n            \"content\": [\n                {\n                    \"type\": \"image_url\",\n                    \"image_url\": {\n                        \"url\": \"https://example.com/tech-conference.jpg\"\n                    }\n                },\n                {\n                    \"type\": \"text\",\n                    \"text\": \"这张图片显示的是什么样的科技会议？分析参会者的表情和氛围\"\n                }\n            ]\n        }\n    ]\n)\n\nprint(response.choices[0].message.content)</pre></div>\n<h3 id=\"52-视频分析\">5.2 视频分析</h3>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">response = client.chat.completions.create(\n    model=\"Qwen/Qwen3.5-397B-A17B\",\n    messages=[\n        {\n            \"role\": \"user\",\n            \"content\": [\n                {\n                    \"type\": \"video_url\",\n                    \"video_url\": {\n                        \"url\": \"https://example.com/product-demo.mp4\",\n                        \"detail\": \"high\",\n                        \"max_frames\": 16,\n                        \"fps\": 1\n                    }\n                },\n                {\n                    \"type\": \"text\",\n                    \"text\": \"这个产品演示视频展示了哪些核心功能？目标用户群体可能是什么？\"\n                }\n            ]\n        }\n    ],\n    stream=True\n)\n\n# 流式输出\nfor chunk in response:\n    content = chunk.choices[0].delta.content\n    if content:\n        print(content, end='', flush=True)</pre></div>\n<h3 id=\"53-音频理解\">5.3 音频理解</h3>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">response = client.chat.completions.create(\n    model=\"Qwen/Qwen3.5-397B-A17B\",\n    messages=[\n        {\n            \"role\": \"user\",\n            \"content\": [\n                {\n                    \"type\": \"audio_url\",\n                    \"audio_url\": {\n                        \"url\": \"data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEA...\"\n                    }\n                },\n                {\n                    \"type\": \"text\",\n                    \"text\": \"这段音频的主要内容和情感基调是什么？\"\n                }\n            ]\n        }\n    ]\n)</pre></div>\n<h2 id=\"6-paddleocr-客户端使用方法\">6. PaddleOCR 客户端使用方法</h2>\n<h3 id=\"61-cli-调用\">6.1 CLI 调用</h3>\n<p>可通过 <code>--vl_rec_backend</code> 指定后端类型<code>（vllm-server 或 sglang-server）</code>，通过 <code>--vl_rec_server_url</code> 指定服务地址，例如：</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">paddleocr doc_parser --input paddleocr_vl_demo.png --vl_rec_backend vllm-server --vl_rec_server_url http://localhost:8118/v1</pre></div>\n<p>此外，可通过 <code>--vl_rec_api_model_name</code> 指定服务使用的模型名称，<code>--vl_rec_api_key</code> 指定鉴权使用的 <code>API key</code>。示例如下：</p>\n<p>Ker平台：</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">paddleocr doc_parser \\\n    --input paddleocr_vl_demo.png \\\n    --vl_rec_backend vllm-server \\\n    --vl_rec_server_url https://api.kerapi.cn/v1 \\\n    --vl_rec_api_model_name 'PaddlePaddle/PaddleOCR-VL' \\\n    --vl_rec_api_key xxxxxx</pre></div>\n<h3 id=\"62-python-api-调用\">6.2 Python API 调用</h3>\n<p>创建 <code>PaddleOCRVL</code> 对象时传入 <code>vl_rec_backend</code> 和 <code>vl_rec_server_url</code> 参数，分别指定后端类型和服务地址：</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">pipeline = PaddleOCRVL(vl_rec_backend=\"vllm-server\", vl_rec_server_url=\"http://localhost:8118/v1\")</pre></div>\n<p>此外，可通过 <code>vl_rec_api_model_name</code> 指定服务使用的模型名称，<code>vl_rec_api_key</code> 指定鉴权使用的 <code>API key</code>。</p>\n<p>Ker平台：</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">pipeline = PaddleOCRVL(\n    vl_rec_backend=\"vllm-server\", \n    vl_rec_server_url=\"https://api.kerapi.cn/v1\",\n    vl_rec_api_model_name=\"PaddlePaddle/PaddleOCR-VL\",\n    vl_rec_api_key=\"xxxxxx\",\n)</pre></div>\n<h2 id=\"7-计费说明\">7. 计费说明</h2>\n<h3 id=\"71-视觉输入计费\">7.1 视觉输入计费</h3>\n<p>不同模型的视觉内容转换方式不同。下表对比展示核心规则与计费口径：</p>\n<table><thead><tr><th>模型系列</th><th>尺寸/像素约束</th><th>detail=low</th><th>detail=high</th><th>Token 计算方式</th></tr></thead><tbody><tr><td>Qwen 系列</td><td>最小 <code>56×56</code>，<br>最大 <code>3584×3584</code>；<br>按 <code>28</code> 的倍数取整到区间</td><td>统一 <code>448×448</code>，≈<code>256 token</code></td><td>长宽先上取整到 <code>28</code> 的倍数，再等比裁剪到区间</td><td><code>ceil(h/28) * ceil(w/28)</code></td></tr><tr><td>DeepseekVL2 系列</td><td>以 <code>384×384</code> 为基块；<br><code>1 ≤ h*w ≤ 9</code> 的 <code>(h,w)</code> 块数</td><td>统一 <code>384×384</code>，<code>421 token</code></td><td>按 <code>(h*384, w*384)</code> 放缩，选择有效像素最大且无效像素更小的组合</td><td><code>(h*w + 1) * 196 + (w + 1) * 14 + 1</code></td></tr><tr><td>GLM 系列</td><td>最小 <code>28×28</code>；<br>按 <code>28</code> 的倍数取整到区间；<br>若小于 <code>112×112</code> 或超出上限则回压到区间</td><td>统一 <code>448×448</code>，≈<code>256 token</code></td><td>长宽取最近 <code>28</code> 倍数并限制在 <code>(12544, 4816894)</code> 像素区间</td><td><code>(h/28) * (w/28)</code></td></tr><tr><td>DeepSeek-OCR</td><td>全局视图固定 <code>1024×1024</code>;<br>局部视图基准 <code>640×640</code></td><td>固定 <code>1024×1024，272 token</code></td><td>与 <code>640×640</code> 对比缩放，确定分块数</td><td><code>272 + (h×10)×(w×10+1) + 1</code>（尺寸&gt;640×640）;<br> <code>272 + 1</code>（尺寸≤640×640）</td></tr></tbody></table>\n<p>说明：</p>\n<ul>\n<li><code>h,w</code> 为最终用于计费的像素尺寸；表中 token 为视觉输入侧的估算，实际账单以请求时的最终转换结果为准。</li>\n</ul>\n<h3 id=\"72-视频输入计费\">7.2 视频输入计费</h3>\n<p>视频内容根据提取的帧数转换为 tokens：</p>\n<ul>\n<li>最终帧数 = <code>min(fps × 视频时长, max_frames)</code></li>\n<li>每帧图像按对应视觉模型的标准转换</li>\n</ul>\n<h3 id=\"73-音频输入计费\">7.3 音频输入计费</h3>\n<p>音频内容转换为 tokens 进行计费，对于 Qwen3 omni 多模态模型，输入音频每秒对应 13 个 token，  如 22.5s 音频对应 292 个 token。</p>\n<h2 id=\"8-最佳实践\">8. 最佳实践</h2>\n<h3 id=\"81-性能优化\">8.1 性能优化</h3>\n<ol>\n<li><strong>视频时长控制</strong>：建议 30 秒内以获得最佳分析效果</li>\n<li><strong>帧数选择</strong>：<code>max_frames=8-16</code>，<code>fps=1-2</code> 通常足够</li>\n<li><strong>图像尺寸</strong>：根据模型推荐尺寸进行预处理</li>\n</ol>\n<h3 id=\"82-使用建议\">8.2 使用建议</h3>\n<ol>\n<li><strong>逐步分析</strong>：复杂任务分解为多个简单步骤</li>\n<li><strong>多模态组合</strong>：充分利用不同类型媒体的优势</li>\n<li><strong>错误处理</strong>：检查媒体文件可访问性和格式兼容性</li>\n</ol>\n<h3 id=\"83-常见问题\">8.3 常见问题</h3>\n<p><strong>Q: 文件大小限制？</strong>\nA: 建议音频视频文件保持适中大小，超大文件可能影响性能</p>\n<p><strong>Q: 可以同时处理多少个媒体文件？</strong>\nA: 可以在同一请求中包含多个媒体 URL，但建议控制总体数据量</p>\n<p><strong>Q: 帧提取策略？</strong>\nA: 对于长视频，合理设置<code>fps</code>和<code>max_frames</code>参数以获得最优的分析效果和成本平衡</p>"}, "prefix": {"title": "前缀续写", "lead": "Prefix 前缀补全指南，通过预设前缀引导模型生成符合预期的内容。", "html": "<h2 id=\"1-使用场景\">1. 使用场景</h2>\n<p>前缀续写中，用户提供希望输出的前缀信息，来让模型基于用户提供的前缀信息来补全其余的内容。\n基于上述能力，模型能有更好的指令遵循能力，满足用户一些特定场景的指定格式的问题。</p>\n<h2 id=\"2-使用方式\">2. 使用方式</h2>\n<p>在请求中添加</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">extra_body={\"prefix\":\"希望的前缀内容\"}</pre></div>\n<h2 id=\"3-支持模型列表\">3. 支持模型列表</h2>\n<p>目前<a href=\"https://console.kerapi.cn/models?types=chat\">大语言类模型</a> 中非推理模型支持上述参数，推理模型中 Qwen3 系列，需要通过增加<code>enable_thinking=true</code>关闭推理后，支持上述参数，deepseek R1系列暂时不支持上述参数。</p>\n注意：支持的模型情况可能会发生变化，请查阅本文档了解最新支持的模型列表。\n<h2 id=\"4-使用示例\">4. 使用示例</h2>\n<p>下面是基于 OpenAI 库使用前缀续写的例子：</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">client = OpenAI(\n    api_key=\"您的 APIKEY\", # 从https://console.kerapi.cn/account/ak获取\n    base_url=\"https://api.kerapi.cn/v1\"\n)\n \nmessages = [\n    {\"role\": \"user\", \"content\": \"Please write quick sort code\"},\n]\n\nresponse = client.chat.completions.create(\n    model=\"Pro/zai-org/GLM-5.1\",\n    messages=messages,\n    extra_body={\"prefix\":\"```python\\n\"}\n)\n\nprint(response.choices[0].message.content)</pre></div>"}, "fim": {"title": "FIM 补全", "lead": "FIM（Fill In the Middle）补全指南，适用于代码自动补全和文本中间内容生成场景。", "html": "<h2 id=\"1-使用场景\">1. 使用场景</h2>\n<p>FIM (Fill In the Middle) 补全中，用户提供希望输入的前后内容，模型来补全中间的内容，典型用于代码补全、文本中间内容补全等场景中。</p>\n<h2 id=\"2-使用方式\">2. 使用方式</h2>\n<p>在 <code>/chat/completions</code> 接口中，通过 <code>extra_body</code> 传入 <code>prefix</code> 和 <code>suffix</code> 参数：</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">{ \n    \"model\": \"model info\",\n    \"messages\": \"prompt message\",\n    \"params\": \"params\",\n    \"extra_body\": {\"prefix\":\"前缀内容\", \"suffix\":\"后缀内容\"}\n}</pre></div>\n<h2 id=\"3-支持模型列表\">3. 支持模型列表</h2>\n<ul>\n<li>\n<p>Deepseek 系列：</p>\n<ul>\n<li>Pro/zai-org/GLM-5.1</li>\n<li>Pro/zai-org/GLM-5</li>\n<li>Pro/deepseek-ai/DeepSeek-R1</li>\n<li>deepseek-ai/DeepSeek-R1</li>\n<li>Pro/deepseek-ai/DeepSeek-V3</li>\n<li>deepseek-ai/DeepSeek-V3</li>\n</ul>\n</li>\n<li>\n<p>Qwen系列：</p>\n<ul>\n<li>Qwen/Qwen3-VL-30B-A3B-Instruct</li>\n<li>Qwen/Qwen3-VL-30B-A3B-Thinking</li>\n<li>Qwen/Qwen3-Omni-30B-A3B-Instruct</li>\n<li>Qwen/Qwen3-Omni-30B-A3B-Thinking</li>\n<li>Qwen/Qwen3-Omni-30B-A3B-Captioner</li>\n<li>Qwen/Qwen3-Coder-30B-A3B-Instruct</li>\n</ul>\n</li>\n</ul>\n注意：支持的模型列表可能会发生变化，请在<a href=\"https://console.kerapi.cn/sft-ker/models?tags=FIM\">模型广场</a>中筛选查看最新支持 FIM 的模型。\n<h2 id=\"4-使用示例\">4. 使用示例</h2>\n<p>基于 OpenAI SDK 的 <code>/chat/completions</code> 接口使用 FIM 补全：</p>\n<div class=\"code-wrap\"><button class=\"copy-btn\" data-copy title=\"复制代码\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"14\" height=\"14\" x=\"8\" y=\"8\" rx=\"2\" ry=\"2\"/><path d=\"M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2\"/></svg></button><pre class=\"code\">client = OpenAI(\n    api_key=\"您的 APIKEY\", # 从https://console.kerapi.cn/account/ak获取\n    base_url=\"https://api.kerapi.cn/v1\"\n)\n \nmessages = [\n    {\"role\": \"user\", \"content\": \"Please write quick sort code\"},\n]\n\nresponse = client.chat.completions.create(\n    model=\"Pro/zai-org/GLM-5.1\",\n    messages=messages,\n    extra_body={\n            \"prefix\": f\"\"\"\ndef quick_sort(arr):\n    # 基本情况，如果数组长度小于等于 1，则返回数组\n    if len(arr) &lt;= 1:\n        return arr\n    else:\n\"\"\",\n            \"suffix\": f\"\"\"\n# 测试 quick_sort 函数\narr = [3, 6, 8, 10, 1, 2, 1]\nsorted_arr = quick_sort(arr)\nprint(\"Sorted array:\", sorted_arr)\n\"\"\"\n    },\n    stream=True,\n    max_tokens=4096\n)\n\nfor chunk in response:\n    print(chunk.choices[0].delta.content, end='')</pre></div>"}, "images": {"title": "图片生成", "lead": "了解 Ker 图像生成能力，支持文生图、图生图等 API 调用方式与模型列表。", "html": "<h2 id=\"1生图模型简介\">1.生图模型简介</h2>\n<p>平台提供的生图模型主要有以下两种使用方式：一种是根据prompt输入直接生成图像；一种是
